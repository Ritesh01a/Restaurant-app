\n    const n = btns[(i + step + btns.length) % btns.length];\n    n.focus(); selectRole(n.dataset.role, false);\n  });\n  $$('.role', rolesEl).forEach((b, i) => { b.tabIndex = i === 0 ? 0 : -1; });\n\n  function setField(n, cfg) {\n    const f = el['f' + n], i = el['i' + n];\n    f.hidden = !cfg;\n    if (!cfg) return;\n    el['l' + n].textContent = cfg.label;\n    i.type = cfg.type; i.inputMode = cfg.mode; i.placeholder = cfg.ph; i.autocomplete = cfg.ac;\n    i.value = ''; i.removeAttribute('maxlength'); if (cfg.max) i.maxLength = cfg.max;\n    f.style.animation = 'none'; void f.offsetWidth; f.style.animation = '';\n    clearErr(n);\n  }\n\n  function buildForm() {\n    const c = ROLES[role];\n    $('#formTitle').textContent = c.title;\n    setField(1, c.f1); setField(2, c.f2);\n    el.p1.hidden = !c.f1.prefix;\n    el.eye.hidden = !(c.f2 && c.f2.eye);\n    el.eye.setAttribute('aria-pressed', 'false');\n    el.eye.setAttribute('aria-label', 'Show password');\n    el.label.textContent = c.cta;\n    el.alt.hidden = true;\n    $('#hint').innerHTML = c.hint;\n  }\n\n  // ---------- Validation ----------\n  function setErr(n, msg) {\n    const f = el['f' + n], e = el['e' + n], i = el['i' + n];\n    f.classList.add('has-error'); e.textContent = msg; e.hidden = false;\n    i.setAttribute('aria-invalid', 'true'); i.setAttribute('aria-describedby', 'e' + n);\n    f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');\n  }\n  function clearErr(n) {\n    const f = el['f' + n], e = el['e' + n], i = el['i' + n];\n    f.classList.remove('has-error', 'shake'); e.hidden = true; e.textContent = '';\n    i.removeAttribute('aria-invalid'); i.removeAttribute('aria-describedby');\n  }\n\n  el.i1.addEventListener('input', () => {\n    if (role === 'user' && !otpStep) el.i1.value = el.i1.value.replace(/\\D/g, '');\n    clearErr(1);\n  });\n  el.i2.addEventListener('input', () => {\n    if (role === 'service' || (role === 'user' && otpStep)) el.i2.value = el.i2.value. min\n    if (role === 'service') {\n      if (!/^[A-Za-z]-?\\d{2,4}$/.test(v1)) { setErr(1, 'Enter your staff ID, like W-102.'); ok = false; }\n      if (!/^\\d{4}$/.test(v2)) { setErr(2, 'PIN must be 4 digits.'); ok = false; }\n    } else {\n      if (!/^\\S+@\\S+\\.\\S+$/.test(v1)) { setErr(1, 'Enter a valid work email.'); ok = false; }\n      if (v2.length < 6) { setErr(2, 'Password must be at least 6 characters.'); ok = false; }\n    }\n    if (!ok) { (el.f1.classList.contains('has-error') ? el.i1 : el.i2).focus(); return; }\n\n    await run('Signing in\u2026', 1100); // real app: POST /auth/login { role, id, secret }\n    const good = role === 'service'\n      ? v1.toUpperCase().replace('-', '') === 'W102' && v2 === '1234'\n      : v1.toLowerCase() === 'manager@emberplate.in' && v2 === 'Ember@123';\n\n    if (!good) {\n      setErr(2, role === 'service' ? 'Staff ID or PIN is incorrect.' : 'Email or password is incorrect.');\n      el.i2.focus(); return;\n    }\n    success({ role, id: v1 });\n  });\n\n  async function run(text, ms) {\n    busy = true; el.submit.setAttribute('aria-busy', 'true');\n    const prev = el.label.textContent; el.label.textContent = text;\n    announce(text);\n    await wait(ms);\n    busy = false; el.submit.removeAttribute('aria-busy'); el.label.textContent = prev;\n  }\n\n  // ---------- Success + redirect ----------\n  function success(user) {\n    write(AUTH_KEY, { ...user, at: Date.now() });\n    showOk(user);\n    if (navigator.vibrate) navigator.vibrate(30);\n  }\n\n  function showOk(user) {\n    const c = ROLES[user.role];\n    clearTimeout(redirectTimer);\n\n    $('#screen').hidden = true;\n    $('#ok').hidden = false;\n    $('#okTitle').textContent = `Signed in as ${NAMES[user.role]}`;\n    $('#okText').textContent = c.welcome;\n\n    const link = $('#okLink');\n    link.href = c.next;\n    link.textContent = c.nextLabel;\n    link.hidden = false;\n\n    const redir = $('#okRedir');\n    redir.hidden = false;\n    redir.classList.remove('is-run');\n    $('#okRedirText').textContent = c.goText;\n    void redir.offsetWidth;\n    redir.classList.add('is-run');\n    redirectTimer = setTimeout(() => { EP.go(c.next); }, reduce.matches ? 600 : REDIRECT_MS);\n\n    announce(`Signed in as ${NAMES[user.role]}. ${c.goText}`);\n    setTimeout(() => $('#okTitle').focus(), 80);\n    window.scrollTo(0, 0);\n  }\n\n  $('#okOut').addEventListener('click', () => {\n    clearTimeout(redirectTimer);\n    del(AUTH_KEY);\n    $('#ok').hidden = true; $('#screen').hidden = false;\n    form.hidden = true; role = null;\n    $$('.role', rolesEl).forEach((b, i) => {\n      b.setAttribute('aria-checked', 'false');\n      b.tabIndex = i === 0 ? 0 : -1;\n    });\n    $('#scanLink').hidden = true;\n    announce('Signed out.');\n  });\n\n  // ---------- Start-up ----------\n  // Opening the login page always starts fresh (signs out any old session).\n  // ?role=admin|service|user pre-selects a role.\n  del(AUTH_KEY);\n  const q = new URLSearchParams(window.EP ? EP.search : location.search).get('role');\n  if (ROLES[q]) selectRole(q, false);\n\n  // Back button: if the browser restores this page from cache, reload it fresh\n  window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });\n})();\n<\/script>\n<\/body>\n<\/html>",

pt__ico\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"18.5\" cy=\"17.5\" r=\"3.5\"/><circle cx=\"5.5\" cy=\"17.5\" r=\"3.5\"/><circle cx=\"15\" cy=\"5\" r=\"1\"/><path d=\"M12 17.5V14l-3-3 4-3 2 3h2\"/><\/svg>\n        <\/span>\n        <span class=\"opt__body\"><strong>Delivery<\/strong><small id=\"delSub\">Fire-grilled favourites, at your door<\/small><\/span>\n        <span class=\"opt__go\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"/><\/svg><\/span>\n      <\/a>\n\n      <a class=\"opt rise\" id=\"optDine\" href=\"#scan\" style=\"--d:230ms\">\n        <span class=\"opt__ico\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7\"/><\/svg>\n        <\/span>\n        <span class=\"opt__body\"><strong>Dine in<\/strong><small>Scan the QR code at your table<\/small><\/span>\n        <span class=\"opt__go\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"/><\/svg><\/span>\n      <\/a>\n\n      <a class=\"opt rise\" id=\"optBook\" href=\"#book\" style=\"--d:300ms\">\n        <span class=\"opt__ico\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/><\/svg>\n        <\/span>\n        <span class=\"opt__body\"><strong>Book a table<\/strong><small>Reserve for today or the next 2 days<\/small><\/span>\n        <span class=\"opt__go\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"/><\/svg><\/span>\n      <\/a>\n\n    <\/nav>\n    <p class=\"note rise\" style=\"--d:380ms\">Free delivery on orders of \u20b9599 and above<\/p>\n  <\/main>\n<\/div>\n<\/template>\n\n<\!-- ===== SCREEN: location ===== -->\n<template id=\"tpl-location\">\n<style>\n/* ==========================================================\n   Barbiqnation \u00b7 Set delivery location\n   Tokens follow the design system spec\n   ========================================================== */\n:host {\n  --color-primary: #B83225;\n  --color-primary-pressed: #9A281D;\n  --color-bg: #FFF8EF;\n  --color-text: #29211E;\n  --color-surface: #FFFFFF;\n  --color-border: #E9DFD2;\n  --color-text-secondary: #756A64;\n  --color-disabled-surface: #EDE5DB;\n  --color-disabled-text: #91867D;\n  --color-error: #B42318;\n  --color-success: #237A45;\n\n  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;\n  --space-5: 20px; --space-6: 24px; --space-8: 32px;\n\n  --radius-input: 10px;\n  --radius-btn: 12px;\n  --radius-card: 16px;\n\n  --shadow-sm: 0 2px 8px rgba(41, 33, 30, .10);\n  --ease: cubic-bezier(.2, .8, .2, 1);\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n\n:host {\n  margin: 0;\n  font-family: \"Manrope\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  font-size: 14px; line-height: 20px;\n  color: var(--color-text);\n  background: var(--color-bg);\n}\nbutton, input { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\nh1, h2, p, ul { margin: 0; padding: 0; }\nul { list-style: none; }\n[hidden] { display: none !important; }\n\n.sr-only {\n  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;\n  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;\n}\n\n/* Visible 2px focus ring everywhere */\n:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }\n\n/* ---------- App frame ---------- */\n.app { max-width: 480px; min-height: 100vh; margin: 0 auto; background: var(--color-bg); position: relative; overflow-x: hidden; }\n.screen { min-height: 100vh; }\n\n/* ---------- Header ---------- */\n.topbar {\n  position: sticky; top: 0; z-index: 5;\n  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;\n  padding: var(--space-2) var(--space-4);\n  background: var(--color-bg);\n}\n.topbar__title { text-align: center; font-size: 22px; line-height: 30px; font-weight: 700; }\n.icon-btn {\n  width: 44px; height: 44px; display: grid; place-items: center;\n  border: 0; border-radius: 50%; background: transparent; color: var(--color-text);\n  margin-left: -10px;\n  transition: background-color .15s ease, transform .12s ease;\n}\n.icon-btn:hover { background: rgba(41, 33, 30, .06); }\n.icon-btn:active { transform: scale(.92); }\n\n.content { padding: var(--space-2) var(--space-4) var(--space-8); display: flex; flex-direction: column; gap: var(--space-5); }\n\n/* ---------- Entrance motion ---------- */\n.reveal { opacity: 0; transform: translateY(12px); animation: reveal .45s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 70ms); }\n@keyframes reveal { to { opacity: 1; transform: none; } }\n\n/* ---------- Map ---------- */\n.map-wrap { position: relative; padding-bottom: 24px; }\n.map-card {\n  position: relative; height: 220px; overflow: hidden;\n  border-radius: var(--radius-card); border: 1px solid var(--color-border); background: #F4EADB;\n}\n.map-art { position: absolute; inset: 0; width: 100%; height: 100%; transform: scale(1.12); transition: transform 1s var(--ease), opacity .4s ease; }\n.map-card.is-panned .map-art { transform: scale(1.12) translate(-14px, 8px); }\n\n.map-skeleton {\n  position: absolute; inset: 0; z-index: 2;\n  background: linear-gradient(100deg, #F1E6D6 30%, #FBF3E7 50%, #F1E6D6 70%);\n  background-size: 200% 100%; animation: shimmer 1.3s linear infinite;\n  transition: opacity .4s ease;\n}\n@keyframes shimmer { to { background-position: -200% 0; } }\n.map-card:not(.is-loading) .map-skeleton { opacity: 0; pointer-events: none; }\n.map-card.is-loading .pin { opacity: 0; }\n\n/* Pin */\n.pin { position: absolute; left: 50%; top: 50%; width: 32px; height: 40px; margin: -40px 0 0 -16px; z-index: 3; transition: opacity .2s ease; }\n.pin__icon { position: relative; z-index: 2; display: block; filter: drop-shadow(0 3px 3px rgba(41, 33, 30, .25)); transform-origin: 50% 100%; }\n.pin__halo {\n  position: absolute; left: 50%; bottom: -14px; width: 64px; height: 64px; margin-left: -32px;\n  border-radius: 50%; background: rgba(255, 248, 239, .85);\n  box-shadow: 0 0 0 10px rgba(255, 248, 239, .45);\n  animation: halo 2.4s ease-in-out infinite;\n}\n.pin__shadow { position: absolute; left: 50%; bottom: -3px; width: 14px; height: 5px; margin-left: -7px; border-radius: 50%; background: rgba(41, 33, 30, .25); }\n@keyframes halo { 0%, 100% { transform: scale(.9); opacity: .9; } 50% { transform: scale(1.12); opacity: .6; } }\n.map-card:not(.is-loading) .pin__icon { animation: pinDrop .7s var(--ease) both; }\n.map-card.is-bouncing .pin__icon { animation: pinBounce .6s var(--ease); }\n@keyframes pinDrop { 0% { transform: translateY(-60px); opacity: 0; } 60% { transform: translateY(4px); opacity: 1; } 80% { transform: translateY(-4px); } 100% { transform: none; } }\n@keyframes pinBounce { 0%, 100% { transform: none; } 35% { transform: translateY(-14px); } 65% { transform: translateY(2px); } }\n\n/* Floating address chip */\n.addr-chip {\n  position: absolute; left: var(--space-3); right: var(--space-3); bottom: 0; z-index: 4;\n  display: flex; align-items: center; gap: var(--space-2);\n  min-height: 44px; padding: var(--space-3);\n  background: var(--color-surface); color: var(--color-text);\n  border: 1px solid var(--color-border); border-radius: var(--radius-btn);\n  box-shadow: var(--shadow-sm);\n  transition: border-color .25s ease, background-color .25s ease;\n}\n.addr-chip__text { flex: 1; min-width: 0; user-select: text; -webkit-user-select: text; overflow-wrap: anywhere; }\n.addr-chip__icon { display: grid; flex: none; }\n.addr-chip__icon--pin { color: var(--color-primary); }\n.addr-chip__icon--check { display: none; color: var(--color-success); }\n.addr-chip[data-variant=\"empty\"] .addr-chip__text { color: var(--color-text-secondary); }\n.addr-chip[data-variant=\"confirmed\"] { border-color: var(--color-success); background: #F3FAF5; animation: chipPop .4s var(--ease); }\n.addr-chip[data-variant=\"confirmed\"] .addr-chip__icon--pin { display: none; }\n.addr-chip[data-variant=\"confirmed\"] .addr-chip__icon--check { display: grid; }\n.addr-chip[data-variant=\"confirmed\"] .addr-chip__icon--check path { stroke-dasharray: 20; stroke-dashoffset: 20; animation: draw .45s .15s ease forwards; }\n.addr-chip.is-updating .addr-chip__text { animation: textSwap .35s ease; }\n@keyframes chipPop { 0% { transform: scale(.96); } 60% { transform: scale(1.02); } 100% { transform: none; } }\n@keyframes draw { to { stroke-dashoffset: 0; } }\n@keyframes textSwap { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }\n\n/* ---------- Buttons ---------- */\n.btn {\n  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);\n  width: 100%; height: 48px; padding: 0 var(--space-5);\n  border: 1.5px solid transparent; border-radius: var(--radius-btn);\n  font-size: 15px; line-height: 20px; font-weight: 700;\n  transition: background-color .15s ease, transform .12s ease, border-color .15s ease, box-shadow .2s ease;\n}\n.btn:active:not(:disabled) { transform: scale(.98); }\n.btn--primary { background: var(--color-primary); color: #FFFFFF; }\n.btn--primary:hover:not(:disabled) { box-shadow: 0 6px 16px rgba(184, 50, 37, .28); }\n.btn--primary:active:not(:disabled) { background: var(--color-primary-pressed); }\n.btn--outline { background: transparent; color: var(--color-primary); border-color: var(--color-primary); }\n.btn--outline:hover:not(:disabled) { background: rgba(184, 50, 37, .06); }\n.btn--outline:active:not(:disabled) { background: rgba(184, 50, 37, .12); }\n.btn--compact { height: 40px; }\n.btn--confirm { margin-top: var(--space-3); animation: reveal .3s var(--ease); }\n.btn:disabled { cursor: not-allowed; background: var(--color-disabled-surface); color: var(--color-disabled-text); border-color: transparent; }\n.btn__icon { flex: none; }\n\n/* Loading: spinner appears, label preserved */\n.btn__spinner {\n  display: none; width: 18px; height: 18px; flex: none;\n  border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%;\n  animation: spin .7s linear infinite;\n}\n.btn.is-loading { cursor: progress; }\n.btn.is-loading .btn__spinner { display: inline-block; }\n.btn.is-loading .btn__icon { display: none; }\n.btn--primary.is-loading:disabled { background: var(--color-primary); color: #FFFFFF; opacity: .88; }\n.btn--outline.is-loading:disabled { background: transparent; color: var(--color-primary); border-color: var(--color-primary); }\n@keyframes spin { to { transform: rotate(360deg); } }\n\n/* ---------- Divider ---------- */\n.divider { display: flex; align-items: center; gap: var(--space-3); color: var(--color-text-secondary); font-size: 12px; line-height: 16px; font-weight: 500; }\n.divider__rule { flex: 1; height: 1px; background: var(--color-border); }\n\n/* ---------- Input ---------- */\n.field__label { display: block; margin-bottom: var(--space-2); font-size: 14px; line-height: 20px; font-weight: 600; }\n.field__control {\n  display: flex; align-items: center; gap: var(--space-2);\n  height: 48px; padding: 0 var(--space-3);\n  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-input);\n  transition: border-color .15s ease, box-shadow .2s ease;\n}\n.field__control:focus-within { border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(184, 50, 37, .22); }\n.field__control.has-error { border-color: var(--color-error); }\n.field__icon { color: var(--color-text-secondary); flex: none; }\n.field__input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font-size: 16px; }\n.field__clear { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--color-disabled-surface); color: var(--color-text); flex: none; }\n.field__clear:focus-visible { outline-offset: 0; }\n.field__help { margin-top: var(--space-1); font-size: 12px; line-height: 16px; color: var(--color-text-secondary); }\n\n/* ---------- Out-of-area notice ---------- */\n.notice {\n  margin-top: var(--space-3); padding: var(--space-3);\n  background: var(--color-surface); border: 1px solid var(--color-error); border-radius: var(--radius-btn);\n  display: flex; flex-direction: column; gap: var(--space-3);\n  animation: noticeIn .35s var(--ease);\n}\n.notice__row { display: flex; gap: var(--space-2); align-items: flex-start; }\n.notice__icon { color: var(--color-error); flex: none; margin-top: 0; }\n.notice__text { color: var(--color-text); }\n@keyframes noticeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }\n.notice.shake { animation: noticeIn .35s var(--ease), shake .4s .1s ease; }\n@keyframes shake { 0%, 100% { translate: 0; } 25% { translate: -5px; } 75% { translate: 5px; } }\n\n/* ---------- Saved addresses ---------- */\n.saved__title { margin-bottom: var(--space-3); font-size: 18px; line-height: 26px; font-weight: 600; }\n.saved__list { display: flex; flex-direction: column; gap: var(--space-2); }\n\n.addr-card {\n  position: relative; display: flex; align-items: center; gap: var(--space-2);\n  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-btn);\n  transition: border-color .2s ease, background-color .2s ease, transform .15s ease, box-shadow .2s ease;\n}\n.addr-card:hover { box-shadow: var(--shadow-sm); }\n.addr-card:active { transform: scale(.99); }\n.addr-card:has(input:checked) { border-color: var(--color-primary); background: #FFFBF6; box-shadow: 0 0 0 1px var(--color-primary); }\n.addr-card:has(input:focus-visible) { outline: 2px solid var(--color-primary); outline-offset: 2px; }\n.addr-card__main { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); cursor: pointer; }\n.addr-card__input { position: absolute; opacity: 0; pointer-events: none; }\n\n/* Radio indicator: ring + check shape (not colour alone) */\n.radio {\n  flex: none; width: 24px; height: 24px; display: grid; place-items: center;\n  border: 2px solid var(--color-text-secondary); border-radius: 50%; color: #fff;\n  transition: background-color .2s ease, border-color .2s ease, transform .25s var(--ease);\n}\n.radio svg { opacity: 0; transform: scale(.4); transition: opacity .15s ease, transform .25s var(--ease); }\n.addr-card:has(input:checked) .radio { background: var(--color-primary); border-color: var(--color-primary); transform: scale(1.08); }\n.addr-card:has(input:checked) .radio svg { opacity: 1; transform: none; }\n\n.addr-card__body { min-width: 0; }\n.addr-card__label { font-size: 14px; line-height: 20px; font-weight: 600; }\n.addr-card__address { font-size: 12px; line-height: 16px; font-weight: 400; color: var(--color-text-secondary); }\n.addr-card__edit {\n  flex: none; min-height: 44px; min-width: 44px; padding: 0 var(--space-3);\n  border: 0; background: transparent; color: var(--color-primary);\n  font-size: 14px; font-weight: 600; border-radius: var(--radius-btn);\n}\n.addr-card__edit:hover { text-decoration: underline; }\n\n/* ---------- Menu stub ---------- */\n.screen--menu { animation: slideIn .45s var(--ease); }\n@keyframes slideIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }\n.menu-head { padding: var(--space-4); background: var(--color-text); color: var(--color-bg); border-radius: 0 0 20px 20px; }\n.menu-head__brand { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }\n.menu-head__top { margin-bottom: var(--space-3); }\n.menu-head__addr {\n  width: 100%; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); min-height: 44px;\n  background: rgba(255, 248, 239, .08); border: 1px solid rgba(255, 248, 239, .18); border-radius: var(--radius-btn);\n  color: inherit; text-align: left;\n}\n.menu-head__addr:focus-visible { outline-color: var(--color-bg); }\n.menu-head__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }\n.menu-head__eyebrow { font-size: 12px; line-height: 16px; font-weight: 500; opacity: .75; }\n.menu-head__value { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.menu-head__change { font-size: 14px; font-weight: 700; color: #FFB4A8; }\n.menu-body { padding: var(--space-6) var(--space-4); }\n.menu-body__title { font-size: 22px; line-height: 30px; font-weight: 700; margin-bottom: var(--space-2); }\n.menu-body__copy { color: var(--color-text-secondary); }\n\n/* ---------- Reduced motion ---------- */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }\n  .reveal { opacity: 1; transform: none; }\n  .map-skeleton { animation: none; }\n  /* keep a slow spinner so loading is still perceivable */\n  .btn__spinner { animation: spin 1.6s linear infinite !important; }\n}\n\n:host { display: block; }\n\n<\/style>\n<div class=\"app\" id=\"app\">\n\n    <\!-- ============ SCREEN: SET DELIVERY LOCATION ============ -->\n    <section class=\"screen\" id=\"screenLocation\" data-state=\"loading\" aria-labelledby=\"pageTitle\">\n\n      <header class=\"topbar\">\n        <button class=\"icon-btn\" id=\"backBtn\" type=\"button\" aria-label=\"Back\">\n          <svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 18-6-6 6-6\"/><\/svg>\n        <\/button>\n        <h1 class=\"topbar__title\" id=\"pageTitle\">Delivery location<\/h1>\n        <span class=\"topbar__spacer\" aria-hidden=\"true\"><\/span>\n      <\/header>\n\n      <main class=\"content\">\n\n        <\!-- Map preview -->\n        <section class=\"map-wrap reveal\" style=\"--i:0\" aria-label=\"Map preview\">\n          <div class=\"map-card\" id=\"mapCard\" aria-hidden=\"true\">\n            <div class=\"map-skeleton\" id=\"mapSkeleton\"><\/div>\n\n            <svg class=\"map-art\" id=\"mapArt\" viewBox=\"0 0 400 220\" preserveAspectRatio=\"xMidYMid slice\">\n              <rect width=\"400\" height=\"220\" fill=\"#F4EADB\"/>\n              <rect x=\"-20\" y=\"150\" width=\"160\" height=\"90\" rx=\"18\" fill=\"#E6EBD3\"/>\n              <path d=\"M260 -10 C 290 60, 250 120, 330 240 L 400 240 L 400 -10 Z\" fill=\"#E4E8E6\" opacity=\".7\"/>\n              <g stroke=\"#FFFFFF\" stroke-linecap=\"round\" fill=\"none\">\n                <path d=\"M-10 70 L 410 95\" stroke-width=\"12\"/>\n                <path d=\"M-10 160 L 410 140\" stroke-width=\"9\"/>\n                <path d=\"M120 -10 L 150 240\" stroke-width=\"10\"/>\n                <path d=\"M250 -10 L 235 240\" stroke-width=\"12\"/>\n                <path d=\"M40 -10 L 70 240\" stroke-width=\"5\"/>\n                <path d=\"M340 -10 L 360 240\" stroke-width=\"5\"/>\n                <path d=\"M-10 25 L 410 40\" stroke-width=\"5\"/>\n                <path d=\"M-10 200 L 410 190\" stroke-width=\"5\"/>\n              <\/g>\n              <g stroke=\"#E9DFD2\" stroke-width=\"1.2\" fill=\"none\">\n                <path d=\"M-10 70 L 410 95\"/><path d=\"M-10 160 L 410 140\"/>\n                <path d=\"M120 -10 L 150 240\"/><path d=\"M250 -10 L 235 240\"/>\n              <\/g>\n            <\/svg>\n\n            <div class=\"pin\" id=\"pin\">\n              <span class=\"pin__halo\"><\/span>\n              <svg class=\"pin__icon\" viewBox=\"0 0 32 40\" width=\"32\" height=\"40\" aria-hidden=\"true\">\n                <path d=\"M16 0C7.7 0 1 6.5 1 14.6 1 25.5 16 40 16 40s15-14.500 15-25.400C31 6.500 24.300 0 16 0Z\" fill=\"#B83225\"/>\n                <circle cx=\"16\" cy=\"14.500\" r=\"5.500\" fill=\"#FFF8EF\"/>\n              <\/svg>\n              <span class=\"pin__shadow\"><\/span>\n            <\/div>\n          <\/div>\n\n          <div class=\"addr-chip\" id=\"addrChip\" data-variant=\"empty\">\n            <span class=\"addr-chip__icon addr-chip__icon--pin\" aria-hidden=\"true\">\n              <svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><\/svg>\n            <\/span>\n            <span class=\"addr-chip__icon addr-chip__icon--check\" aria-hidden=\"true\">\n              <svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m8 12.500 2.700 2.700L16 9.500\"/><\/svg>\n            <\/span>\n            <span class=\"addr-chip__text\" id=\"addrText\">No location set yet<\/span>\n          <\/div>\n        <\/section>\n\n        <\!-- Screen-reader announcements -->\n        <p class=\"sr-only\" id=\"liveRegion\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"><\/p>\n\n        <\!-- Primary action -->\n        <button class=\"btn btn--primary reveal\" style=\"--i:1\" id=\"locateBtn\" type=\"button\">\n          <span class=\"btn__spinner\" aria-hidden=\"true\"><\/span>\n          <svg class=\"btn__icon\" viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><\/svg>\n          <span class=\"btn__label\">Use my current location<\/span>\n        <\/button>\n\n        <\!-- Divider -->\n        <div class=\"divider reveal\" style=\"--i:2\" role=\"separator\" aria-label=\"or\">\n          <span class=\"divider__rule\"><\/span><span class=\"divider__text\">or<\/span><span class=\"divider__rule\"><\/span>\n        <\/div>\n\n        <\!-- Manual entry -->\n        <form class=\"field reveal\" style=\"--i:3\" id=\"addressForm\" novalidate>\n          <label class=\"field__label\" for=\"addressInput\">Enter your address<\/label>\n          <div class=\"field__control\" id=\"fieldControl\">\n            <svg class=\"field__icon\" viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.300-4.300\"/><\/svg>\n            <input class=\"field__input\" id=\"addressInput\" name=\"address\" type=\"text\" autocomplete=\"street-address\" aria-describedby=\"addressHelp\" />\n            <button class=\"field__clear\" id=\"clearBtn\" type=\"button\" aria-label=\"Clear address\" hidden>\n              <svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.500\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/><\/svg>\n            <\/button>\n          <\/div>\n          <p class=\"field__help\" id=\"addressHelp\">Street, area or postcode<\/p>\n\n          <button class=\"btn btn--outline btn--confirm\" id=\"confirmBtn\" type=\"submit\" hidden>\n            <span class=\"btn__spinner\" aria-hidden=\"true\"><\/span>\n            <span class=\"btn__label\">Confirm address<\/span>\n          <\/button>\n\n          <\!-- Out-of-area notice -->\n          <div class=\"notice\" id=\"areaNotice\" role=\"alert\" hidden>\n            <div class=\"notice__row\">\n              <svg class=\"notice__icon\" viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 8v4M12 16h.01\"/><\/svg>\n              <p class=\"notice__text\">We don't deliver to this address yet. Try a nearby postcode.<\/p>\n            <\/div>\n            <button class=\"btn btn--outline btn--compact\" id=\"checkAnotherBtn\" type=\"button\">Check another address<\/button>\n          <\/div>\n        <\/form>\n\n        <\!-- Saved addresses -->\n        <section class=\"saved reveal\" style=\"--i:4\" aria-labelledby=\"savedTitle\">\n          <h2 class=\"saved__title\" id=\"savedTitle\">Saved addresses<\/h2>\n          <ul class=\"saved__list\" id=\"savedList\"><\/ul>\n        <\/section>\n\n      <\/main>\n    <\/section>\n\n    <\!-- ============ SCREEN: MENU (stub to show the pinned address) ============ -->\n    <section class=\"screen screen--menu\" id=\"screenMenu\" hidden aria-label=\"Menu\">\n      <header class=\"menu-head\">\n        <div class=\"menu-head__top\">\n          <span class=\"menu-head__brand\">barbiqnation<\/span>\n        <\/div>\n        <button class=\"menu-head__addr\" id=\"menuAddrBtn\" type=\"button\" aria-label=\"Change delivery address\">\n          <svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><\/svg>\n          <span class=\"menu-head__text\"><span class=\"menu-head__eyebrow\">Delivering to<\/span><span class=\"menu-head__value\" id=\"menuAddrText\"><\/span><\/span>\n          <span class=\"menu-head__change\">Change<\/span>\n        <\/button>\n      <\/header>\n      <main class=\"menu-body\">\n        <h2 class=\"menu-body__title\">Explore our menu<\/h2>\n        <p class=\"menu-body__copy\">Menu screen goes here. The delivery address stays pinned in the header.<\/p>\n      <\/main>\n    <\/section>\n\n  <\/div>\n<\/template>\n\n<\!-- ===== SCREEN: menu ===== -->\n<template id=\"tpl-menu\">\n<style>\n/* ==========================================================\n   Ember & Plate \u00b7 Browse menu (delivery)\n   ========================================================== */\n:host {\n  --primary: #B83225;\n  --primary-hover: #98281F;\n  --primary-subtle: #F5E3DF;\n  --bg: #FFF8EF;\n  --surface: #FFFFFF;\n  --text: #29211E;\n  --text-2: #756A64;\n  --border: #E9DFD2;\n  --disabled: #B9AEA7;\n  --veg: #237A45;\n  --nonveg: #B42318;\n\n  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;\n  --r-card: 16px; --r-btn: 12px; --r-input: 12px;\n  --ease: cubic-bezier(.2, .8, .2, 1);\n  --tab-h: calc(64px + env(safe-area-inset-bottom, 0px));\n  --header-h: 112px;\n  --rail-h: 56px;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n\n\n:host { margin: 0; font-family: \"Inter\", system-ui, -apple-system, \"Segoe UI\", sans-serif; font-size: 14px; line-height: 20px; color: var(--text); background: var(--bg); }\nbutton, input { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\nh1, h2, h3, p, ul { margin: 0; padding: 0; }\nul { list-style: none; }\na { color: inherit; text-decoration: none; }\n[hidden] { display: none !important; }\n:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }\n.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }\n\n.app { max-width: 480px; min-height: 100vh; margin: 0 auto; position: relative; background: var(--bg); }\n\n/* ---------- Offline banner ---------- */\n.offline { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4); background: var(--text); color: var(--bg); font-size: 12px; line-height: 16px; font-weight: 500; animation: dropIn .3s var(--ease); }\n@keyframes dropIn { from { transform: translateY(-100%); opacity: 0; } to { transform: none; opacity: 1; } }\n\n/* ---------- Header ---------- */\n.header { position: sticky; top: 0; z-index: 20; padding: var(--s2) var(--s4) var(--s3); background: var(--bg); transition: box-shadow .2s ease; }\n.header.is-stuck { box-shadow: 0 4px 14px rgba(41, 33, 30, .08); }\n.header__row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); }\n\n.loc-chip { display: inline-flex; align-items: center; gap: var(--s1); min-height: 40px; max-width: calc(100% - 56px); padding: 0 var(--s3) 0 var(--s2); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 500; transition: border-color .15s ease, transform .12s ease; }\n.loc-chip svg { flex: none; color: var(--primary); }\n.loc-chip:hover { border-color: var(--primary); }\n.loc-chip:active { transform: scale(.97); }\n.loc-chip__text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n\n.cart-btn { position: relative; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--text); transition: color .2s ease, background-color .15s ease, transform .12s ease; }\n.cart-btn:hover { background: rgba(41, 33, 30, .06); }\n.cart-btn:active { transform: scale(.92); }\n.cart-btn.is-active { color: var(--primary); }\n.cart-btn__badge { position: absolute; top: 2px; right: 0; min-width: 20px; height: 20px; padding: 0 5px; display: grid; place-items: center; border-radius: 999px; border: 2px solid var(--bg); background: var(--primary); color: #fff; font-size: 11px; line-height: 1; font-weight: 700; }\n.bump { animation: bump .35s var(--ease); }\n@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }\n\n/* ---------- Search ---------- */\n.search { display: flex; align-items: center; gap: var(--s2); height: 48px; padding: 0 var(--s3); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-input); transition: border-color .15s ease, box-shadow .2s ease; }\n.search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(184, 50, 37, .2); }\n.search__icon { flex: none; color: var(--text-2); }\n.search__input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font-size: 16px; }\n.search__input::placeholder { color: var(--text-2); }\n.search__clear { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--border); color: var(--text); animation: pop .2s var(--ease); }\n.search__clear:focus-visible { outline-offset: 0; }\n@keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }\n\n/* ---------- Mode pill ---------- */\n.mode-row { padding: 0 var(--s4) var(--s2); }\n.mode-pill { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--s3); border: 0; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 12px; line-height: 16px; font-weight: 600; transition: transform .12s ease; }\n.mode-pill::before { content: \"\"; position: absolute; inset: -8px -4px; }\n.mode-pill:active { transform: scale(.96); }\n.mode-pill:focus-visible { outline-offset: 3px; }\n\n/* ---------- Category rail ---------- */\n.rail { position: sticky; top: var(--header-h); z-index: 15; background: var(--bg); }\n.rail__scroll, .filters__scroll { display: flex; align-items: center; gap: var(--s2); overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; padding: var(--s1) var(--s4) var(--s2); }\n.rail__scroll::-webkit-scrollbar, .filters__scroll::-webkit-scrollbar { display: none; }\n\n.chip { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 var(--s4); scroll-snap-align: start;\n  background: var(--bg); border: 1px solid var(--border); border-radius: 999px; color: var(--text); font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap;\n  transition: background-color .18s ease, border-color .18s ease, color .18s ease, transform .12s ease; }\n.chip:hover { border-color: var(--primary); }\n.chip:active { transform: scale(.96); }\n.chip[aria-pressed=\"true\"] { background: var(--primary); border-color: var(--primary); color: #fff; }\n.chip--sm { height: 40px; padding: 0 var(--s3); }\n.chip--sm[aria-pressed=\"true\"], .chip--filters.is-active { background: var(--primary-subtle); border-color: var(--primary); color: var(--primary); }\n.chip--filters { background: transparent; }\n.chip__count { min-width: 20px; height: 20px; padding: 0 6px; display: grid; place-items: center; border-radius: 999px; background: var(--primary); color: #fff; font-size: 12px; line-height: 1; font-weight: 700; animation: pop .25s var(--ease); }\n\n/* ---------- Filter bar ---------- */\n.filters { background: var(--bg); }\n.chips-row { display: flex; flex-wrap: wrap; gap: var(--s2); }\n.text-btn { flex: none; height: 40px; padding: 0 var(--s2); border: 0; background: transparent; color: var(--primary); font-size: 14px; font-weight: 600; animation: pop .2s var(--ease); }\n.text-btn:hover { text-decoration: underline; }\n\n/* ---------- Buttons ---------- */\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: 48px; padding: 0 var(--s5); border: 1.5px solid transparent; border-radius: var(--r-btn); font-size: 15px; line-height: 20px; font-weight: 600; transition: background-color .15s ease, transform .12s ease, box-shadow .2s ease; }\n.btn:active { transform: scale(.97); }\n.btn--primary { background: var(--primary); color: #fff; }\n.btn--primary:hover { background: var(--primary-hover); }\n.btn--outline { background: transparent; border-color: var(--primary); color: var(--primary); }\n.btn--outline:hover { background: rgba(184, 50, 37, .06); }\n.btn--text { background: transparent; color: var(--primary); }\n.btn--text:hover { text-decoration: underline; }\n.btn--compact { height: 40px; padding: 0 var(--s4); }\n.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; }\n.icon-btn:hover { background: rgba(41, 33, 30, .06); }\n\n/* ---------- Content ---------- */\n.content { padding: var(--s2) var(--s4) calc(var(--tab-h) + 96px); display: flex; flex-direction: column; gap: var(--s6); }\n\n/* Featured banner */\n.banner { position: relative; height: 240px; border-radius: var(--r-card); overflow: hidden; background: linear-gradient(135deg, #5A1A12 0%, #B83225 55%, #E2733A 100%); animation: fadeUp .5s var(--ease) both; }\n.banner__art { position: absolute; inset: 0 0 45% 0; display: flex; align-items: center; justify-content: space-around; padding: 0 var(--s6); font-size: 56px; }\n.banner__art span { display: inline-block; filter: drop-shadow(0 6px 8px rgba(0,0,0,.3)); animation: float 5s ease-in-out infinite; }\n.banner__art span:nth-child(2) { animation-delay: -1.6s; font-size: 72px; }\n.banner__art span:nth-child(3) { animation-delay: -3.2s; }\n@keyframes float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }\n.banner__scrim { position: absolute; left: 0; right: 0; bottom: 0; padding: 56px var(--s4) var(--s4); background: linear-gradient(to top, rgba(41, 33, 30, .95) 55%, rgba(41, 33, 30, 0)); color: var(--bg); display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }\n.banner__scrim h2 { font-size: 22px; line-height: 30px; font-weight: 600; }\n.banner__scrim p { font-size: 12px; line-height: 16px; font-weight: 500; opacity: .9; margin-bottom: var(--s2); }\n.banner__scrim .btn { height: 40px; }\n\n/* Sections */\n.section { scroll-margin-top: calc(var(--header-h) + var(--rail-h) + 8px); animation: fadeUp .45s var(--ease) both; }\n.section__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s3); min-height: 44px; }\n.section__head h2 { font-size: 22px; line-height: 30px; font-weight: 600; }\n.section__count { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.link-btn { min-height: 44px; padding: 0 var(--s1); border: 0; background: transparent; color: var(--primary); font-size: 14px; font-weight: 600; }\n.link-btn:hover { text-decoration: underline; }\n@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n\n/* Grid + cards */\n.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s5) var(--s4); }\n.card { display: flex; flex-direction: column; height: 100%; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); animation: fadeUp .4s var(--ease) both; animation-delay: calc(min(var(--i, 0), 8) * 45ms); }\n.card__media { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 12px 12px 0 0; }\n.thumb { width: 100%; height: 100%; display: grid; place-items: center; background: linear-gradient(135deg, var(--g1), var(--g2)); position: relative; transition: transform .5s var(--ease), filter .3s ease; }\n.thumb::after { content: \"\"; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.07) 0 8px, rgba(255,255,255,0) 8px 20px); }\n.thumb__emoji { position: relative; z-index: 1; font-size: 52px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }\n.card:hover .thumb { transform: scale(1.05); }\n.card.is-soldout .thumb { filter: grayscale(1) saturate(.2); opacity: .7; }\n.card.is-soldout:hover .thumb { transform: none; }\n.soldout-chip { position: absolute; top: var(--s2); left: var(--s2); z-index: 2; padding: 2px var(--s2); border-radius: 999px; background: var(--text); color: var(--bg); font-size: 12px; line-height: 16px; font-weight: 600; }\n\n.card__body { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: var(--s3); }\n.card__top { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 20px; margin-bottom: 2px; }\n.dietary { display: inline-flex; flex: none; }\n.badge { padding: 0 var(--s2); height: 20px; display: inline-flex; align-items: center; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); color: var(--primary); font-size: 10px; line-height: 1; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }\n.card__name { font-size: 14px; line-height: 20px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 20px; }\n.card__desc { font-size: 12px; line-height: 16px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.card__price { margin-top: var(--s1); font-size: 16px; line-height: 24px; font-weight: 700; }\n.card__price small { font-size: 12px; font-weight: 500; color: var(--text-2); margin-right: 2px; }\n.card__note { font-size: 12px; line-height: 16px; color: var(--text-2); }\n.card__action { margin-top: auto; padding-top: var(--s2); display: flex; justify-content: flex-end; }\n.card__action.is-pop > * { animation: pop .25s var(--ease); }\n\n.add-btn { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 var(--s4) 0 var(--s3); border: 1.5px solid var(--primary); border-radius: var(--r-btn); background: transparent; color: var(--primary); font-size: 14px; font-weight: 600; transition: background-color .15s ease, color .15s ease, transform .12s ease; }\n.add-btn:hover { background: var(--primary-subtle); }\n.add-btn:active { transform: scale(.95); }\n.stepper { display: inline-flex; align-items: center; height: 44px; border: 1.5px solid var(--primary); border-radius: var(--r-btn); overflow: hidden; background: var(--primary-subtle); }\n.stepper button { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; color: var(--primary); transition: background-color .15s ease; }\n.stepper button:hover { background: rgba(184, 50, 37, .12); }\n.stepper button:active { background: rgba(184, 50, 37, .2); }\n.stepper output { min-width: 24px; text-align: center; font-size: 15px; font-weight: 700; color: var(--text); }\n.notify-btn { height: 40px; padding: 0 var(--s3); border: 1.5px solid var(--border); border-radius: var(--r-btn); background: transparent; color: var(--text); font-size: 14px; font-weight: 600; transition: background-color .15s ease, border-color .15s ease; }\n.notify-btn:hover { border-color: var(--text); }\n.notify-btn[aria-pressed=\"true\"] { background: var(--primary-subtle); border-color: var(--primary); color: var(--primary); }\n\n/* ---------- Skeleton ---------- */\n.sk { background: linear-gradient(100deg, #F1E6D6 30%, #FBF3E7 50%, #F1E6D6 70%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; border-radius: 8px; }\n@keyframes shimmer { to { background-position: -200% 0; } }\n.sk-banner { height: 240px; border-radius: var(--r-card); }\n.sk-head { width: 55%; height: 28px; }\n.sk-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }\n.sk-card .sk-img { bility<\/h3>\n      <label class=\"switch-row\" for=\"hideSold\">\n        <span>Hide sold out dishes<\/span>\n        <input class=\"switch\" id=\"hideSold\" type=\"checkbox\" role=\"switch\" />\n      <\/label>\n      <div class=\"sheet__actions\">\n        <button class=\"btn btn--text\" id=\"resetFilters\" type=\"button\">Reset<\/button>\n        <button class=\"btn btn--primary\" id=\"applyFilters\" type=\"button\">Show dishes<\/button>\n      <\/div>\n    <\/section>\n\n    <section class=\"sheet\" id=\"modeSheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modeTitle\" hidden>\n      <div class=\"sheet__handle\" aria-hidden=\"true\"><\/div>\n      <div class=\"sheet__head\">\n        <h2 id=\"modeTitle\">Ordering mode<\/h2>\n        <button class=\"icon-btn\" type=\"button\" data-close aria-label=\"Close ordering mode\">\n          <svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.500\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/><\/svg>\n        <\/button>\n      <\/div>\n      <div class=\"mode-options\" role=\"group\" aria-label=\"Choose ordering mode\">\n        <button class=\"mode-opt is-selected\" type=\"button\" data-mode=\"delivery\" aria-pressed=\"true\">\n          <span class=\"mode-opt__text\"><strong>Delivery<\/strong><small>Fresh food delivered to you<\/small><\/span>\n          <span class=\"mode-opt__check\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12.500 4.500 4.500L19 7.500\"/><\/svg><\/span>\n        <\/button>\n        <button class=\"mode-opt\" type=\"button\" data-mode=\"dinein\" aria-pressed=\"false\">\n          <span class=\"mode-opt__text\"><strong>Dine in<\/strong><small>Scan the QR code at your table<\/small><\/span>\n          <span class=\"mode-opt__check\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12.500 4.500 4.500L19 7.500\"/><\/svg><\/span>\n        <\/button>\n      <\/div>\n      <div class=\"warn\" id=\"modeWarn\" role=\"alert\" hidden>\n        <svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.730 18-8-14a2 2 0 0 0-3.480 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.730-3ZM12 9v4M12 17h.01\"/><\/svg>\n        <div>\n          <p id=\"modeWarnText\"><\/p>\n          <div class=\"warn__actions\">\n            <button class=\"btn btn--primary btn--compact\" type=\"button\" data-warn=\"save\">Save cart &amp; switch<\/button>\n            <button class=\"btn btn--outline btn--compact\" type=\"button\" data-warn=\"clear\">Clear cart &amp; switch<\/button>\n            <button class=\"btn btn--text btn--compact\" type=\"button\" data-warn=\"keep\">Keep delivery<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n  <\/div>\n<\/template>\n\n<\!-- ===== SCREEN: cart ===== -->\n<template id=\"tpl-cart\">\n<style>\n/* ==========================================================\n   Ember & Plate \u00b7 Cart & Order Summary (/delivery/cart)\n   ========================================================== */\n:host {\n  --primary: #B83225;\n  --primary-hover: #98281F;\n  --primary-subtle: #F5E3DF;\n  --bg: #FFF8EF;\n  --surface: #FFFFFF;\n  --text: #29211E;\n  --text-2: #6F625C;\n  --border: #E6D9CD;\n  --disabled: #B9AEA7;\n  --success: #237A45;\n\n  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;\n  --ease: cubic-bezier(.2, .8, .2, 1);\n  --safe-b: env(safe-area-inset-bottom, 0px);\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n\n\n:host { margin: 0; font-family: \"Inter\", system-ui, -apple-system, \"Segoe UI\", sans-serif; font-size: 14px; line-height: 20px; color: var(--text); background: var(--bg); }\nbutton { font: inherit; color: inherit; cursor: pointer; }\nh1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }\nul { list-style: none; }\na { color: inherit; text-decoration: none; }\n[hidden] { display: none !important; }\n:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }\n.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }\n\n.app { max-width: 480px; min-height: 100vh; margin: 0 auto; background: var(--bg); position: relative; }\n.h3 { font-size: 18px; line-height: 26px; font-weight: 600; }\n\n/* ---------- Header ---------- */\n.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4) var(--s2) var(--s2); background: var(--bg); }\n.topbar__title { font-size: 28px; line-height: 36px; font-weight: 700; color: var(--text); }\n.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--text); transition: background-color .15s ease, transform .12s ease; }\n.icon-btn:hover { background: rgba(41, 33, 30, .06); }\n.icon-btn:active { transform: scale(.92); }\n\n.deliver { display: flex; align-items: center; gap: 6px; padding: 0 var(--s4) var(--s3); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); animation: fadeUp .4s var(--ease) both; }\n.deliver svg { color: var(--primary); flex: none; }\n\n/* ---------- Layout ---------- */\n.content { padding: var(--s2) var(--s4) calc(60px + var(--s8) + var(--s6) + var(--safe-b)); }\n.filled { display: flex; flex-direction: column; gap: var(--s6); }\n.filled > * { animation: fadeUp .5s var(--ease) both; }\n.filled > :nth-child(2) { animation-delay: 70ms; }\n.filled > :nth-child(3) { animation-delay: 140ms; }\n.filled > :nth-child(4) { animation-delay: 210ms; }\n@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n\n.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: var(--s4); }\n\n/* ---------- Item rows ---------- */\n.row { display: grid; grid-template-rows: 1fr; border-bottom: 1px solid var(--border); transition: grid-template-rows .28s var(--ease), opacity .22s ease, transform .28s var(--ease), border-color .28s ease; }\n.row:first-child { padding-top: 0; }\n.row__inner { min-height: 0; overflow: hidden; padding: var(--s4) 0; transition: padding .28s var(--ease); }\n.row:first-child .row__inner { padding-top: 0; }\n.row.is-enter { animation: rowIn .4s var(--ease) both; }\n@keyframes rowIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }\n.row.is-leaving { grid-template-rows: 0fr; opacity: 0; transform: translateX(24px); border-color: transparent; pointer-events: none; }\n.row.is-leaving .row__inner { padding-top: 0; padding-bottom: 0; }\n\n.row__title { display: flex; align-items: flex-start; gap: var(--s2); }\n.dietary { display: inline-flex; flex: none; margin-top: 5px; }\n.row__name { font-size: 18px; line-height: 26px; font-weight: 600; color: var(--text); }\n.row__custom { margin-top: 2px; padding-left: 24px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.row__bottom { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-top: var(--s3); padding-left: 24px; }\n\n/* Stepper: 32px high, 8px radius; hit area extended to 44px */\n.stepper { display: inline-flex; align-items: center; height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }\n.stepper button { position: relative; width: 32px; height: 30px; display: grid; place-items: center; border: 0; background: transparent; color: var(--primary); border-radius: 7px; transition: background-color .15s ease, transform .12s ease; }\n.stepper button::before { content: \"\"; position: absolute; inset: -7px -3px; }\n.stepper button:hover:not([aria-disabled=\"true\"]) { background: var(--primary-subtle); }\n.stepper button:active:not([aria-disabled=\"true\"]) { transform: scale(.88); }\n.stepper button[aria-disabled=\"true\"] { color: var(--disabled); cursor: not-allowed; }\n.stepper output { min-width: 28px; text-align: center; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text); }\n.stepper output.tick { animation: tick .25s var(--ease); }\n@keyframes tick { 0% { transform: translateY(6px); opacity: 0; } 100% { transform: none; opacity: 1; } }\n\n.row__price { text-align: right; }\n.row__price strong { display: block; font-size: 18px; line-height: 24px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }\n.row__unit { display: block; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n\n.add-more { display: flex; align-items: center; min-height: 44px; margin-top: var(--s1); font-size: 15px; line-height: 20px; font-weight: 600; color: var(--primary); transition: transform .15s ease; }\n.add-more:hover { text-decoration: underline; }\n.add-more:active { transform: translateX(3px); }\n\n/* ---------- Free delivery nudge ---------- */\n.nudge { padding: var(--s3) var(--s4); background: var(--primary-subtle); border-radius: 16px; }\n.nudge__text { display: flex; align-items: center; gap: var(--s2); font-size: 14px; line-height: 20px; font-weight: 600; }\n.nudge__check { display: none; color: var(--success); flex: none; }\n.nudge.is-done { background: #E8F3EC; }\n.nudge.is-done .nudge__check { display: block; animation: pop .35s var(--ease); }\n.nudge__track { height: 6px; margin-top: var(--s2); border-radius: 999px; background: rgba(41, 33, 30, .12); overflow: hidden; }\n.nudge__fill { display: block; height: 100%; width: 100%; border-radius: inherit; background: var(--primary); transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform .6s var(--ease), background-color .3s ease; }\n.nudge.is-done .nudge__fill { background: var(--success); }\n@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }\n\n/* ---------- Cross-sell carousel ---------- */\n.suggest__rail { display: flex; gap: var(--s3); margin: var(--s3) calc(var(--s4) * -1) 0; padding: var(--s1) var(--s4) var(--s2); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; }\n.suggest__rail::-webkit-scrollbar { display: none; }\n.mini { flex: none; width: 148px; scroll-snap-align: start; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }\n.mini__thumb { aspect-ratio: 4 / 3; display: grid; place-items: center; position: relative; background: linear-gradient(135deg, var(--g1), var(--g2)); }\n.mini__thumb::after { content: \"\"; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.07) 0 8px, rgba(255,255,255,0) 8px 20px); }\n.mini__emoji { position: relative; z-index: 1; font-size: 40px; filter: drop-shadow(0 3px 5px rgba(0,0,0,.25)); transition: transform .4s var(--ease); }\n.mini:hover .mini__emoji { transform: scale(1.12) rotate(-4deg); }\n.mini__body { display: flex; flex-direction: column; gap: 2px; padding: var(--s3); flex: 1; }\n.mini__cat { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.mini__name { font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.mini__price { font-size: 14px; line-height: 20px; font-weight: 700; }\n.mini__btn { margin-top: var(--s2); height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 1.5px solid var(--primary); border-radius: 12px; background: transparent; color: var(--primary); font-size: 14px; font-weight: 600; transition: background-color .15s ease, color .15s ease, transform .12s ease; }\n.mini__btn:hover { background: var(--primary-subtle); }\n.mini__btn:active { transform: scale(.95); }\n.mini__btn.is-added { background: var(--primary-subtle); border-color: var(--primary-subtle); color: var(--text); cursor: default; animation: pop .3s var(--ease); }\n.mini__btn.is-added svg { color: var(--success); }\n\n/* ---------- Summary ---------- */\n.summary .bill { margin-top: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }\n.bill__row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); font-size: 14px; line-height: 20px; }\n.bill__row dt { color: var(--text-2); font-weight: 500; }\n.bill__row dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }\n.bill__row dd.is-free { color: var(--success); }\n.bill__row--total { margin-top: var(--s2); padding-top: var(--s3); border-top: 1px dashed var(--border); }\n.bill__row--total dt { color: var(--text); font-size: 18px; line-height: 24px; font-weight: 600; }\n.bill__row--total dd { font-size: 18px; line-height: 24px; font-weight: 700; }\n.summary__note { margin-top: var(--s3); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n\n/* ---------- Buttons / empty ---------- */\n.btn { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 var(--s6); border: 0; border-radius: 12px; font-size: 15px; font-weight: 600; transition: background-color .15s ease, transform .12s ease; }\n.btn--primary { background: var(--primary); color: #fff; }\n.btn--primary:hover { background: var(--primary-hover); }\n.btn:active { transform: scale(.97); }\n.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s2); padding: var(--s8) var(--s4); animation: fadeUp .45s var(--ease) both; }\n.empty svg { margin-bottom: var(--s2); animation: float 4s ease-in-out infinite; }\n.empty h2 { font-size: 22px; line-height: 30px; font-weight: 600; }\n.empty p { color: var(--text-2); max-width: 28ch; margin-bottom: var(--s3); }\n@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }\n\n/* ---------- Floating cart bar ---------- */\n.dock { position: fixed; z-index: 30; left: 50%; bottom: calc(var(--s4) + var(--safe-b)); width: calc(min(100%, 480px) - 32px); height: 60px; transform: translateX(-50%); border-radius: 16px; background: var(--primary); box-shadow: 0 10px 24px rgba(184, 50, 37, .35); }\n.dock.is-in { animation: dockIn .45s var(--ease); }\n.dock.is-out { animation: dockOut .25s ease forwards; }\n@keyframes dockIn { from { transform: translate(-50%, 140%); } to { transform: translate(-50%, 0); } }\n@keyframes dockOut { to { transform: translate(-50%, 160%); } }\n.dock__btn { width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: 0 var(--s5); border: 0; border-radius: 16px; background: transparent; color: var(--bg); font-size: 15px; line-height: 20px; font-weight: 600; transition: background-color .15s ease, transform .12s ease; }\n.dock__btn:hover { background: var(--primary-hover); }\n.dock__btn:active { transform: scale(.985); }\n.dock__btn:focus-visible { outline-color: var(--text); outline-offset: 3px; }\n.dock__info { display: inline-flex; align-items: center; gap: var(--s2); font-variant-numeric: tabular-nums; }\n.dock__info strong { font-weight: 700; }\n.dock__sep { opacity: .6; }\n.dock__action { transition: transform .2s var(--ease); }\n.dock__btn:hover .dock__action { transform: translateX(3px); }\n.dock.pulse { animation: dockPulse .35s var(--ease); }\n@keyframes dockPulse { 0% { transform: translateX(-50%) scale(1); } 40% { transform: translateX(-50%) scale(1.025); } 100% { transform: translateX(-50%) scale(1); } }\n\n/* ---------- Toast ---------- */\n.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(var(--s4) + 60px + var(--s3) + var(--safe-b)); transform: translate(-50%, 0); width: max-content; max-width: calc(min(100%, 480px) - 32px); display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: 12px; background: var(--text); color: var(--bg); font-size: 14px; font-weight: 500; animation: toastIn .3s var(--ease); }\n.toast.is-out { animation: toastOut .2s ease forwards; }\n.toast__btn { min-height: 44px; margin: -12px -8px -12px 0; padding: 0 var(--s3); border: 0; background: transparent; color: #FFB4A8; font-size: 14px; font-weight: 700; }\n.toast__btn:focus-visible { outline-color: var(--bg); }\n@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }\n@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 8px); } }\n\n/* ---------- Reduced motion ---------- */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }\n}\n\n:host { display: block; }\n\n<\/style>\n<div class=\"app\" id=\"app\">\n\n    <\!-- Header -->\n    <header class=\"topbar\">\n      <button class=\"icon-btn\" id=\"backBtn\" type=\"button\" aria-label=\"Back\">\n        <svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 18-6-6 6-6\"/><\/svg>\n      <\/button>\n      <h1 class=\"topbar__title\">Your Cart<\/h1>\n    <\/header>\n\n    <p class=\"deliver\" id=\"deliverTo\">\n      <svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><\/svg>\n      <span id=\"deliverText\">Delivering to Home \u00b7 12 min<\/span>\n    <\/p>\n\n    <p class=\"sr-only\" id=\"liveRegion\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"><\/p>\n\n    <main class=\"content\" id=\"cartMain\">\n\n      <\!-- Filled cart -->\n      <div class=\"filled\" id=\"cartFilled\">\n\n        <\!-- 1. Itemised order list -->\n        <section class=\"card items\" aria-labelledby=\"itemsTitle\">\n          <h2 class=\"sr-only\" id=\"itemsTitle\">Items in your order<\/h2>\n          <ul class=\"items__list\" id=\"itemList\"><\/ul>\n          <a class=\"add-more\" id=\"addMore\" href=\"#menu\">+ Add more items from menu<\/a>\n        <\/section>\n\n        <\!-- Free delivery nudge -->\n        <section class=\"nudge\" id=\"nudge\" aria-label=\"Free delivery progress\">\n          <p class=\"nudge__text\">\n            <svg class=\"nudge__check\" viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m8 12.500 2.700 2.700L16 9.500\"/><\/svg>\n            <span id=\"nudgeText\">Add \u20b921 more for free delivery<\/span>\n          <\/p>\n          <div class=\"nudge__track\" id=\"nudgeTrack\" role=\"progressbar\" aria-label=\"Progress to free delivery\" aria-valuemin=\"0\" aria-valuemax=\"599\" aria-valuenow=\"0\"><span class=\"nudge__fill\" id=\"nudgeFill\"><\/span><\/div>\n        <\/section>\n\n        <\!-- 2. Cross-sell carousel -->\n        <section class=\"suggest\" aria-labelledby=\"sugTitle\">\n          <h2 class=\"h3\" id=\"sugTitle\">Complete your meal<\/h2>\n          <ul class=\"suggest__rail\" id=\"sugRail\" aria-label=\"Suggested add-ons\"><\/ul>\n        <\/section>\n\n        <\!-- Order summary -->\n        <section class=\"card summary\" aria-labelledby=\"sumTitle\">\n          <h2 class=\"h3\" id=\"sumTitle\">Order summary<\/h2>\n          <dl class=\"bill
