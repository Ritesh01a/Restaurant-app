        <div class=\"avatar\" aria-hidden=\"true\">\n            <svg viewBox=\"0 0 50 50\" width=\"50\" height=\"50\"><defs><linearGradient id=\"av\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#E9A65B\"/><stop offset=\"1\" stop-color=\"#B83225\"/><\/linearGradient><\/defs><rect width=\"50\" height=\"50\" fill=\"url(#av)\"/><circle cx=\"25\" cy=\"20\" r=\"8.500\" fill=\"#FFF8EF\"/><path d=\"M8 50c1-11 8-17 17-17s16 6 17 17Z\" fill=\"#FFF8EF\"/><\/svg>\n          <\/div>\n          <div class=\"partner__info\">\n            <h3 class=\"partner__name\">Ramesh Kumar<\/h3>\n            <p class=\"partner__rating\"><span aria-hidden=\"true\">\u2b50<\/span> <span class=\"sr-only\">Rated<\/span> 4.9 Delivery Partner<\/p>\n          <\/div>\n          <button class=\"call-btn\" id=\"callBtn\" type=\"button\" aria-label=\"Call driver Ramesh Kumar\">\n            <svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 16.920v3a2 2 0 0 1-2.180 2 19.790 19.790 0 0 1-8.630-3.070 19.500 19.500 0 0 1-6-6 19.790 19.790 0 0 1-3.070-8.670A2 2 0 0 1 4.110 2h3a2 2 0 0 1 2 1.720c.127.960.361 1.903.7 2.810a2 2 0 0 1-.45 2.110L8.090 9.910a16 16 0 0 0 6 6l1.270-1.270a2 2 0 0 1 2.110-.45c.907.339 1.850.573 2.810.7A2 2 0 0 1 22 16.920Z\"/><\/svg>\n          <\/button>\n        <\/div>\n        <p class=\"safety\">\n          <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 13c0 5-3.500 7.500-7.660 8.950a1 1 0 0 1-.67-.01C7.500 20.500 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.500-1.200 6.240-2.720a1.170 1.170 0 0 1 1.520 0C14.510 3.810 17 5 19 5a1 1 0 0 1 1 1z\"/><path d=\"m9 12 2 2 4-4\"/><\/svg>\n          <span><strong>Safety check passed:<\/strong> mask worn, contactless delivery ready<\/span>\n        <\/p>\n      <\/section>\n\n      <\!-- 4. Order summary drawer -->\n      <section class=\"card drawer\" id=\"drawer\" aria-label=\"Order summary\">\n        <button class=\"drawer__head\" id=\"drawerBtn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"drawerPanel\">\n          <span class=\"drawer__title\"><span class=\"h3\">Order summary<\/span><span class=\"drawer__meta\" id=\"drawerMeta\">2 items \u00b7 \u20b9617 paid<\/span><\/span>\n          <svg class=\"drawer__chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"/><\/svg>\n        <\/button>\n        <div class=\"drawer__panel\" id=\"drawerPanel\">\n          <div class=\"drawer__inner\" id=\"drawerInner\">\n            <ul class=\"lines\" id=\"lines\"><\/ul>\n            <div class=\"paid\"><span>Total paid<\/span><strong id=\"paidTotal\">\u20b9617<\/strong><\/div>\n            <p class=\"paid__via\" id=\"paidVia\">Paid via UPI<\/p>\n            <div class=\"instr\"><span class=\"instr__emoji\" aria-hidden=\"true\" id=\"instrEmoji\">\ud83d\udeaa<\/span><span><span class=\"instr__k\">Delivery instruction<\/span><br /><strong id=\"instrText\">Leave at door<\/strong><\/span><\/div>\n            <p class=\"drawer__addr\"><span class=\"instr__k\">Delivering to<\/span><br /><span id=\"addrLine\">Home \u00b7 B-42, Green Park Extension, New Delhi 110016<\/span><\/p>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <button class=\"btn btn--outline\" id=\"helpBtn\" type=\"button\" aria-haspopup=\"dialog\">Need Help with Order?<\/button>\n    <\/main>\n\n    <\!-- Help sheet -->\n    <div class=\"scrim\" id=\"scrim\" hidden><\/div>\n    <section class=\"sheet\" id=\"helpSheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"helpTitle\" hidden>\n      <div class=\"sheet__handle\" aria-hidden=\"true\"><\/div>\n      <div class=\"sheet__head\">\n        <h2 class=\"h2\" id=\"helpTitle\">How can we help?<\/h2>\n        <button class=\"icon-btn\" type=\"button\" data-close aria-label=\"Close help\">\n          <svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.500\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/><\/svg>\n        <\/button>\n      <\/div>\n      <ul class=\"help\">\n        <li><button type=\"button\" data-help=\"My order is taking too long\">My order is taking too long<\/button><\/li>\n        <li><button type=\"button\" data-help=\"An item is missing or wrong\">An item is missing or wrong<\/button><\/li>\n        <li><button type=\"button\" data-help=\"Change delivery instructions\">Change delivery instructions<\/button><\/li>\n        <li><button type=\"button\" data-help=\"Problem with the delivery partner\">Problem with the delivery partner<\/button><\/li>\n        <li><button type=\"button\" data-help=\"Chat with support\">Chat with support<\/button><\/li>\n      <\/ul>\n    <\/section>\n\n    <div class=\"toast\" id=\"toast\" role=\"status\" hidden><\/div>\n  <\/div>\n<\/template>\n\n<\!-- ===== SCREEN: scan ===== -->\n<template id=\"tpl-scan\">\n<style>\n/* ==========================================================\n   Ember & Plate \u00b7 QR scanner & manual table entry (/dine-in/scan)\n   ========================================================== */\n:host {\n  --primary: #B83225; --primary-hover: #98281F;\n  --bg: #FFF8EF; --charcoal: #29211E; --surface: #FFFFFF;\n  --text: #29211E; --text-2: #6F625C; --muted: #B9AEA7;\n  --border: #E6D9CD; --error: #B42318; --success: #237A45;\n  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;\n  --ease: cubic-bezier(.2, .8, .2, 1);\n  --safe-b: env(safe-area-inset-bottom, 0px);\n}\n*, *::before, *::after { box-sizing: border-box; }\n\n:host { margin: 0; font-family: \"Inter\", system-ui, -apple-system, \"Segoe UI\", sans-serif; font-size: 14px; line-height: 20px; color: var(--bg); background: var(--charcoal); }\nbutton, input { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\nh1, h2, p { margin: 0; }\n[hidden] { display: none !important; }\n:focus-visible { outline: 2px solid var(--bg); outline-offset: 3px; }\n.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }\n\n.app { max-width: 480px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; background: var(--charcoal); }\n\n/* ---------- Header ---------- */\n.topbar { display: flex; align-items: flex-start; gap: var(--s3); padding: var(--s3) var(--s4) 0; }\n.back { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(255, 248, 239, .22); background: var(--charcoal); color: var(--bg); transition: background-color .15s ease, transform .12s ease; }\n.back:hover { background: rgba(255, 248, 239, .1); }\n.back:active { transform: scale(.92); }\n.titles { padding-top: 2px; min-width: 0; }\n.titles__h1 { font-size: 28px; line-height: 36px; font-weight: 700; color: var(--bg); animation: fadeUp .5s var(--ease) both; }\n.titles__sub { margin-top: var(--s1); font-size: 14px; line-height: 20px; color: var(--muted); animation: fadeUp .5s .08s var(--ease) both; }\n@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }\n\n/* ---------- Stage + viewfinder ---------- */\n.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s4); padding: var(--s6) var(--s4); }\n.vf { position: relative; width: 260px; height: 260px; animation: vfIn .6s .1s var(--ease) both; }\n@keyframes vfIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }\n.vf__cam { position: absolute; inset: 0; border-radius: 24px; overflow: hidden; background: #1C1613; }\n.vf__cam video { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s ease; }\n.vf[data-state=\"scanning\"] video, .vf[data-state=\"nodetect\"] video, .vf[data-state=\"error\"] video { opacity: 1; }\n\n.corner { position: absolute; width: 48px; height: 48px; border: 0 solid var(--primary); pointer-events: none; transition: border-color .3s ease, transform .4s var(--ease); animation: cornerIn .7s .2s var(--ease) both; }\n.corner--tl { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 24px; }\n.corner--tr { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 24px; }\n.corner--bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 24px; }\n.corner--br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 24px; }\n@keyframes cornerIn { from { opacity: 0; transform: scale(1.5); } to { opacity: 1; transform: none; } }\n.vf[data-state=\"scanning\"] .corner { animation: cornerIn .7s .2s var(--ease) both, breathe 2.4s 1s ease-in-out infinite; }\n@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(.96); } }\n.vf[data-state=\"success\"] .corner { border-color: var(--success); animation: none; transform: scale(.96); }\n.vf[data-state=\"error\"] .corner { border-color: var(--error); }\n.vf[data-state=\"error\"] { animation: shake .4s ease; }\n@keyframes shake { 0%, 100% { translate: 0; } 25% { translate: -6px; } 75% { translate: 6px; } }\n\n.scanline { position: absolute; left: 14px; right: 14px; top: 14px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(184, 50, 37, 0), var(--primary) 20%, #E2573F 50%, var(--primary) 80%, rgba(184, 50, 37, 0)); box-shadow: 0 0 14px 3px rgba(184, 50, 37, .55); opacity: 0; pointer-events: none; }\n.vf[data-state=\"scanning\"] .scanline, .vf[data-state=\"nodetect\"] .scanline { opacity: 1; animation: scan 2.4s ease-in-out infinite alternate; }\n@keyframes scan { from { transform: translateY(0); } to { transform: translateY(230px); } }\n\n.torch { position: absolute; top: 12px; right: 12px; z-index: 3; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--surface); color: var(--charcoal); box-shadow: 0 4px 12px rgba(0, 0, 0, .3); transition: transform .15s ease, background-color .2s ease, box-shadow .3s ease; }\n.torch:active { transform: scale(.9); }\n.torch[aria-pressed=\"true\"] { background: #FFE9A8; box-shadow: 0 0 0 4px rgba(255, 233, 168, .3), 0 0 18px rgba(255, 233, 168, .6); }\n.torch:disabled { opacity: .5; cursor: not-allowed; }\n.torch:focus-visible { outline-color: var(--bg); }\n\n/* state overlay inside the viewfinder */\n.vf__msg { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s2); padding: var(--s6); border-radius: 24px; background: rgba(41, 33, 30, .9); text-align: center; opacity: 0; pointer-events: none; transition: opacity .3s ease; }\n.vf[data-state=\"starting\"] .vf__msg, .vf[data-state=\"denied\"] .vf__msg, .vf[data-state=\"unavailable\"] .vf__msg, .vf[data-state=\"success\"] .vf__msg, .vf[data-state=\"error\"] .vf__msg { opacity: 1; }\n.vf__icon { display: grid; place-items: center; width: 48px; height: 48px; color: var(--bg); }\n.vf__title { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--bg); }\n.vf__text { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted); }\n.vf__spinner { width: 32px; height: 32px; border: 3px solid rgba(255, 248, 239, .3); border-top-color: var(--bg); border-radius: 50%; animation: spin .8s linear infinite; }\n.vf[data-state=\"success\"] .vf__title { color: #7FD6A0; }\n.vf[data-state=\"error\"] .vf__title { color: #FFB4A8; }\n.vf__check path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .45s .1s ease forwards; }\n.vf__check circle { stroke-dasharray: 151; stroke-dashoffset: 151; animation: draw .6s ease forwards; }\n@keyframes draw { to { stroke-dashoffset: 0; } }\n@keyframes spin { to { transform: rotate(360deg); } }\n\n.status { max-width: 300px; min-height: 40px; text-align: center; font-size: 14px; line-height: 20px; color: var(--muted); animation: fadeUp .5s .3s var(--ease) both; }\n.status.is-error { color: #FFB4A8; }\n.status.is-ok { color: #7FD6A0; }\n.retry { min-height: 44px; margin-top: calc(var(--s2) * -1); padding: 0 var(--s5); border: 1.5px solid var(--bg); border-radius: 12px; background: transparent; color: var(--bg); font-size: 15px; font-weight: 600; transition: background-color .15s ease, transform .12s ease; }\n.retry:hover { background: rgba(255, 248, 239, .1); }\n.retry:active { transform: scale(.97); }\n\n.demo { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--s2); }\n.demo__label { font-size: 12px; font-weight: 600; color: var(--muted); }\n.demo button { min-height: 36px; padding: 0 var(--s3); border: 1px dashed rgba(255, 248, 239, .4); border-radius: 999px; background: transparent; color: var(--bg); font-size: 12px; font-weight: 600; }\n.demo button:hover { background: rgba(255, 248, 239, .1); }\n\n/* ---------- Manual entry sheet ---------- */\n.sheet { margin-top: auto; padding: var(--s6) var(--s6) calc(var(--s6) + var(--safe-b)); background: var(--surface); color: var(--text); border-radius: 16px 16px 0 0; box-shadow: 0 -12px 32px rgba(0, 0, 0, .35); animation: sheetUp .6s .25s var(--ease) both; }\n@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }\n.sheet__state { animation: fadeUp .4s var(--ease) both; }\n.sheet__title { font-size: 18px; line-height: 26px; font-weight: 600; }\n.sheet__sub { margin-top: var(--s1); font-size: 14px; line-height: 20px; color: var(--text-2); }\n.form { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s4); }\n.field { width: 100%; height: 52px; padding: 0 var(--s4); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; font-size: 22px; line-height: 30px; font-weight: 600; text-align: center; letter-spacing: .2em; color: var(--text); outline: 0; transition: border-color .15s ease, box-shadow .2s ease; }\n.field::placeholder { color: var(--muted); letter-spacing: .2em; }\n.field:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(184, 50, 37, .22); }\n.field[aria-invalid=\"true\"] { border-color: var(--error); }\n.field.shake { animation: shake .4s ease; }\n.field__error { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--error); animation: fadeUp .25s var(--ease); }\n.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); width: 100%; height: 54px; margin-top: var(--s2); border: 0; border-radius: 12px; background: var(--primary); color: var(--bg); font-size: 15px; line-height: 20px; font-weight: 600; transition: background-color .15s ease, transform .12s ease, box-shadow .2s ease; overflow: hidden; }\n.btn::after { content: \"\"; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.2) 50%, transparent 70%); transform: translateX(-120%); }\n.btn:hover { background: var(--primary-hover); }\n.btn:hover::after { transform: translateX(120%); transition: transform .7s ease; }\n.btn:active { transform: scale(.98); }\n.btn:focus-visible { outline-color: var(--charcoal); }\n.btn__spinner { display: none; width: 18px; height: 18px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }\n.btn[aria-busy=\"true\"] { cursor: progress; }\n.btn[aria-busy=\"true\"] .btn__spinner { display: inline-block; }\n\n.sheet__state--ok { display: flex; flex-direction: column; align-items: center; text-align: center; }\n.ok__icon { margin-bottom: var(--s2); }\n.ok__circle { stroke-dasharray: 151; stroke-dashoffset: 151; animation: draw .6s ease forwards; }\n.ok__tick { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .4s .45s ease forwards; }\n.ok__title { outline: 0; }\n.sheet__state--ok .btn { margin-top: var(--s5); }\n.link { min-height: 44px; margin-top: var(--s1); padding: 0 var(--s3); border: 0; background: transparent; color: var(--primary); font-size: 15px; font-weight: 600; }\n.link:hover { text-decoration: underline; }\n.link:focus-visible { outline-color: var(--primary); }\n\n/* ---------- Toast ---------- */\n.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(var(--s6) + var(--safe-b)); transform: translateX(-50%); max-width: calc(min(100%, 480px) - 32px); padding: var(--s3) var(--s4); border-radius: 12px; background: var(--bg); color: var(--charcoal); font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); animation: toastIn .3s var(--ease); }\n.toast.is-out { animation: toastOut .2s ease forwards; }\n@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }\n@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 8px); } }\n\n/* ---------- Reduced motion ---------- */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; animation-delay: 0ms !important; }\n  .vf[data-state=\"scanning\"] .scanline, .vf[data-state=\"nodetect\"] .scanline { animation: none; transform: translateY(115px); }\n  .vf__spinner, .btn__spinner { animation: spin 1.6s linear infinite !important; }\n}\n\n:host { display: block; }\n\n<\/style>\n<div class=\"app\" id=\"app\">\n\n    <\!-- Header -->\n    <header class=\"topbar\">\n      <button class=\"back\" id=\"backBtn\" type=\"button\" aria-label=\"Back\">\n        <svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 18-6-6 6-6\"/><\/svg>\n      <\/button>\n      <div class=\"titles\">\n        <h1 class=\"titles__h1\">Scan Table QR<\/h1>\n        <p class=\"titles__sub\">Point your camera at the QR code on your table.<\/p>\n      <\/div>\n    <\/header>\n\n    <p class=\"sr-only\" id=\"liveRegion\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"><\/p>\n\n    <\!-- Viewfinder -->\n    <main class=\"stage\">\n      <div class=\"vf\" id=\"vf\" data-state=\"starting\">\n        <div class=\"vf__cam\"><video id=\"video\" playsinline muted autoplay aria-hidden=\"true\"><\/video><\/div>\n\n        <span class=\"corner corner--tl\" aria-hidden=\"true\"><\/span>\n        <span class=\"corner corner--tr\" aria-hidden=\"true\"><\/span>\n        <span class=\"corner corner--bl\" aria-hidden=\"true\"><\/span>\n        <span class=\"corner corner--br\" aria-hidden=\"true\"><\/span>\n        <span class=\"scanline\" aria-hidden=\"true\"><\/span>\n\n        <button class=\"torch\" id=\"torchBtn\" type=\"button\" aria-pressed=\"false\" aria-label=\"Turn flashlight on\">\n          <svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 2h12l-2 6H8z\"/><path d=\"M8 8v3a4 4 0 0 0 8 0V8\"/><path d=\"M12 15v7\"/><\/svg>\n        <\/button>\n\n        <\!-- state overlay -->\n        <div class=\"vf__msg\" id=\"vfMsg\" aria-hidden=\"true\">\n          <span class=\"vf__icon\" id=\"vfIcon\"><\/span>\n          <p class=\"vf__title\" id=\"vfTitle\"><\/p>\n          <p class=\"vf__text\" id=\"vfText\"><\/p>\n        <\/div>\n      <\/div>\n\n      <p class=\"status\" id=\"status\" role=\"status\">Starting camera\u2026<\/p>\n      <button class=\"retry\" id=\"retryBtn\" type=\"button\" hidden>Try camera again<\/button>\n\n      <\!-- demo helpers: add ?demo to the URL -->\n      <div class=\"demo\" id=\"demo\" hidden>\n        <span class=\"demo__label\">Demo scan<\/span>\n        <button type=\"button\" data-demo=\"valid\">Valid table<\/button>\n        <button type=\"button\" data-demo=\"invalid\">Invalid QR<\/button>\n        <button type=\"button\" data-demo=\"expired\">Expired<\/button>\n      <\/div>\n    <\/main>\n\n    <\!-- Manual entry bottom sheet -->\n    <section class=\"sheet\" id=\"sheet\" aria-labelledby=\"sheetTitle\">\n\n      <div class=\"sheet__state\" id=\"entryState\">\n        <h2 class=\"sheet__title\" id=\"sheetTitle\">Can't scan the code?<\/h2>\n        <p class=\"sheet__sub\" id=\"sheetSub\">Enter the 2 or 3-digit table number printed on your table stand.<\/p>\n\n        <form class=\"form\" id=\"tableForm\" novalidate>\n          <input class=\"field\" id=\"tableInput\" name=\"table\" type=\"text\" inputmode=\"numeric\" pattern=\"[0-9]*\" maxlength=\"3\" autocomplete=\"off\" aria-labelledby=\"sheetTitle\" aria-describedby=\"sheetSub tableError\" placeholder=\"00\" />\n          <p class=\"field__error\" id=\"tableError\" hidden><\/p>\n          <button class=\"btn\" id=\"verifyBtn\" type=\"submit\">\n            <span class=\"btn__spinner\" aria-hidden=\"true\"><\/span>\n            <span class=\"btn__label\">Verify Table<\/span>\n          <\/button>\n        <\/form>\n      <\/div>\n\n      <div class=\"sheet__state sheet__state--ok\" id=\"okState\" hidden>\n        <svg class=\"ok__icon\" viewBox=\"0 0 52 52\" width=\"64\" height=\"64\" fill=\"none\" aria-hidden=\"true\"><circle class=\"ok__circle\" cx=\"26\" cy=\"26\" r=\"24\" stroke=\"#237A45\" stroke-width=\"3\"/><path class=\"ok__tick\" d=\"m15 27 8 8 15-17\" stroke=\"#237A45\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n        <h2 class=\"sheet__title ok__title\" id=\"okTitle\" tabindex=\"-1\">Table 12 verified<\/h2>\n        <p class=\"sheet__sub\" id=\"okSub\">Ember &amp; Plate \u00b7 Dine-in. You can order right from your table.<\/p>\n        <button class=\"btn\" id=\"startBtn\" type=\"button\">Start ordering<\/button>\n        <button class=\"link\" id=\"changeBtn\" type=\"button\">Wrong table? Change<\/button>\n      <\/div>\n    <\/section>\n\n    <div class=\"toast\" id=\"toast\" role=\"status\" hidden><\/div>\n  <\/div>\n<\/template>\n\n<\!-- ===== SCREEN: verify ===== -->\n<template id=\"tpl-verify\">\n<style>\n/* ==========================================================\n   Ember & Plate \u00b7 Table verification (/dine-in/verify)\n   ========================================================== */\n:host {\n  --primary: #B83225; --primary-hover: #98281F; --primary-subtle: #F5E3DF;\n  --bg: #FFF8EF; --surface: #FFFFFF; --text: #29211E; --text-2: #6F625C;\n  --border: #E6D9CD; --success: #237A45;\n  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;\n  --ease: cubic-bezier(.2, .8, .2, 1);\n  --safe-b: env(safe-area-inset-bottom, 0px);\n}\n*, *::before, *::after { box-sizing: border-box; }\n\n:host { margin: 0; font-family: \"Inter\", system-ui, -apple-system, \"Segoe UI\", sans-serif; font-size: 14px; line-height: 20px; color: var(--text); background: var(--bg); }\nbutton { font: inherit; color: inherit; cursor: pointer; }\nh1, h2, p { margin: 0; }\na { color: inherit; text-decoration: none; }\n[hidden] { display: none !important; }\n:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }\n.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }\n.app { max-width: 480px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; }\n.h2 { font-size: 22px; line-height: 30px; font-weight: 600; }\n\n.wrap { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: var(--s6) var(--s5) calc(var(--s6) + var(--safe-b)); }\n\n/* ---------- Card ---------- */\n.card { width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--s6); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 12px 32px rgba(41, 33, 30, .08); animation: cardIn .6s var(--ease) both; }\n@keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: none; } }\n.card > * { animation: fadeUp .5s var(--ease) both; }\n.card > :nth-child(2) { animation-delay: .12s; }\n.card > :nth-child(3) { animation-delay: .18s; }\n.card > :nth-child(4) { animation-delay: .24s; }\n.card > :nth-child(5) { animation-delay: .3s; }\n.card > :nth-child(6) { animation-delay: .36s; }\n.card > :nth-child(7) { animation-delay: .42s; }\n@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }\n\n/* ---------- 1. Badge + identification ---------- */\n.badge { position: relative; width: 48px; height: 48px; margin-bottom: var(--s3); }\n.badge__circle { position: relative; z-index: 1; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: var(--primary); color: var(--bg); transition: background-color .4s ease, transform .5s var(--ease); animation: badgePop .6s .15s var(--ease) both; }\n.badge__circle svg { grid-area: 1 / 1; transition: opacity .25s ease, transform .45s var(--ease); }\n.badge__check { opacity: 0; transform: scale(.3) rotate(-30deg); }\n.badge__ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--primary); opacity: 0; animation: ring 2s .8s ease-out 2; }\n@keyframes badgePop { from { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.15); } to { transform: none; opacity: 1; } }\n@keyframes ring { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(2); opacity: 0; } }\n.badge--muted .badge__circle { background: var(--primary-subtle); color: var(--primary); }\n.badge--muted .badge__ring { display: none; }\n\n.table { margin-top: var(--s2); font-size: 32px; line-height: 40px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }\n.zone { margin-top: var(--s1); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n\n/* ---------- 2. Notices ---------- */\n.notice { display: flex; align-items: flex-start; gap: var(--s3); width: 100%; margin-top: var(--s6); padding: var(--s4); border-radius: 12px; background: var(--primary-subtle); text-align: left; }\n.notice svg { flex: none; margin-top: 0; color: var(--primary); }\n.notice p { font-size: 14px; line-height: 20px; color: var(--text); }\n.notice strong { font-weight: 600; }\n.notice--soft { margin-top: var(--s3); background: var(--bg); border: 1px solid var(--border); }\n\n/* ---------- 3. Actions ---------- */\n.actions { width: 100%; display: flex; flex-direction: column; align-items: center; gap: var(--s1); margin-top: var(--s6); }\n.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); width: 100%; height: 54px; border: 0; border-radius: 12px; background: var(--primary); color: var(--bg); font-size: 15px; line-height: 20px; font-weight: 600; transition: background-color .2s ease, transform .12s ease, box-shadow .2s ease; overflow: hidden; box-shadow: 0 8px 20px rgba(184, 50, 37, .25); }\n.btn::after { content: \"\"; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.22) 50%, transparent 70%); transform: translateX(-120%); }\n.btn:hover { background: var(--primary-hover); }\n.btn:hover::after { transform: translateX(120%); transition: transform .7s ease; }\n.btn:active { transform: scale(.98); }\n.btn:focus-visible { outline-color: var(--text); }\n.btn[aria-busy=\"true\"] { cursor: progress; }\n.btn[aria-disabled=\"true\"] { cursor: default; }\n.btn__spinner { display: none; width: 18px; height: 18px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }\n.btn[aria-busy=\"true\"] .btn__spinner { display: inline-block; }\n@keyframes spin { to { transform: rotate(360deg); } }\n.btn--link { text-decoration: none; }\n.link { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 var(--s4); font-size: 15px; line-height: 20px; font-weight: 600; color: var(--text); border-radius: 12px; transition: background-color .15s ease; }\n.link:hover { background: rgba(41, 33, 30, .06); text-decoration: underline; }\n\n/* ---------- Success state ---------- */\n.card[data-state=\"success\"] .badge__circle { background: var(--success); animation: none; transform: scale(1.08); }\n.card[data-state=\"success\"] .badge__utensils { opacity: 0; transform: scale(.3) rotate(30deg); }\n.card[data-state=\"success\"] .badge__check { opacity: 1; transform: none; }\n.card[data-state=\"success\"] .badge__ring { border-color: var(--success); animation: ring 1.4s ease-out infinite; }\n.card[data-state=\"success\"] .btn { background: var(--success); box-shadow: 0 8px 20px rgba(35, 122, 69, .25); }\n.card[data-state=\"success\"] .link { display: none; }\n\n.card--state { padding-block: var(--s8); }\n.state__text { margin-top: var(--s2); max-width: 30ch; color: var(--text-2); }\n.card--state .actions { margin-top: var(--s6); }\n\n/* ---------- Toast ---------- */\n.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(var(--s6) + var(--safe-b)); transform: translateX(-50%); max-width: calc(min(100%, 480px) - 32px); padding: var(--s3) var(--s4); border-radius: 12px; background: var(--text); color: var(--bg); font-size: 14px; font-weight: 500; animation: toastIn .3s var(--ease); }\n.toast.is-out { animation: toastOut .2s ease forwards; }\n@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }\n@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 8px); } }\n\n/* ---------- Reduced motion ---------- */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; animation-delay: 0ms !important; }\n  .badge__ring { display: none; }\n  .btn__spinner { animation: spin 1.6s linear infinite !important; }\n}\n\n:host { display: block; }\n\n<\/style>\n<div class=\"app\" id=\"app\">\n\n    <p class=\"sr-only\" id=\"liveRegion\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"><\/p>\n\n    <main class=\"wrap\">\n\n      <\!-- Verification card -->\n      <section class=\"card\" id=\"card\" data-state=\"ready\" aria-labelledby=\"restName\">\n\n        <\!-- 1. Restaurant & table badge -->\n        <div class=\"badge\" id=\"badge\" aria-hidden=\"true\">\n          <span class=\"badge__ring\"><\/span>\n          <span class=\"badge__circle\">\n            <svg class=\"badge__utensils\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 2v7c0 1.100.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.100.9 2 2 2h3Zm0 0v7\"/><\/svg>\n            <svg class=\"badge__check\" viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12.500 4.500 4.500L19 7.500\"/><\/svg>\n          <\/span>\n        <\/div>\n        <h1 class=\"h2\" id=\"restName\">Ember &amp; Plate \u2014 Main Branch<\/h1>\n        <p class=\"table\" id=\"tableName\">Table <span id=\"tableNum\">12<\/span><\/p>\n        <p class=\"zone\" id=\"zone\">Indoor Area \u2022 Ground Floor<\/p>\n\n        <\!-- 2. Session notice -->\n        <div class=\"notice\" id=\"notice\">\n          <svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" \n        <\/div>\n      <\/section>\n    <\/main>\n\n    <div class=\"toast\" id=\"toast\" role=\"status\" hidden><\/div>\n  <\/div>\n<\/template>\n\n<\!-- ===== SCREEN: dmenu ===== -->\n<template id=\"tpl-dmenu\">\n<style>\n/* ==========================================================\n   Ember & Plate \u00b7 Dine-in menu (/dine-in/menu)\n   ========================================================== */\n:host {\n  --primary: #B83225; --primary-hover: #98281F; --primary-subtle: #F5E3DF;\n  --bg: #FFF8EF; --surface: #FFFFFF; --text: #29211E; --text-2: #6F625C; --muted: #B9AEA7;\n  --border: #E6D9CD; --success: #237A45;\n  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;\n  --ease: cubic-bezier(.2, .8, .2, 1);\n  --safe-b: env(safe-area-inset-bottom, 0px);\n  --bar-h: 48px; --tabs-h: 48px;\n}\n*, *::before, *::after { box-sizing: border-box; }\n\n:host { margin: 0; font-family: \"Inter\", system-ui, -apple-system, \"Segoe UI\", sans-serif; font-size: 14px; line-height: 20px; color: var(--text); background: var(--bg); }\nbutton, input { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\nh1, h2, h3, p, ul { margin: 0; padding: 0; }\nul { list-style: none; }\na { color: inherit; text-decoration: none; }\n[hidden] { display: none !important; }\n:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }\n.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }\n.app { max-width: 480px; min-height: 100vh; margin: 0 auto; background: var(--bg); position: relative; }\n.h2 { font-size: 22px; line-height: 30px; font-weight: 600; }\n\n/* ---------- Sticky table header ---------- */\n.tablebar { position: sticky; top: 0; z-index: 40; height: var(--bar-h); display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: 0 var(--s4); background: var(--text); animation: slideDown .5s var(--ease) both; }\n@keyframes slideDown { from { transform: translateY(-100%); } to { transform: none; } }\n.tablebar__text { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--bg); }\n.bell { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 0; border-radius: 8px; background: var(--primary); color: var(--bg); font-size: 12px; line-height: 16px; font-weight: 500; transition: background-color .25s ease, transform .12s ease; }\n.bell::before { content: \"\"; position: absolute; inset: -8px -4px; }\n.bell:hover { background: var(--primary-hover); }\n.bell:active { transform: scale(.94); }\n.bell:focus-visible { outline-color: var(--bg); }\n.bell__icon { display: inline-block; transform-origin: 50% 10%; animation: ringBell 3.5s 1.5s ease-in-out infinite; }\n@keyframes ringBell { 0%, 8%, 100% { transform: rotate(0); } 2% { transform: rotate(16deg); } 4% { transform: rotate(-14deg); } 6% { transform: rotate(8deg); } }\n.bell__spinner { display: none; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }\n@keyframes spin { to { transform: rotate(360deg); } }\n.bell[data-state=\"sending\"] { cursor: progress; }\n.bell[data-state=\"sending\"] .bell__icon { display: none; }\n.bell[data-state=\"sending\"] .bell__spinner { display: inline-block; }\n.bell[data-state=\"called\"] { background: var(--success); cursor: default; }\n.bell[data-state=\"called\"] .bell__icon { animation: none; }\n\n/* ---------- Search ---------- */\n.searchwrap { padding: var(--s3) var(--s4); background: var(--bg); }\n.search { display: flex; align-items: center; gap: var(--s2); height: 48px; padding: 0 var(--s3); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; transition: border-color .15s ease, box-shadow .2s ease; }\n.search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(184, 50, 37, .2); }\n.search__icon { flex: none; color: var(--text-2); }\n.search__input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font-size: 16px; }\n.search__input::placeholder { color: var(--text-2); font-size: 14px; }\n.search__clear { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--border); animation: pop .2s var(--ease); }\n.search__clear:focus-visible { outline-offset: 0; }\n@keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }\n\n/* ---------- Category tabs ---------- */\n.tabs { position: sticky; top: var(--bar-h); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--border); }\n.tabs__scroll { position: relative; display: flex; gap: var(--s5); overflow-x: auto; scrollbar-width: none; padding: 0 var(--s4); }\n.tabs__scroll::-webkit-scrollbar { display: none; }\n.tab { flex: none; min-height: 48px; padding: 0 2px; border: 0; background: transparent; font-size: 14px; line-height: 20px; font-weight: 400; color: var(--text-2); white-space: nowrap; transition: color .2s ease; }\n.tab:hover { color: var(--text); }\n.tab[aria-current=\"true\"] { color: var(--primary); font-weight: 600; }\n.tabs__bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; border-radius: 3px 3px 0 0; background: var(--primary); transition: transform .35s var(--ease), width .35s var(--ease); }\n\n/* ---------- Menu ---------- */\n.content { display: flex; flex-direction: column; gap: var(--s6); padding: var(--s4) var(--s4) calc(64px + var(--s4) + var(--s8) + var(--safe-b)); }\n.sec { scroll-margin-top: calc(var(--bar-h) + var(--tabs-h) + 8px); animation: fadeUp .5s var(--ease) both; }\n@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n.sec__title { margin-bottom: var(--s3); font-size: 22px; line-height: 30px; font-weight: 600; }\n.sec__list { display: flex; flex-direction: column; gap: var(--s3); }\n.dish { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s4); padding: var(--s4); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; transition: border-color .2s ease, box-shadow .2s ease; }\n.dish:hover { border-color: #D7C5B5; }\n.dish.in-cart { border-color: rgba(184, 50, 37, .45); }\n.dish__info { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }\n.dtag { display: inline-flex; margin-bottom: 2px; }\n.dish__name { font-size: 18px; line-height: 26px; font-weight: 600; }\n.dish__price { font-size: 18px; line-height: 24px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }\n.dish__prep { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.dish__desc { margin-top: 2px; font-size: 14px; line-height: 20px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }\n.dish__act { flex: none; align-self: center; }\n\n.add-btn { width: 80px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--primary); border-radius: 8px; background: var(--surface); color: var(--primary); font-size: 15px; line-height: 20px; font-weight: 600; transition: background-color .15s ease, transform .12s ease; }\n.add-btn:hover { background: var(--primary-subtle); }\n.add-btn:active { transform: scale(.94); }\n.stepper { width: 88px; height: 36px; display: inline-flex; align-items: center; justify-content: space-between; border-radius: 8px; background: var(--primary); color: var(--bg); animation: pop .25s var(--ease); }\n.stepper button { position: relative; width: 28px; height: 36px; display: grid; place-items: center; border: 0; background: transparent; color: var(--bg); font-size: 18px; font-weight: 600; transition: transform .12s ease; }\n.stepper button::before { content: \"\"; position: absolute; inset: -4px -6px; }\n.stepper button:active { transform: scale(.8); }\n.stepper button:focus-visible { outline-color: var(--text); outline-offset: -2px; }\n.stepper output { min-width: 20px; text-align: center; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }\n.stepper output.tick { animation: tick .25s var(--ease); }\n@keyframes tick { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }\n\n.empty { padding: var(--s8) var(--s4); text-align: center; color: var(--text-2); }\n.empty h2 { color: var(--text); margin-bottom: var(--s2); }\n.empty button { margin-top: var(--s3); min-height: 44px; padding: 0 var(--s5); border: 1.5px solid var(--primary); border-radius: 12px; background: transparent; color: var(--primary); font-size: 15px; font-weight: 600; }\n\n/* ---------- Session summary bar ---------- */\n.bar { position: fixed; z-index: 45; left: 50%; bottom: calc(var(--s4) + var(--safe-b)); width: calc(min(100%, 480px) - 32px); height: 64px; transform: translateX(-50%); display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: 0 var(--s4); background: var(--text); border-radius: 16px; box-shadow: 0 12px 28px rgba(41, 33, 30, .35); animation: barIn .6s .3s var(--ease) both; }\n@keyframes barIn { from { transform: translate(-50%, 140%); } to { transform: translate(-50%, 0); } }\n.bar.pulse { animation: barPulse .35s var(--ease); }\n@keyframes barPulse { 0% { transform: translateX(-50%) scale(1); } 40% { transform: translateX(-50%) scale(1.025); } 100% { transform: translateX(-50%) scale(1); } }\n.bar__info { display: flex; flex-direction: column; min-width: 0; }\n.bar__cap { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted); }\n.bar__total { font-size: 18px; line-height: 24px; font-weight: 700; color: var(--bg); font-variant-numeric: tabular-nums; }\n.bar__btn { flex: none; height: 40px; padding: 0 var(--s4); border: 0; border-radius: 8px; background: var(--primary); color: var(--bg); font-size: 15px; line-height: 20px; font-weight: 600; transition: background-color .15s ease, transform .12s ease; }\n.bar__btn:hover { background: var(--primary-hover); }\n.bar__btn:active { transform: scale(.96); }\n.bar__btn:focus-visible { outline-color: var(--bg); outline-offset: 3px; }\n.bar__badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: 6px; padding: 0 5px; border-radius: 999px; background: var(--bg); color: var(--primary); font-size: 12px; font-weight: 700; vertical-align: 1px; }\n\n/* ---------- Sheet ---------- */\n.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(41, 33, 30, .5); opacity: 0; transition: opacity .25s ease; }\n.scrim.is-open { opacity: 1; }\n.sheet { position: fixed; z-index: 55; left: 50%; bottom: 0; width: min(100%, 480px); max-height: 88vh; display: flex; flex-direction: column; background: var(--bg); border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(41, 33, 30, .2); transform: translate(-50%, 100%); transition: transform .35s var(--ease); }\n.sheet.is-open { transform: translate(-50%, 0); }\n.sheet__handle { flex: none; width: 40px; height: 4px; margin: var(--s2) auto; border-radius: 4px; background: var(--border); }\n.sheet__head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--s4) var(--s2); }\n.icon-btn { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; }\n.icon-btn:hover { background: rgba(41, 33, 30, .06); }\n.sheet__scroll { flex: 1; overflow-y: auto; padding: 0 var(--s4) var(--s4); }\n.sheet__foot { flex: none; padding: var(--s3) var(--s4) calc(var(--s3) + var(--safe-b)); background: var(--surface); border-top: 1px solid var(--border); }\n.grp__title { margin: var(--s4) 0 var(--s2); display: flex; align-items: baseline; justify-content: space-between; font-size: 16px; line-height: 24px; font-weight: 600; }\n.grp__hint { font-size: 12px; font-weight: 500; color: var(--text-2); }\n.line { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--border); animation: fadeUp .3s var(--ease) both; }\n.line:last-child { border-bottom: 0; }\n.line__main { min-width: 0; display: flex; align-items: center; gap: var(--s2); }\n.line__name { font-size: 14px; font-weight: 600; }\n.line__price { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }\n.line .stepper { width: 80px; height: 32px; }\n.line .stepper button { height: 32px; }\n.chip { margin-left: var(--s2); padding: 2px var(--s2); border-radius: 999px; background: #E8F3EC; color: var(--success); font-size: 12px; line-height: 16px; font-weight: 600; }\n.sent { padding: var(--s3); margin-bottom: var(--s2); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }\n.sent__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s2); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.sent li { display: flex; justify-content: space-between; font-size: 14px; line-height: 22px; }\n.tot { display: flex; align-items: baseline; justify-content: space-between; margin-top: var(--s4); padding-top: var(--s3); border-top: 1px dashed var(--border); font-weight: 600; }\n.tot strong { font-size: 18px; line-height: 24px; font-weight: 700; }\n.note { margin-top: var(--s2); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.blank { padding: var(--s6) 0; text-align: center; color: var(--text-2); }\n\n.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: 52px; padding: 0 var(--s6); border: 0; border-radius: 12px; background: var(--primary); color: var(--bg); font-size: 15px; font-weight: 600; transition: background-color .15s ease, t m .5s var(--ease); transition-delay: calc(var(--i) * 120ms + 200ms); }\n.step:last-child::after, .step:last-child::before { display: none; }\n.step[data-state=\"done\"]::before { transform: scaleY(1); }\n.step__node { position: relative; flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted); background: var(--surface); color: transparent; transition: background-color .35s ease, border-color .35s ease, color .35s ease; z-index: 2; }\n.step__node svg { width: 14px; height: 14px; transform: scale(0); transition: transform .35s var(--ease); }\n.step__node i { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: transparent; }\n.step[data-state=\"done\"] .step__node { background: var(--success); border-color: var(--success); color: #fff; }\n.step[data-state=\"done\"] .step__node svg { transform: scale(1); }\n.step[data-state=\"active\"] .step__node { border-color: var(--primary); }\n.step[data-state=\"active\"] .step__node i { background: var(--primary); }\n.step[data-state=\"active\"] .step__node i::after { content: \"\"; position: absolute; inset: 0; border-radius: 50%; background: var(--primary); animation: pulse 1.5s ease-out infinite; }\n.step__text { padding-top: 2px; }\n.step__title { font-size: 15px; line-height: 20px; font-weight: 600; }\n.step__sub { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.step[data-state=\"pending\"] .step__title { color: var(--text-2); font-weight: 500; }\n.step[data-state=\"active\"] .step__title { color: var(--primary); }\n.step[data-state=\"active\"] .step__sub { color: var(--primary-hover); }\n.step[data-state=\"done\"] .step__sub { color: var(--success); }\n\n/* ---------- Items ---------- */\n.items__head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--s2); }\n.items__count { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.it ive { transform: scale(.98); }\n.nudge strong { flex: none; color: var(--primary-hover); font-weight: 600; }\n\n/* ---------- Quick actions ---------- */\n.actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }\n.obtn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 48px; padding: 0 var(--s3); border-radius: 12px; background: var(--surface); font-size: 15px; line-height: 20px; font-weight: 600; text-align: center; transition: background-color .15s ease, transform .12s ease, border-color .2s ease, color .2s ease; }\n.obtn--red { border: 1.5px solid var(--primary); color: var(--primary); }\n.obtn--red:hover { background: var(--primary-subtle); }\n.obtn--dark { border: 1.5px solid var(--text); color: var(--text); }\n.obtn--dark:hover { background: rgba(41, 33, 30, .06); }\n.obtn:active { transform: scale(.97); }\n.obtn--inline { margin-top: var(--s4); padding: 0 var(--s6); }\n.obtn__icon { display: inline-block; transform-origin: 50% 10%; }\n.obtn--dark:not([data-state]) .obtn__icon, .obtn--dark[data-state=\"idle\"] .obtn__icon { animation: ring 4s 1.5s ease-in-out infinite; }\n@keyframes ring { 0%, 8%, 100% { transform: rotate(0); } 2% { transform: rotate(16deg); } 4% { transform: rotate(-14deg); } 6% { transform: rotate(8deg); } }\n.obtn__spinner { display: none; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }\n.obtn[data-state=\"sending\"] { cursor: progress; }\n.obtn[data-state=\"sending\"] .obtn__icon { display: none; }\n.obtn[data-state=\"sending\"] .obtn__spinner { display: inline-block; }\n.obtn[data-state=\"called\"] { border-color: var(--success); color: var(--success); background: var(--success-bg); cursor: default; }\n\n/* ---------- Empty ---------- */\n.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--s8) var(--s5); }\n.emp
