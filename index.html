p: 10px;\n}\n\n.brand-icon {\n  width: 42px;\n  height: 42px;\n  background: var(--background);\n  border-radius: 12px;\n  display: grid;\n  place-items: center;\n  font-size: 23px;\n}\n\n.brand h1 {\n  font-size: 17px;\n  font-weight: 800;\n  letter-spacing: -0.6px;\n}\n\n.brand h1 span {\n  color: var(--primary);\n}\n\n.brand p {\n  color: var(--secondary);\n  font-size: 9px;\n  font-weight: 700;\n  letter-spacing: 1.4px;\n  margin-top: 3px;\n}\n\n.notification-btn {\n  width: 42px;\n  height: 42px;\n  background: var(--background);\n  color: var(--text);\n  border-radius: 12px;\n  font-size: 22px;\n  position: relative;\n}\n\n.notification-dot {\n  position: absolute;\n  width: 8px;\n  height: 8px;\n  background: var(--primary);\n  border-radius: 50%;\n  top: 9px;\n  right: 9px;\n}\n\n.waiter-profile {\n  gap: 11px;\n}\n\n.profile-avatar {\n  width: 44px;\n  height: 44px;\n  border-radius: 50%;\n  background: #F1DCD2;\n  color: var(--primary);\n  display: grid;\n  place-items: center;\n  font-weight: 800;\n  font-size: 14px;\n}\n\n.profile-info {\n  flex: 1;\n}\n\n.profile-info h2 {\n  font-size: 14px;\n  font-weight: 700;\n}\n\n.profile-info p {\n  color: var(--secondary);\n  font-size: 10px;\n  margin-top: 5px;\n}\n\n.duty-toggle {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  background: var(--success-bg);\n  color: var(--success);\n  padding: 8px 10px;\n  border-radius: 30px;\n  font-size: 10px;\n  font-weight: 700;\n}\n\n.duty-toggle.off {\n  background: var(--danger-bg);\n  color: var(--danger);\n}\n\n.duty-indicator,\n.live-badge span {\n  width: 7px;\n  height: 7px;\n  background: currentColor;\n  border-radius: 50%;\n}\n\n/* MAIN */\n\n.main-content {\n  padding: 22px 16px;\n}\n\n.welcome-section {\n  margin-bottom: 22px;\n}\n\n.eyebrow {\n  font-size: 9px;\n  letter-spacing: 1.2px;\n  color: var(--secondary);\n  font-weight: 800;\n}\n\n.welcome-section h2 {\n  font-size: 21px;\n  font-weight: 800;\n  letter-spacing: -0.8px;\n  margin-top: 8px;\n}\n\n.welcome-subtitle {\n  color: var(--secondary);\n  font-size: 12px;\n  margin-top: 7px;\n}\n\n/* STATS */\n\n.stats-grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 11px;\n  margin-bottom: 30px;\n}\n\n.stat-card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-md);\n  padding: 14px;\n  box-shadow: var(--shadow);\n}\n\n.stat-icon {\n  display: block;\n  font-size: 19px;\n  margin-bottom: 12px;\n}\n\n.stat-card p {\n  font-size: 11px;\n  color: var(--secondary);\n  font-weight: 500;\n}\n\n.stat-card h3 {\n  font-size: 24px;\n  font-weight: 800;\n  margin: 5px 0;\n}\n\n.stat-caption {\n  font-size: 9px;\n  color: var(--secondary);\n}\n\n/* SECTIONS */\n\n.section {\n  margin-bottom: 30px;\n}\n\n.section-heading {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  margin-bottom: 14px;\n}\n\n.section-heading h2 {\n  font-size: 17px;\n  font-weight: 800;\n  letter-spacing: -0.4px;\n}\n\n.section-heading p {\n  font-size: 11px;\n  color: var(--secondary);\n  margin-top: 5px;\n}\n\n.text-action {\n  background: none;\n  color: var(--primary);\n  font-size: 11px;\n  font-weight: 700;\n}\n\n.live-badge {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  color: var(--success);\n  font-size: 9px;\n  font-weight: 800;\n}\n\n.live-badge span {\n  animation: pulse 1.5s infinite;\n}\n\n@keyframes pulse {\n  50% {\n    opacity: 0.3;\n  }\n}\n\n/* ALERTS */\n\n.alerts-container {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.alert-card {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  background: var(--surface);\n  border: 1px solid var(--border);\n  padding: 13px 11px;\n  border-radius: var(--radius-md);\n  box-shadow: var(--shadow);\n}\n\n.alert-icon {\n  width: 38px;\n  height: 38px;\n  border-radius: 11px;\n  background: var(--background);\n  display: grid;\n  place-items: center;\n  flex-shrink: 0;\n  font-size: 17px;\n}\n\n.alert-content {\n  flex: 1;\n  min-width: 0;\n}\n\n.alert-content h3 {\n  font-size: 12px;\n  font-weight: 700;\n}\n\n.alert-content p {\n  font-size: 10px;\n  color: var(--secondary);\n  margin-top: 4px;\n}\n\n.alert-content span {\n  font-size: 9px;\n  color: #998D86;\n  display: block;\n  margin-top: 5px;\n}\n\n.small-action {\n  background: var(--primary);\n  color: white;\n  border-radius: 8px;\n  padding: 9px 10px;\n  font-size: 10px;\n  font-weight: 700;\n  flex-shrink: 0;\n}\n\n/* TABLES */\n\n.table-grid {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 11px;\n}\n\n.table-card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-md);\n  padding: 13px;\n  box-shadow: var(--shadow);\n}\n\n.table-card-top {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 5px;\n}\n\n.table-number {\n  font-size: 11px;\n  font-weight: 800;\n}\n\n.status-pill {\n  font-size: 9px;\n  font-weight: 700;\n  border-radius: 30px;\n  padding: 6px 8px;\n  white-space: nowrap;\n}\n\n.occupied-pill,\n.preparing-pill {\n  color: var(--warning);\n  background: var(--warning-bg);\n}\n\n.available-pill,\n.ready-pill {\n  color: var(--success);\n  background: var(--success-bg);\n}\n\n.table-card h3 {\n  font-size: 17px;\n  font-weight: 800;\n  margin-top: 15px;\n}\n\n.table-card > p {\n  font-size: 10px;\n  color: var(--secondary);\n  margin-top: 5px;\n}\n\n.table-divider {\n  border-top: 1px solid var(--border);\n  margin: 14px 0 11px;\n}\n\n.table-footer {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 5px;\n}\n\n.table-footer > span {\n  font-size: 12px;\n  font-weight: 800;\n}\n\n.table-action {\n  color: var(--primary);\n  background: none;\n  font-size: 10px;\n  font-weight: 700;\n}\n\n/* ORDERS */\n\n.orders-container {\n  display: flex;\n  flex-direction: column;\n  gap: 11px;\n}\n\n.order-card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  padding: 14px;\n  border-radius: var(--radius-md);\n  box-shadow: var(--shadow);\n}\n\n.order-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: flex-start;\n}\n\n.order-id {\n  font-size: 9px;\n  color: var(--secondary);\n  font-weight: 700;\n}\n\n.order-header h3 {\n  font-size: 14px;\n  margin-top: 5px;\n}\n\n.order-items {\n  border-top: 1px solid var(--border);\n  border-bottom: 1px solid var(--border);\n  margin: 12px 0;\n  padding: 11px 0;\n}\n\n.order-items p {\n  font-size: 11px;\n  color: var(--secondary);\n  margin: 6px 0;\n}\n\n.order-footer {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}\n\n.order-footer > span {\n  color: var(--secondary);\n  font-size: 10px;\n}\n\n.outline-btn,\n.primary-btn {\n  padding: 9px 12px;\n  border-radius: 9px;\n  font-size: 10px;\n  font-weight: 700;\n}\n\n.outline-btn {\n  background: white;\n  color: var(--primary);\n  border: 1px solid var(--primary);\n}\n\n.primary-btn {\n  background: var(--primary);\n  color: white;\n}\n\n/* SHIFT */\n\n.shift-card {\n  background: var(--text);\n  color: white;\n  border-radius: var(--radius-lg);\n  padding: 18px;\n  margin-bottom: 10px;\n}\n\n.shift-header {\n  display: flex;\n  justify-content: space-between;\n}\n\n.shift-header .eyebrow {\n  color: #C9BDB7;\n}\n\n.shift-header h2 {\n  font-size: 16px;\n  margin-top: 7px;\n}\n\n.shift-icon {\n  font-size: 24px;\n}\n\n.shift-stats {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  margin-top: 22px;\n  gap: 8px;\n}\n\n.shift-stats h3 {\n  font-size: 15px;\n}\n\n.shift-stats p {\n  color: #C9BDB7;\n  font-size: 9px;\n  margin-top: 6px;\n}\n\n/* BOTTOM NAV */\n\n.bottom-nav {\n  position: fixed;\n  z-index: 20;\n  bottom: 0;\n  left: 50%;\n  transform: translateX(-50%);\n  width: 100%;\n  max-width: 480px;\n  background: rgba(255, 255, 255, 0.97);\n  border-top: 1px solid var(--border);\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  padding: 10px 8px calc(10px + env(safe-area-inset-bottom));\n}\n\n.nav-item {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 5px;\n  color: var(--secondary);\n  background: transparent;\n  font-size: 10px;\n  font-weight: 600;\n  padding: 5px;\n}\n\n.nav-icon {\n  font-size: 22px;\n  line-height: 1;\n}\n\n.nav-item.active {\n  color: var(--primary);\n}\n\n.nav-item.active .nav-icon {\n  font-weight: 800;\n}\n\n/* MODAL */\n\n.modal-overlay {\n  position: fixed;\n  inset: 0;\n  background: rgba(41, 33, 30, 0.55);\n  z-index: 50;\n  display: none;\n  align-items: flex-end;\n  justify-content: center;\n}\n\n.modal-overlay.show {\n  display: flex;\n}\n\n.modal {\n  width: 100%;\n  max-width: 480px;\n  background: var(--background);\n  border-radius: 22px 22px 0 0;\n  padding: 12px 18px 30px;\n  max-height: 85vh;\n  overflow-y: auto;\n  animation: slideUp 0.25s ease;\n}\n\n@keyframes slideUp {\n  from {\n    transform: translateY(100%);\n  }\n\n  to {\n    transform: translateY(0);\n  }\n}\n\n.modal-handle {\n  height: 4px;\n  width: 38px;\n  background: #D9CFC7;\n  border-radius: 10px;\n  margin: 0 auto 18px;\n}\n\n.modal-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 18px;\n}\n\n.modal-header h2 {\n  font-size: 18px;\n}\n\n.modal-header button {\n  background: var(--surface);\n  border-radius: 50%;\n  width: 34px;\n  height: 34px;\n  font-size: 23px;\n  color: var(--text);\n}\n\n.modal-body {\n  font-size: 13px;\n  line-height: 1.7;\n}\n\n.modal-body button {\n  margin-top: 12px;\n}\n\n/* ACCESSIBILITY */\n\nbutton:focus-visible {\n  outline: 3px solid rgba(184, 50, 37, 0.35);\n  outline-offset: 3px;\n}\n\nbutton:disabled {\n  opacity: 0.5;\n  cursor: not-allowed;\n}\n\n@media (min-width: 481px) {\n  body {\n    padding: 24px 0;\n  }\n\n  .app {\n    border-radius: 20px;\n    overflow: hidden;\n    box-shadow: 0 8px 40px rgba(41, 33, 30, 0.08);\n  }\n\n  .bottom-nav {\n    bottom: 24px;\n    border-radius: 0 0 20px 20px;\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *,\n  *::before,\n  *::after {\n    animation-duration: 0.01ms !important;\n    transition-duration: 0.01ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n<\/style>\n<\/head>\n\n<body>\n\n  <div class=\"app\">\n\n    <\!-- HEADER -->\n    <header class=\"app-header\">\n\n      <div class=\"header-top\">\n\n        <div class=\"brand\">\n          <span class=\"brand-icon\">\ud83d\udd25<\/span>\n\n          <div>\n            <h1>Ember <span>&<\/span> Plate<\/h1>\n            <p>WAITER DASHBOARD<\/p>\n          <\/div>\n        <\/div>\n\n        <button class=\"notification-btn\" id=\"notificationBtn\" aria-label=\"Notifications\">\n          <span>\u2667<\/span>\n          <i class=\"notification-dot\"><\/i>\n        <\/button>\n\n      <\/div>\n\n      <div class=\"waiter-profile\">\n\n        <div class=\"profile-avatar\">PS<\/div>\n\n        <div class=\"profile-info\">\n          <h2>Priya Singh<\/h2>\n          <p>Waiter \u00b7 Shift 11:00 AM \u2013 7:00 PM<\/p>\n        <\/div>\n\n        <button class=\"duty-toggle active\" id=\"dutyToggle\">\n          <span class=\"duty-indicator\"><\/span>\n          On Duty\n        <\/button>\n\n      <\/div>\n\n    <\/header>\n\n\n    <\!-- MAIN CONTENT -->\n    <main class=\"main-content\">\n\n      <\!-- WELCOME -->\n      <section class=\"welcome-section\">\n\n        <div>\n          <p class=\"eyebrow\">THURSDAY, NOVEMBER 5<\/p>\n          <h2>Good morning, Priya! \ud83d\udc4b<\/h2>\n          <p class=\"welcome-subtitle\">Here's what's happening on your floor.<\/p>\n        <\/div>\n\n      <\/section>\n\n\n      <\!-- STATS -->\n      <section class=\"stats-grid\">\n\n        <article class=\"stat-card\">\n          <span class=\"stat-icon\">\ud83e\ude91<\/span>\n          <p>Assigned Tables<\/p>\n          <h3 id=\"assignedTables\">4<\/h3>\n          <span class=\"stat-caption\">Tables 1\u20134<\/span>\n        <\/article>\n\n        <article class=\"stat-card\">\n          <span class=\"stat-icon\">\ud83d\udd14<\/span>\n          <p>New Calls<\/p>\n          <h3 id=\"newCalls\">2<\/h3>\n          <span class=\"stat-caption\">Need attention<\/span>\n        <\/article>\n\n        <article class=\"stat-card\">\n          <span class=\"stat-icon\">\ud83c\udf7d\ufe0f<\/span>\n          <p>Ready Dishes<\/p>\n          <h3 id=\"readyDishes\">3<\/h3>\n          <span class=\"stat-caption\">From kitchen<\/span>\n        <\/article>\n\n        <article class=\"stat-card\">\n          <span class=\"stat-icon\">\ud83d\udcb3<\/span>\n          <p>Bill Requests<\/p>\n          <h3 id=\"billRequests\">1<\/h3>\n          <span class=\"stat-caption\">Awaiting payment<\/span>\n        <\/article>\n\n      <\/section>\n\n\n      <\!-- LIVE ALERTS -->\n      <section class=\"section\">\n\n        <div class=\"section-heading\">\n          <div>\n            <h2>Live Alerts<\/h2>\n            <p>Things that need your attention<\/p>\n          <\/div>\n\n          <span class=\"live-badge\">\n            <span><\/span> LIVE\n          <\/span>\n        <\/div>\n\n        <div class=\"alerts-container\" id=\"alertsContainer\">\n\n          <article class=\"alert-card call-alert\">\n            <div class=\"alert-icon\">\ud83d\udd14<\/div>\n\n            <div class=\"alert-content\">\n              <h3>Customer calling<\/h3>\n              <p>Table 2 \u00b7 Requested assistance<\/p>\n              <span>2 minutes ago<\/span>\n            <\/div>\n\n            <button class=\"small-action\" data-action=\"resolve-call\" data-table=\"2\">\n              Attend\n            <\/button>\n          <\/article>\n\n          <article class=\"alert-card ready-alert\">\n            <div class=\"alert-icon\">\ud83c\udf7d\ufe0f<\/div>\n\n            <div class=\"alert-content\">\n              <h3>Order ready<\/h3>\n              <p>Table 3 \u00b7 2 dishes ready<\/p>\n              <span>Just now<\/span>\n            <\/div>\n\n            <button class=\"small-action\" data-action=\"serve-order\" data-table=\"3\">\n              Serve\n            <\/button>\n          <\/article>\n\n          <article class=\"alert-card bill-alert\">\n            <div class=\"alert-icon\">\ud83d\udcb3<\/div>\n\n            <div class=\"alert-content\">\n              <h3>Bill requested<\/h3>\n              <p>Table 1 \u00b7 Customer wants bill<\/p>\n              <span>5 minutes ago<\/span>\n            <\/div>\n\n            <button class=\"small-action\" data-action=\"open-bill\" data-table=\"1\">\n              View Bill\n            <\/button>\n          <\/article>\n\n        <\/div>\n\n      <\/section>\n\n\n      <\!-- TABLE MANAGEMENT -->\n      <section class=\"section\">\n\n        <div class=\"section-heading\">\n          <div>\n            <h2>Your Tables<\/h2>\n            <p>Manage your assigned tables<\/p>\n          <\/div>\n\n          <button class=\"text-action\" id=\"viewAllTables\">\n            View all\n          <\/button>\n        <\/div>\n\n        <div class=\"table-grid\" id=\"tableGrid\">\n\n          <\!-- TABLE 1 -->\n          <article class=\"table-card occupied\" data-table=\"1\">\n\n            <div class=\"table-card-top\">\n              <span class=\"table-number\">Table 01<\/span>\n              <span class=\"status-pill occupied-pill\">Occupied<\/span>\n            <\/div>\n\n            <h3>4 Guests<\/h3>\n            <p>Since 12:15 PM<\/p>\n\n            <div class=\"table-divider\"><\/div>\n\n            <div class=\"table-footer\">\n              <span>\u20b91,240<\/span>\n              <button class=\"table-action\" data-action=\"table-details\" data-table=\"1\">\n                Manage \u2192\n              <\/button>\n            <\/div>\n\n          <\/article>\n\n\n          <\!-- TABLE 2 -->\n          <article class=\"table-card occupied\" data-table=\"2\">\n\n            <div class=\"table-card-top\">\n              <span class=\"table-number\">Table 02<\/span>\n              <span class=\"status-pill occupied-pill\">Occupied<\/span>\n            <\/div>\n\n            <h3>2 Guests<\/h3>\n            <p>Since 12:30 PM<\/p>\n\n            <div class=\"table-divider\"><\/div>\n\n            <div class=\"table-footer\">\n              <span>\u20b9860<\/span>\n              <button class=\"table-action\" data-action=\"table-details\" data-table=\"2\">\n                Manage \u2192\n              <\/button>\n            <\/div>\n\n          <\/article>\n\n\n          <\!-- TABLE 3 -->\n          <article class=\"table-card occupied\" data-table=\"3\">\n\n            <div class=\"table-card-top\">\n              <span class=\"table-number\">Table 03<\/span>\n              <span class=\"status-pill occupied-pill\">Occupied<\/span>\n            <\/div>\n\n            <h3>3 Guests<\/h3>\n            <p>Since 12:45 PM<\/p>\n\n            <div class=\"table-divider\"><\/div>\n\n            <div class=\"table-footer\">\n              <span>\u20b91,560<\/span>\n              <button class=\"table-action\" data-action=\"table-details\" data-table=\"3\">\n                Manage \u2192\n              <\/button>\n            <\/div>\n\n          <\/article>\n\n\n          <\!-- TABLE 4 -->\n          <article class=\"table-card available\" data-table=\"4\">\n\n            <div class=\"table-card-top\">\n              <span class=\"table-number\">Table 04<\/span>\n              <span class=\"status-pill available-pill\">Available<\/span>\n            <\/div>\n\n            <h3>4 Guests<\/h3>\n            <p>Ready for seating<\/p>\n\n            <div class=\"table-divider\"><\/div>\n\n            <div class=\"table-footer\">\n              <span>\u2014<\/span>\n              <button class=\"table-action\" data-action=\"table-details\" data-table=\"4\">\n                Manage \u2192\n              <\/button>\n            <\/div>\n\n          <\/article>\n\n        <\/div>\n\n      <\/section>\n\n\n      <\!-- ACTIVE ORDERS -->\n      <section class=\"section\">\n\n        <div class=\"section-heading\">\n          <div>\n            <h2>Active Orders<\/h2>\n            <p>Track orders from your tables<\/p>\n          <\/div>\n\n          <button class=\"text-action\" id=\"viewOrders\">\n            View all\n          <\/button>\n        <\/div>\n\n        <div class=\"orders-container\" id=\"ordersContainer\">\n\n          <article class=\"order-card\">\n\n            <div class=\"order-header\">\n              <div>\n                <span class=\"order-id\">#ORD-1024<\/span>\n                <h3>Table 01<\/h3>\n              <\/div>\n\n              <span class=\"status-pill preparing-pill\">\n                Preparing\n              <\/span>\n            <\/div>\n\n            <div class=\"order-items\">\n              <p>2 \u00d7 Paneer Tikka<\/p>\n              <p>1 \u00d7 Butter Naan<\/p>\n              <p>1 \u00d7 Dal Makhani<\/p>\n            <\/div>\n\n            <div class=\"order-footer\">\n              <span>12:45 PM<\/span>\n              <button class=\"outline-btn\" data-action=\"order-details\" data-order=\"ORD-1024\">\n                View order\n              <\/button>\n            <\/div>\n\n          <\/article>\n\n\n          <article class=\"order-card\">\n\n            <div class=\"order-header\">\n              <div>\n                <span class=\"order-id\">#ORD-1025<\/span>\n                <h3>Table 03<\/h3>\n              <\/div>\n\n              <span class=\"status-pill ready-pill\">\n                Ready\n              <\/span>\n            <\/div>\n\n            <div class=\"order-items\">\n              <p>1 \u00d7 Smoky Chicken Tikka<\/p>\n              <p>2 \u00d7 Peri Peri Wings<\/p>\n            <\/div>\n\n            <div class=\"order-footer\">\n              <span>12:50 PM<\/span>\n              <button class=\"primary-btn\" data-action=\"serve-order\" data-table=\"3\">\n                Serve order\n              <\/button>\n            <\/div>\n\n          <\/article>\n\n        <\/div>\n\n      <\/section>\n\n\n      <\!-- SHIFT SUMMARY -->\n      <section class=\"shift-card\">\n\n        <div class=\"shift-header\">\n          <div>\n            <span class=\"eyebrow\">TODAY'S PERFORMANCE<\/span>\n            <h2>Your Shift Summary<\/h2>\n          <\/div>\n\n          <span class=\"shift-icon\">\ud83d\udcca<\/span>\n        <\/div>\n\n        <div class=\"shift-stats\">\n          <div>\n            <h3>12<\/h3>\n            <p>Orders served<\/p>\n          <\/div>\n\n          <div>\n            <h3>\u20b98,450<\/h3>\n            <p>Sales handled<\/p>\n          <\/div>\n\n          <div>\n            <h3>4.8 \u2b50<\/h3>\n            <p>Customer rating<\/p>\n          <\/div>\n        <\/div>\n\n      <\/section>\n\n    <\/main>\n\n\n    <\!-- BOTTOM NAVIGATION -->\n    <nav class=\"bottom-nav\">\n\n      <button class=\"nav-item active\" data-page=\"home\">\n        <span class=\"nav-icon\">\u2302<\/span>\n        <span>Home<\/span>\n      <\/button>\n\n      <button class=\"nav-item\" data-page=\"tables\">\n        <span class=\"nav-icon\">\u25a6<\/span>\n        <span>Tables<\/span>\n      <\/button>\n\n      <button class=\"nav-item\" data-page=\"orders\">\n        <span class=\"nav-icon\">\u2637<\/span>\n        <span>Orders<\/span>\n      <\/button>\n\n      <button class=\"nav-item\" data-page=\"profile\">\n        <span class=\"nav-icon\">\u2659<\/span>\n        <span>Profile<\/span>\n      <\/button>\n\n    <\/nav>\n\n\n    <\!-- MODAL -->\n    <div class=\"modal-overlay\" id=\"modalOverlay\">\n\n      <div class=\"modal\" id=\"modal\">\n\n        <div class=\"modal-handle\"><\/div>\n\n        <div class=\"modal-header\">\n          <h2 id=\"modalTitle\">Table Details<\/h2>\n\n          <button id=\"closeModal\" aria-label=\"Close\">\n            \u00d7\n          <\/button>\n        <\/div>\n\n        <div class=\"modal-body\" id=\"modalBody\"><\/div>\n\n      <\/div>\n\n    <\/div>\n\n  <\/div>\n\n  <script>\n/* =========================================\n   EMBER & PLATE\n   WAITER DASHBOARD\n   INTERACTIVE FRONTEND DEMO\n========================================= */\n\n(() => {\n  \"use strict\";\n\n  // -----------------------------------------\n  // CONFIGURATION\n  // -----------------------------------------\n\n  const state = {\n    waiter: {\n      name: \"Priya Singh\",\n      onDuty: true\n    },\n\n    tables: [\n      {\n        id: 1,\n        guests: 4,\n        status: \"occupied\",\n        amount: 1240,\n        since: \"12:15 PM\",\n        billRequested: true,\n        callRequested: false\n      },\n      {\n        id: 2,\n        guests: 2,\n        status: \"occupied\",\n        amount: 860,\n        since: \"12:30 PM\",\n        billRequested: false,\n        callRequested: true\n      },\n      {\n        id: 3,\n        guests: 3,\n        status: \"occupied\",\n        amount: 1560,\n        since: \"12:45 PM\",\n        billRequested: false,\n        callRequested: false\n      },\n      {\n        id: 4,\n        guests: 4,\n        status: \"available\",\n        amount: 0,\n        since: null,\n        billRequested: false,\n        callRequested: false\n      }\n    ],\n\n    orders: [\n      {\n        id: \"ORD-1024\",\n        table: 1,\n        items: [\n          \"2 \u00d7 Paneer Tikka\",\n          \"1 \u00d7 Butter Naan\",\n          \"1 \u00d7 Dal Makhani\"\n        ],\n        status: \"preparing\",\n        time: \"12:45 PM\",\n        amount: 1240\n      },\n      {\n        id: \"ORD-1025\",\n        table: 3,\n        items: [\n          \"1 \u00d7 Smoky Chicken Tikka\",\n          \"2 \u00d7 Peri Peri Wings\"\n        ],\n        status: \"ready\",\n        time: \"12:50 PM\",\n        amount: 1560\n      }\n    ],\n\n    calls: [\n      {\n        table: 2,\n        message: \"Customer requested assistance\",\n        time: \"2 minutes ago\"\n      }\n    ],\n\n    bills: [1]\n  };\n\n\n  // -----------------------------------------\n  // DOM REFERENCES\n  // -----------------------------------------\n\n  const elements = {\n    dutyToggle: document.getElementById(\"dutyToggle\"),\n\n    assignedTables: document.getElementById(\"assignedTables\"),\n    newCalls: document.getElementById(\"newCalls\"),\n    readyDishes: document.getElementById(\"readyDishes\"),\n    billRequests: document.getElementById(\"billRequests\"),\n\n    tableGrid: document.getElementById(\"tableGrid\"),\n    ordersContainer: document.getElementById(\"ordersContainer\"),\n    alertsContainer: document.getElementById(\"alertsContainer\"),\n\n    modalOverlay: document.getElementById(\"modalOverlay\"),\n    modalTitle: document.getElementById(\"modalTitle\"),\n    modalBody: document.getElementById(\"modalBody\"),\n    closeModal: document.getElementById(\"closeModal\")\n  };\n\n\n  // -----------------------------------------\n  // HELPERS\n  // -----------------------------------------\n\n  const formatCurrency = (amount) => {\n    return new Intl.NumberFormat(\"en-IN\", {\n      style: \"currency\",\n      currency: \"INR\",\n      maximumFractionDigits: 0\n    }).format(amount);\n  };\n\n\n  const getTable = (id) => {\n    return state.tables.find(table => table.id === Number(id));\n  };\n\n\n  const getOrder = (id) => {\n    return state.orders.find(order => order.id === id);\n  };\n\n\n  const escapeHTML = (value) => {\n    return String(value).replace(/[&<>\"']/g, char => ({\n      \"&\": \"&amp;\",\n      \"<\": \"&lt;\",\n      \">\": \"&gt;\",\n      '\"': \"&quot;\",\n      \"'\": \"&#39;\"\n    })[char]);\n  };\n\n\n  // -----------------------------------------\n  // MODAL\n  // -----------------------------------------\n\n  function openModal(title, content) {\n    elements.modalTitle.textContent = title;\n    elements.modalBody.innerHTML = content;\n    elements.modalOverlay.classList.add(\"show\");\n    document.body.style.overflow = \"hidden\";\n  }\n\n\n  function closeModal() {\n    elements.modalOverlay.classList.remove(\"show\");\n    document.body.style.overflow = \"\";\n  }\n\n\n  elements.closeModal.addEventListener(\"click\", closeModal);\n\n  elements.modalOverlay.addEventListener(\"click\", (event) => {\n    if (event.target === elements.modalOverlay) {\n      closeModal();\n    }\n  });\n\n\n  document.addEventListener(\"keydown\", (event) => {\n    if (event.key === \"Escape\") {\n      closeModal();\n    }\n  });\n\n\n  // -----------------------------------------\n  // DUTY MANAGEMENT\n  // -----------------------------------------\n\n  elements.dutyToggle.addEventListener(\"click\", () => {\n\n    state.waiter.onDuty = !state.waiter.onDuty;\n\n    updateDutyStatus();\n\n  });\n\n\n  function updateDutyStatus() {\n\n    const button = elements.dutyToggle;\n\n    button.classList.toggle(\"active\", state.waiter.onDuty);\n    button.classList.toggle(\"off\", !state.waiter.onDuty);\n\n    button.innerHTML = `\n      <span class=\"duty-indicator\"><\/span>\n      ${state.waiter.onDuty ? \"On Duty\" : \"Off Duty\"}\n    `;\n\n  }\n\n\n  // -----------------------------------------\n  // DASHBOARD STATISTICS\n  // -----------------------------------------\n\n  function updateStatistics() {\n\n    elements.assignedTables.textContent =\n      state.tables.filter(table => table.status !== \"available\").length;\n\n    elements.newCalls.textContent = state.calls.length;\n\n    elements.readyDishes.textContent =\n      state.orders.filter(order => order.status === \"ready\").length;\n\n    elements.billRequests.textContent =\n      state.bills.length;\n\n  }\n\n\n  // -----------------------------------------\n  // TABLE RENDERING\n  // -----------------------------------------\n\n  function renderTables() {\n\n    elements.tableGrid.innerHTML = state.tables.map(table => {\n\n      const occupied = table.status === \"occupied\";\n\n      return `\n        <article class=\"table-card ${table.status}\"\n          data-table=\"${table.id}\">\n\n          <div class=\"table-card-top\">\n\n            <span class=\"table-number\">\n              Table ${String(table.id).padStart(2, \"0\")}\n            <\/span>\n\n            <span class=\"status-pill ${\n              occupied ? \"occupied-pill\" : \"available-pill\"\n            }\">\n              ${occupied ? \"Occupied\" : \"Available\"}\n            <\/span>\n\n          <\/div>\n\n          <h3>\n            ${occupied ? `${table.guests} Guests` : \"Ready\"}\n          <\/h3>\n\n          <p>\n            ${occupied\n              ? `Since ${escapeHTML(table.since)}`\n              : \"Ready for seating\"}\n          <\/p>\n\n          <div class=\"table-divider\"><\/div>\n\n          <div class=\"table-footer\">\n\n            <span>\n              ${occupied ? formatCurrency(table.amount) : \"\u2014\"}\n            <\/span>\n\n            <button class=\"table-action\"\n              data-action=\"table-details\"\n              data-table=\"${table.id}\">\n              Manage \u2192\n            <\/button>\n\n          <\/div>\n\n        <\/article>\n      `;\n\n    }).join(\"\");\n\n  }\n\n\n  // -----------------------------------------\n  // ORDER RENDERING\n  // -----------------------------------------\n\n  function renderOrders() {\n\n    const activeOrders = state.orders.filter(order =>\n      order.status !== \"served\" &&\n      order.status !== \"cancelled\"\n    );\n\n    if (!activeOrders.length) {\n      elements.ordersContainer.innerHTML = `\n        <div class=\"order-card\">\n          <p>No active orders right now.<\/p>\n        <\/div>\n      `;\n      return;\n    }\n\n    elements.ordersContainer.innerHTML = activeOrders.map(order => {\n\n      const statusClass = {\n        preparing: \"preparing-pill\",\n        ready: \"ready-pill\"\n      }[order.status] || \"occupied-pill\";\n\n      return `\n        <article class=\"order-card\">\n\n          <div class=\"order-header\">\n\n            <div>\n              <span class=\"order-id\">\n                #${escapeHTML(order.id)}\n              <\/span>\n\n              <h3>Table ${String(order.table).padStart(2, \"0\")}<\/h3>\n            <\/div>\n\n            <span class=\"status-pill ${statusClass}\">\n              ${escapeHTML(order.status)}\n            <\/span>\n\n          <\/div>\n\n          <div class=\"order-items\">\n            ${order.items.map(item => `\n              <p>${escapeHTML(item)}<\/p>\n            `).join(\"\")}\n          <\/div>\n\n          <div class=\"order-footer\">\n\n            <span>${escapeHTML(order.time)}<\/span>\n\n            ${\n              order.status === \"ready\"\n              ? `\n                <button class=\"primary-btn\"\n                  data-action=\"serve-order\"\n                  data-table=\"${order.table}\">\n                  Serve order\n                <\/button>\n              `\n              : `\n                <button class=\"outline-btn\"\n                  data-action=\"order-details\"\n                  data-order=\"${escapeHTML(order.id)}\">\n                  View order\n                <\/button>\n              `\n            }\n\n          <\/div>\n\n        <\/article>\n      `;\n\n    }).join(\"\");\n\n  }\n\n\n  // -----------------------------------------\n  // ALERT RENDERING\n  // -----------------------------------------\n\n  function renderAlerts() {\n\n    const alerts = [];\n\n    state.calls.forEach(call => {\n      alerts.push({\n        type: \"call\",\n        table: call.table,\n        title: \"Customer calling\",\n        description: `Table ${call.table} \u00b7 ${call.message}`,\n        time: call.time,\n        action: \"resolve-call\",\n        button: \"Attend\",\n        icon: \"\ud83d\udd14\"\n      });\n    });\n\n    state.orders\n      .filter(order => order.status === \"ready\")\n      .forEach(order => {\n        alerts.push({\n          type: \"ready\",\n          table: order.table,\n          title: \"Order ready\",\n          description: `Table ${order.table} \u00b7 ${order.items.length} items`,\n          time: \"Just now\",\n          action: \"serve-order\",\n          button: \"Serve\",\n          icon: \"\ud83c\udf7d\ufe0f\"\n        });\n      });\n\n    state.bills.forEach(tableId => {\n      alerts.push({\n        type: \"bill\",\n        table: tableId,\n        title: \"Bill requested\",\n        description: `Table ${tableId} \u00b7 Customer wants bill`,\n        time: \"5 minutes ago\",\n        action: \"open-bill\",\n        button: \"View Bill\",\n        icon: \"\ud83d\udcb3\"\n      });\n    });\n\n    if (!alerts.length) {\n      elements.alertsContainer.innerHTML = `\n        <div class=\"alert-card\">\n          <p>No pending alerts. You're all caught up!<\/p>\n        <\/div>\n      `;\n      return;\n    }\n\n    elements.alertsContainer.innerHTML = alerts.map(alert => `\n      <article class=\"alert-card\">\n\n        <div class=\"alert-icon\">${alert.icon}<\/div>\n\n        <div class=\"alert-content\">\n          <h3>${escapeHTML(alert.title)}<\/h3>\n          <p>${escapeHTML(alert.description)}<\/p>\n          <span>${escapeHTML(alert.time)}<\/span>\n        <\/div>\n\n        <button class=\"small-action\"\n          data-action=\"${alert.action}\"\n          data-table=\"${alert.table}\">\n          ${alert.button}\n        <\/button>\n\n      <\/article>\n    `).join(\"\");\n\n  }\n\n\n  // -----------------------------------------\n  // TABLE DETAILS\n  // -----------------------------------------\n\n  function showTableDetails(tableId) {\n\n    const table = getTable(tableId);\n\n    if (!table) return;\n\n    const orders = state.orders.filter(order =>\n      order.table === table.id &&\n      order.status !== \"cancelled\"\n    );\n\n    const orderMarkup = orders.length\n      ? orders.map(order => `\n          <div class=\"order-items\">\n            <strong>#${escapeHTML(order.id)}<\/strong>\n            ${order.items.map(item => `\n              <p>${escapeHTML(item)}<\/p>\n            `).join(\"\")}\n            <p>Status: ${escapeHTML(order.status)}<\/p>\n          <\/div>\n        `).join(\"\")\n      : \"<p>No orders yet.<\/p>\";\n\n    const content = `\n      <p><strong>Table:<\/strong> ${table.id}<\/p>\n\n      <p><strong>Status:<\/strong> ${escapeHTML(table.status)}<\/p>\n\n      <p><strong>Guests:<\/strong> ${table.guests}<\/p>\n\n      <p><strong>Bill amount:<\/strong> ${formatCurrency(table.amount)}<\/p>\n\n      <h3 style=\"margin-top:18px;\">Orders<\/h3>\n\n      ${orderMarkup}\n\n      ${\n        table.status === \"available\"\n        ? `\n          <button class=\"primary-btn\"\n            data-action=\"seat-guests\"\n            data-table=\"${table.id}\">\n            Seat Guests\n          <\/button>\n        `\n        : `\n          <button class=\"outline-btn\"\n            data-action=\"request-bill\"\n            data-table=\"${table.id}\">\n            Request Bill\n          <\/button>\n        `\n      }\n    `;\n\n    openModal(`Table ${table.id} Details`, content);\n\n  }\n\n\n  // -----------------------------------------\n  // BILL MANAGEMENT\n  // -----------------------------------------\n\n  function showBill(tableId) {\n\n    const table = getTable(tableId);\n\n    if (!table) return;\n\n    const content = `\n      <p><strong>Table:<\/strong> ${table.id}<\/p>\n\n      <p><strong>Guests:<\/strong> ${table.guests}<\/p>\n\n      <hr style=\"margin:12px 0;border-color:#E6D9CD;\">\n\n      <h3>Total Amount: ${formatCurrency(table.amount)}<\/h3>\n\n      <p style=\"margin-top:8px;\">\n        Payment method can be selected at the payment counter.\n      <\/p>\n\n      <button class=\"primary-btn\"\n        data-action=\"complete-payment\"\n        data-table=\"${table.id}\">\n        Mark Payment Received\n      <\/button>\n    `;\n\n    openModal(`Table ${table.id} Bill`, content);\n\n  }\n\n\n  function completePayment(tableId) {\n\n    const table = getTable(tableId);\n\n    if (!table || table.status !== \"occupied\") return;\n\n    const unpaidOrders = state.orders.filter(order =>\n      order.table === table.id &&\n      order.status !== \"cancelled\" &&\n      order.status !== \"served\"\n    );\n\n    if (unpaidOrders.length) {\n      openModal(\n        \"Orders still active\",\n        \"<p>Serve or close all active orders before completing this payment.<\/p>\"\n      );\n      return;\n    }\n\n    table.status = \"available\";\n    table.guests = 0;\n    table.amount = 0;\n    table.since = null;\n    table.billRequested = false;\n\n    state.bills = state.bills.filter(id => id !== table.id);\n    state.calls = state.calls.filter(call => call.table !== table.id);\n\n    state.orders\n      .filter(order => order.table === table.id)\n      .forEach(order => order.status = \"served\");\n\n    closeModal();\n    refreshDashboard();\n\n    openModal(\n      \"Payment Completed\",\n      `<p>Table ${table.id} has been cleared successfully.<\/p>`\n    );\n\n  }\n\n\n  // -----------------------------------------\n  // ORDER MANAGEMENT\n  // -----------------------------------------\n\n  function showOrderDetails(orderId) {\n\n    const order = getOrder(orderId);\n\n    if (!order) return;\n\n    openModal(\n      `Order #${order.id}`,\n      `\n        <p><strong>Table:<\/strong> ${order.table}<\/p>\n\n        <p><strong>Status:<\/strong> ${escapeHTML(order.status)}<\/p>\n\n        <p><strong>Amount:<\/strong> ${formatCurrency(order.amount)}<\/p>\n\n        <h3 style=\"margin-top:15px;\">Items<\/h3>\n\n        ${order.items.map(item => `\n          <p>${escapeHTML(item)}<\/p>\n        `).join(\"\")}\n      `\n    );\n\n  }\n\n\n  function serveOrder(tableId) {\n\n    const order = state.orders.find(order =>\n      order.table === Number(tableId) &&\n      order.status === \"ready\"\n    );\n\n    if (!order) return;\n\n    order.status = \"served\";\n\n    closeModal();\n    refreshDashboard();\n\n    openModal(\n      \"Order Served\",\n      `<p>Order #${escapeHTML(order.id)} has been marked as served.<\/p>`\n    );\n\n  }\n\n\n  // -----------------------------------------\n  // CUSTOMER CALLS\n  // -----------------------------------------\n\n  function resolveCall(tableId) {\n\n    state.calls = state.calls.filter(call =>\n      call.table !== Number(tableId)\n    );\n\n    refreshDashboard();\n\n    openModal(\n      \"Customer Call Attended\",\n      `<p>You have attended Table ${tableId}.<\/p>`\n    );\n\n  }\n\n\n  // -----------------------------------------\n  // BILL REQUEST\n  // -----------------------------------------\n\n  function requestBill(tableId) {\n\n    const id = Number(tableId);\n\n    const table = getTable(id);\n\n    if (!table || table.status !== \"occupied\") return;\n\n    if (!state.bills.includes(id)) {\n      state.bills.push(id);\n    }\n\n    closeModal();\n    refreshDashboard();\n\n    openModal(\n      \"Bill Requested\",\n      `<p>Bill request for Table ${id} has been recorded.<\/p>`\n    );\n\n  }\n\n\n  // -----------------------------------------\n  // SEAT GUESTS\n  // -----------------------------------------\n\n  function seatGuests(tableId) {\n\n    const table = getTable(tableId);\n\n    if (!table || table.status !== \"available\") return;\n\n    table.status = \"occupied\";\n    table.guests = 2;\n    table.amount = 0;\n    table.since = new Date().toLocaleTimeString(\"en-IN\", {\n      hour: \"2-digit\",\n      minute: \"2-digit\"\n    });\n\n    closeModal();\n    refreshDashboard();\n\n    openModal(\n      \"Table Assigned\",\n      `<p>Guests have been seated at Table ${tableId}.<\/p>`\n    );\n\n  }\n\n\n  // -----------------------------------------\n  // EVENT DELEGATION\n  // -----------------------------------------\n\n  document.addEventListener(\"click\", (event) => {\n\n    const button = event.target.closest(\"[data-action]\");\n\n    if (!button) return;\n\n    const action = button.dataset.action;\n    const tableId = button.dataset.table;\n    const orderId = button.dataset.order;\n\n    switch (action) {\n\n      case \"table-details\":\n        showTableDetails(tableId);\n        break;\n\n      case \"resolve-call\":\n        resolveCall(tableId);\n        break;\n\n      case \"serve-order\":\n        serveOrder(tableId);\n        break;\n\n      case \"open-bill\":\n        showBill(tableId);\n        break;\n\n      case \"order-details\":\n        showOrderDetails(orderId);\n        break;\n\n      case \"request-bill\":\n        requestBill(tableId);\n        break;\n\n      case \"complete-payment\":\n        completePayment(tableId);\n        break;\n\n      case \"seat-guests\":\n        seatGuests(tableId);\n        break;\n\n      default:\n        break;\n\n    }\n\n  });\n\n\n  // -----------------------------------------\n  // BOTTOM NAVIGATION\n  // -----------------------------------------\n\n  document.querySelectorAll(\".nav-item\").forEach(button => {\n\n    button.addEventListener(\"click\", () => {\n\n      document.querySelectorAll(\".nav-item\").forEach(item => {\n        item.classList.remove(\"active\");\n      });\n\n      button.classList.add(\"active\");\n\n      const page = button.dataset.page;\n\n      const sectionMap = {\n        home: \".welcome-section\",\n        tables: \".table-grid\",\n        orders: \".orders-container\",\n        profile: \".shift-card\"\n      };\n\n      const target = document.querySelector(sectionMap[page]);\n\n      if (target) {\n        target.scrollIntoView({\n          behavior: \"smooth\",\n          block: \"start\"\n        });\n      }\n\n      if (page === \"profile\") {\n        openModal(\n          \"Waiter Profile\",\n          `\n            <p><strong>Name:<\/strong> Priya Singh<\/p>\n            <p><strong>Role:<\/strong> Waiter<\/p>\n            <p><strong>Shift:<\/strong> 11 AM \u2013 7 PM<\/p>\n            <p><strong>Assigned Tables:<\/strong> 1\u20134<\/p>\n          `\n        );\n      }\n\n    });\n\n  });\n\n\n  // -----------------------------------------\n  // VIEW ALL BUTTONS\n  // -----------------------------------------\n\n  document.getElementById(\"viewAllTables\")\n    .addEventListener(\"click\", () => {\n\n      elements.tableGrid.scrollIntoView({\n        behavior: \"smooth\",\n        block: \"start\"\n      });\n\n    });\n\n\n  document.getElementById(\"viewOrders\")\n    .addEventListener(\"click\", () => {\n\n      elements.ordersContainer.scrollIntoView({\n        behavior: \"smooth\",\n        block: \"start\"\n      });\n\n    });\n\n\n  // -----------------------------------------\n  // NOTIFICATIONS\n  // -----------------------------------------\n\n  document.getElementById(\"notificationBtn\")\n    .addEventListener(\"click\", () => {\n\n      openModal(\n        \"Notifications\",\n        `\n          <p>You have ${state.calls.length} pending customer calls.<\/p>\n          <p>You have ${state.orders.filter(o => o.status === \"ready\").length} ready orders.<\/p>\n          <p>You have ${state.bills.length} pending bill requests.<\/p>\n        `\n      );\n\n    });\n\n\n  // -----------------------------------------\n  // REFRESH DASHBOARD\n  // -----------------------------------------\n\n  function refreshDashboard() {\n\n    updateStatistics();\n    renderTables();\n    renderOrders();\n    renderAlerts();\n\n  }\n\n\n  // -----------------------------------------\n  // INITIALIZATION\n  // -----------------------------------------\n\n  function init() {\n\n    updateDutyStatus();\n\n    refreshDashboard();\n\n    console.log(\"Ember & Plate Waiter Dashboard initialized.\");\n\n  }\n\n\n  init();\n\n})();\n<\/script>\n\n<\/body>\n<\/html>",
admin: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" />\n  <title>Admin \u00b7 Ember &amp; Plate<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n  <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\" />\n  <style>\n/* ==========================================================\n   Ember & Plate \u00b7 Manager dashboard (single-page mobile app)\n   ========================================================== */\n:root {\n  --primary: #B83225; --primary-hover: #98281F; --primary-subtle: #F5E3DF;\n  --bg: #FFF8EF; --surface: #FFFFFF; --text: #29211E; --text-2: #6F625C; --muted: #B9AEA7;\n  --border: #E6D9CD; --neutral: #EDE5DB;\n  --ok: #237A45; --ok-bg: #E8F3EC; --warn: #8A5300; --warn-bg: #FFF1D6; --warn-line: #E0A53A; --err: #B42318; --err-bg: #FDECEA;\n  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;\n  --ease: cubic-bezier(.2, .8, .2, 1);\n  --safe-b: env(safe-area-inset-bottom, 0px);\n  --nav-h: 64px;\n}\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; scroll-behavior: auto; }\nbody { margin: 0; font-family: \"Inter\", system-ui, -apple-system, \"Segoe UI\", sans-serif; font-size: 14px; line-height: 20px; color: var(--text); background: var(--bg); }\nbutton, input, select { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\nh1, h2, h3, p, ul, ol { margin: 0; padding: 0; }\nul, ol { list-style: none; }\na { color: inherit; text-decoration: none; }\n[hidden] { display: none !important; }\n:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }\n.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-sp  class=\"muted\">Everything is in stock.<\/span>'}<\/div>\n    <\/section>`;\n  };\n\n  // ---------- 2. ORDERS ----------\n  const srcChip = (o) => `<span class=\"src src--${o.src}\" title=\"${o.src}\" aria-hidden=\"true\">${o.src === 'Dine-in' ? 'D' : o.src[0]}<\/span>`;\n  const where = (o) => (o.table ? `Table ${o.table}` : `${o.src} \u00b7 ${esc(o.cust)}`);\n  const ordList = () => {\n    const q = state.ordQ.trim().toLowerCase();\n    return orders.filter((o) => (state.ordTab === 'all' || (state.ordTab === 'dine') === (o.src === 'Dine-in'))\n      && (state.ordFilter === 'active' ? isActive(o) : state.ordFilter === 'completed' ? isDone(o) : o.st === 'cancelled')\n      && (!q || `${o.id} ${o.cust} ${o.src} table ${o.table || ''}`.toLowerCase().includes(q))).sort((a, b) => b.at - a.at);\n  };\n  const ordCards = () => {\n    const l = ordList();\n    return l.length ? l.map((o, i) => `<button class=\"ocard\" type=\"button\" data-act=\"openOrder\" data-id=\"${o.id}\" style=\"--n:${Math.min(i, 8)}\"><div class=\"ocard__h\">${srcChip(o)}<b>${o.id}<\/b><span class=\"ocard__w\">${where(o)}<\/span><span class=\"tmr\" data-since=\"${o.at}\" data-fmt=\"ago\">${ago(o.at)} min ago<\/span><\/div><p class=\"ocard__i\">${o.items.map((i) => `${i.q}x ${esc(i.n)}`).join(', ')}<\/p><div class=\"ocard__f\">${badge(o.st)}<strong class=\"price\">${INR(oTotal(o))}<\/strong><\/div><\/button>`).join('') : '<div class=\"empty\"><b>No orders here<\/b>Try another tab or filter.<\/div>';\n  };\n  VIEWS.orders = () => `\n    <div class=\"seg\" role=\"tablist\" aria-label=\"Order channel\">${[['delivery', 'Delivery'], ['dine', 'Dine-In'], ['all', 'All']].map(([k, l]) => `<button type=\"button\" role=\"tab\" aria-selected=\"${state.ordTab === k}\" data-act=\"ordTab\" data-k=\"${k}\">${l}<\/button>`).join('')}<\/div>\n    <div><div class=\"chips\" role=\"group\" aria-label=\"Order status filter\">${[['active', 'Active'], ['completed', 'Completed'], ['cancelled', 'Cancelled']].map(([k, l]) => `<button class=\"chip\" type=\"button\" aria-pressed=\"${state.ordFilter === k}\" data-act=\"ordFilter\" data-k=\"${k}\">${l}<\/button>`).join('')}<\/div><\/div>\n    <label class=\"search\"><span class=\"sr-only\">Search orders<\/span>${ico('search', 20)}<input type=\"search\" data-in=\"ordQ\" value=\"${esc(state.ordQ)}\" placeholder=\"Search order ID or customer\" autocomplete=\"off\"><\/label>\n    <div class=\"list\" id=\"ordList\" aria-live=\"polite\">${ordCards()}<\/div>`;\n\n  function orderSheet(id) {\n    const o = orders.find((x) => x.id === id); if (!o) return;\n    const act = isActive(o), canEdit = act && o.src === 'Dine-in' && o.st !== 'ready';\n    const body = `\n      <div class=\"od__top\">${srcChip(o)}<div><strong>${o.id}<\/strong><span class=\"muted\">${where(o)} \u00b7 ${ago(o.at)} min ago<\/span><\/div>${badge(o.st)}<\/div>\n      <ul class=\"od__items\">${o.items.map((it, i) => `<li><div class=\"od__row\">${vtag(it.v)}<div><b>${it.q}\u00d7 ${esc(it.n)}<\/b>${it.note ? `<em>Note: ${esc(it.note)}<\/em>` : ''}<\/div><span>${INR(it.q * it.p)}<\/span><\/div>${act ? `<div class=\"od__acts\"><button type=\"button\" data-act=\"oNote\" data-id=\"${o.id}\" data-i=\"${i}\">${it.note ? 'Edit note' : 'Add note'}<\/button>${canEdit && !it.done && o.items.length > 1 ? `<button type=\"button\" class=\"danger\" data-act=\"oRemove\" data-id=\"${o.id}\" data-i=\"${i}\">Remove<\/button>` : ''}<\/div>` : ''}<\/li>`).join('')}<\/ul>\n      ${canEdit ? `<button class=\"btn btn--outline btn--sm\" type=\"button\" data-act=\"oAdd\" data-id=\"${o.id}\">+ Add item to this round<\/button>` : ''}\n      <div class=\"od__tot\"><span>Total<\/span><strong>${INR(oTotal(o))}<\/strong><\/div>\n      ${o.reason ? `<p class=\"hint\" style=\"margin-bottom:8px\">Cancelled: ${esc(o.reason)}<\/p>` : ''}\n      <div class=\"audit\"><b>Audit<\/b><br>Created by: ${esc(o.by)}${o.log.map((l) => `<br>${esc(l)}`).join('')}<\/div>`;\n    let foot = '';\n    if (o.st === 'new') foot = `<div class=\"foot-btns\"><button class=\"btn btn--dark\" type=\"button\" data-act=\"oReject\" data-id=\"${o.id}\">Reject<\/button><button class=\"btn\" type=\"button\" data-act=\"oNext\" data-id=\"${o.id}\">Accept<\/button><\/div>`;\n    else if (act) foot = `<button class=\"btn btn--block\" type=\"button\" data-act=\"oNext\" data-id=\"${o.id}\">${actLabel(o)} \u2192<\/button>`;\n    const sub = `${act ? `<button type=\"button\" class=\"danger\" data-act=\"oCancel\" data-id=\"${o.id}\">Cancel order<\/button>` : ''}${o.st !== 'cancelled' ? `<button type=\"button\" data-act=\"oRefund\" data-id=\"${o.id}\">Trigger refund<\/button>` : ''}`;\n    if (sub) foot += `<div class=\"foot-sub\">${sub}<\/div>`;\n    openSheet(`Order ${o.id}`, body, { foot });\n  }\n\n  // ---------- 3. KITCHEN ----------\n  VIEWS.kitchen = () => {\n    const q = orders.filter((o) => o.st === 'accepted' || o.st === 'preparing').sort((a, b) => (b.pri || 0) - (a.pri || 0) || a.at - b.at);\n    const late = q.filter((o) => toneOf(o)[0] === 'red').length;\n    return `\n    <p class=\"hint\">${q.length} in queue \u00b7 ${late} delayed. Tap a dish to mark it prepared. Long-press or use \u22ef to reprioritise.<\/p>\n    ${q.length ? q.map((o) => { const [c, t] = toneOf(o); const all = o.items.every((i) => i.done); return `\n    <article class=\"kcard tone-${c}\" data-oid=\"${o.id}\" aria-label=\"${o.table ? `Table ${o.table}` : o.id}, ${t}\">\n      <header class=\"kcard__h\"><span class=\"kcard__id\">${o.table ? `T${o.table}` : o.id.slice(4)}<\/span><span class=\"tone\">${t}<\/span><span class=\"kcard__t\" data-since=\"${o.at}\">${ago(o.at)} min<\/span><button class=\"icon-btn kmenu\" type=\"button\" data-act=\"kMenu\" data-id=\"${o.id}\" aria-label=\"More actions for ${o.id}\">${ico('dots', 20, 2.6)}<\/button><\/header>\n      <p class=\"kcard__sub\">${o.id} \u00b7 ${o.src}${o.pri ? ' \u00b7 Priority' : ''}<\/p>\n      <ul class=\"kitems\">${o.items.map((it, i) => `<li><label class=\"chk\"><input type=\"checkbox\" data-act=\"kItem\" data-id=\"${o.id}\" data-i=\"${i}\" ${it.done ? 'checked' : ''}><span class=\"chk__box\"><\/span><span class=\"chk__t\">${it.q}\u00d7 ${esc(it.n)}<\/span><\/label>${it.note ? `<p class=\"kinst\">${esc(it.note)}<\/p>` : ''}<\/li>`).join('')}<\/ul>\n      <button class=\"btn ${all ? '' : 'btn--outline'}\" type=\"button\" data-act=\"kReady\" data-id=\"${o.id}\">${o.src === 'Dine-in' ? 'Ready for serving' : 'Ready for pickup'}<\/button>\n    <\/article>`; }).join('') : '<div class=\"empty\"><b>Queue is clear<\/b>New accepted orders will show up here.<\/div>'}`;\n  };\n  function kdsTick() {\n    $$('[data-since]').forEach((el) => { const m = ago(+el.dataset.since); el.textContent = el.dataset.fmt === 'ago' ? `${m} min ago` : `${m} min`; });\n    $$('.kcard').forEach((k) => { const o = orders.find((x) => x.id === k.dataset.oid); if (!o) return; const [c, t] = toneOf(o); k.className = `kcard tone-${c}`; $('.tone', k).textContent = t; });\n  }\n  setInterval(kdsTick, 20000);\n\n  // ---------- 4. TABLES ----------\n  const tcard = (t, i, floor) => {\n    const m = t.st === 'busy' || t.st === 'bill' ? `${INR(tableTotal(t.n))} \u00b7 ${ago(Date.now() - t.since * 60000)}m` : t.st === 'res' ? t.note : `${t.seats} seats`;\n    const pos = floor ? `style=\"--x:${POS[i][0]}%;--y:${POS[i][1]}%;--n:${i}\"` : `style=\"--n:${i}\"`;\n    return `<button class=\"tcard s-${t.st}\" type=\"button\" data-act=\"openTable\" data-n=\"${t.n}\" ${pos} aria-label=\"Table ${t.n}, ${stLbl[t.st]}, ${t.seats} seats\"><span class=\"tcard__n\">T${t.n}<\/span><span class=\"tcard__s\"><i class=\"tdot\" aria-hidden=\"true\"><\/i>${stLbl[t.st]}<\/span><span class=\"tcard__m\">${esc(m)}<\/span><\/button>`;\n  };\n  VIEWS.tables = () => `\n    <div class=\"seg\" role=\"tablist\" aria-label=\"Table view\">${[['grid', 'Grid'], ['floor', 'Floor plan']].map(([k, l]) => `<button type=\"button\" role=\"tab\" aria-selected=\"${state.tblView === k}\" data-act=\"tblView\" data-k=\"${k}\">${l}<\/button>`).join('')}<\/div>\n    <div class=\"legend\" aria-label=\"Legend\"><span><i><\/i>Available<\/span><span><i class=\"l-busy\"><\/i>Occupied<\/span><span><i class=\"l-bill\"><\/i>Needs bill<\/span><span><i class=\"l-res\"><\/i>Reserved<\/span><\/div>\n    ${state.tblView === 'grid' ? `<div class=\"tgrid\">${tables.map((t, i) => tcard(t, i, false)).join('')}<\/div>` : `<div class=\"floor\" role=\"group\" aria-label=\"Floor plan\">${tables.map((t, i) => tcard(t, i, true)).join('')}<span class=\"floor__lbl\" style=\"left:12px\">Entrance<\/span><span class=\"floor__lbl\" style=\"right:12px\">Kitchen<\/span><\/div>`}`;\n\n  function tableSheet(n) {\n    const t = tables[n - 1], os = tableOrders(n), live = t.st === 'busy' || t.st === 'bill';\n    const body = `\n      <div class=\"tinfo\"><div><span class=\"muted\">Status<\/span><b>${stLbl[t.st]}<\/b><\/div><div><span class=\"muted\">Seats<\/span><b>${t.seats}<\/b><\/div>\n      <div><span class=\"muted\">Waiter<\/span><b>${esc(waiterOf(n))}<\/b><\/div><div><span class=\"muted\">${live ? 'Session' : 'Bill'}<\/span><b>${live ? `${clock(Date.now() - t.since * 60000)} \u00b7 ${t.since ? ago(Date.now() - t.since * 60000) : 0}m` : '\u2014'}<\/b><\/div><\/div>\n      ${live ? `<ul class=\"od__items\">${os.flatMap((o) => o.items.map((it) => `<li><div class=\"od__row\">${vtag(it.v)}<div><b>${it.q}\u00d7 ${esc(it.n)}<\/b><em>${o.id} \u00b7 ${LBL[o.st]}<\/em><\/div><span>${INR(it.q * it.p)}<\/span><\/div><\/li>`)).join('') || '<li class=\"muted\">No items yet.<\/li>'}<\/ul><div class=\"od__tot\"><span>Bill incl. GST${cfg.service ? ' + service' : ''}<\/span><strong>${INR(tableTotal(n))}<\/strong><\/div>` : t.st === 'res' ? `<p class=\"muted\" style=\"margin-bottom:12px\">${esc(t.note || 'Blocked')}<\/p>` : ''}\n      <div class=\"menu-list\">\n        ${t.st === 'bill' ? `<button type=\"button\" data-act=\"tPaid\" data-n=\"${n}\">Mark as paid (cash / card)${ico('chev', 18)}<\/button>` : ''}\n        ${live ? `<button type=\"button\" data-act=\"tMerge\" data-n=\"${n}\">Merge tables${ico('chev', 18)}<\/button><button type=\"button\" data-act=\"tMove\" data-n=\"${n}\">Move session${ico('chev', 18)}<\/button><button type=\"button\" class=\"danger\" data-act=\"tClose\" data-n=\"${n}\">Force-close session${ico('chev', 18)}<\/button>` : ''}\n        ${t.st === 'free' ? `<button type=\"button\" data-act=\"tBlock\" data-n=\"${n}\">Block table${ico('chev', 18)}<\/button>` : ''}\n        ${t.st === 'res' ? `<button type=\"button\" data-act=\"tRelease\" data-n=\"${n}\">Release table${ico('chev', 18)}<\/button>` : ''}\n        <button type=\"button\" data-act=\"tQR\" data-n=\"${n}\">Regenerate / print QR${ico('chev', 18)}<\/button>\n      <\/div>`;\n    openSheet(`Table ${n}`, body);\n  }\n\n  // ---------- 5. RESERVATIONS ----------\n  const seatsUsed = (day, band) => book.filter((b) => b.day === day && b.band === band && (b.st === 'confirmed' || b.st === 'seated')).reduce((s, b) => s + b.guests, 0);\n  VIEWS.reservations = () => {\n    const d = state.resDay;\n    return `\n    <div class=\"days\">${[0, 1, 2].map((i) => `<button class=\"day\" type=\"button\" aria-pressed=\"${d === i}\" data-act=\"resDay\" data-d=\"${i}\"><b>${['Today', 'Tomorrow', 'Day after'][i]}<\/b><span>${dayLabel(i)}<\/span><\/button>`).join('')}<label class=\"dpick\" aria-label=\"Pick another date\">${ico('calendar', 22)}<input type=\"date\" data-in=\"resDate\"><\/label><\/div>\n    ${Object.entries(BANDS).map(([k, b]) => {\n      const used = seatsUsed(d, k), pct = Math.min(100, Math.round((used / b.cap) * 100)), bl = blocked[`${d}-${k}`];\n      const list = book.filter((x) => x.day === d && x.band === k).sort((a, c) => BANDS[k].times.indexOf(a.time) - BANDS[k].times.indexOf(c.time));\n      return `<section class=\"band\" aria-label=\"${b.label}\">\n        <div class=\"band__h\"><div><h2 class=\"h3\">${b.label}<\/h2><span class=\"muted\">${b.range}<\/span><\/div><button class=\"btn btn--dark btn--sm\" type=\"button\" data-act=\"resBlock\" data-k=\"${k}\">${bl ? 'Unblock' : 'Block slot'}<\/button><\/div>\n        <div class=\"cap ${pct >= 100 ? 'is-full' : pct >= 80 ? 'is-high' : ''}\" role=\"img\" aria-label=\"${used} of ${b.cap} seats reserved\"><span style=\"--w:${pct}%\"><\/span><\/div>\n        <p class=\"muted\"><b style=\"color:var(--text)\">${used} / ${b.cap}<\/b> seats reserved${pct >= 100 ? ' \u00b7 Full' : ''}<\/p>\n        ${bl ? '<p class=\"blocked\">Online reservations are blocked for this slot.<\/p>' : ''}\n        ${list.length ? list.map((x, i) => `<article class=\"bk\" style=\"animation-delay:${i * 50}ms\"><div class=\"bk__h\"><b>${esc(x.name)}<\/b><span class=\"badge b-${x.st}\"><i><\/i>${LBL[x.st]}<\/span><\/div><p class=\"bk__m\">${x.time} \u00b7 ${x.guests} guests${x.table ? ` \u00b7 Table ${x.table}` : ' \u00b7 Table not assigned'} \u00b7 ${esc(x.phone)}<\/p>${x.note ? `<p class=\"bk__n\">${esc(x.note)}<\/p>` : ''}${x.st === 'confirmed' ? `<div class=\"bk__a\"><button class=\"btn btn--sm\" type=\"button\" data-act=\"resSeat\" data-id=\"${x.id}\">Seat now<\/button><button class=\"btn btn--dark btn--sm\" type=\"button\" data-act=\"resNoShow\" data-id=\"${x.id}\">No-show<\/button><button class=\"btn btn--ghost danger btn--sm\" type=\"button\" data-act=\"resCancel\" data-id=\"${x.id}\">Cancel<\/button><\/div>` : ''}<\/article>`).join('') : '<p class=\"muted\" style=\"margin-top:12px\">No bookings in this slot yet.<\/p>'}\n      <\/section>`;\n    }).join('')}\n    <button class=\"fab\" type=\"button\" data-act=\"resNew\">${ico('plus', 20, 2.5)} New walk-in / booking<\/button>`;\n  };\n  function bookingForm(walk) {\n    const free = tables.filter((t) => t.st === 'free');\n    openForm({\n      title: walk ? 'New walk-in' : 'New booking', submit: 'Confirm booking',\n      fields: [\n        { k: 'name', label: 'Guest name', req: true, maxlen: 40 },\n        { k: 'phone', label: 'Phone number', type: 'tel', req: true, pattern: /^[6-9]\\d{9}$/, msg: 'Enter a valid 10-digit mobile number.', maxlen: 10 },\n        { k: 'guests', label: 'Guests', type: 'number', req: true, min: 1, max: 12 },\n        { k: 'slot', label: 'Time slot', type: 'select', opts: Object.entries(BANDS).flatMap(([k, b]) => b.times.map((t) => ({ v: `${k}|${t}`, l: `${b.label} \u00b7 ${t}` }))) },\n        { k: 'table', label: 'Assign table (optional)', type: 'select', opts: [{ v: '', l: 'Not assigned' }, ...free.map((t) => ({ v: t.n, l: `Table ${t.n} \u00b7 ${t.seats} seats` }))] },\n        { k: 'note', label: 'Special request', maxlen: 60, ph: 'e.g. Anniversary table' },\n      ],\n      values: { guests: 2 },\n      onSave: (v, form) => {\n        const [band, time] = v.slot.split('|'), left = BANDS[band].cap - seatsUsed(state.resDay, band);\n        if (v.guests > left) { fieldError(form, 'guests', left > 0 ? `Only ${left} seats left in ${BANDS[band].label}.` : `${BANDS[band].label} is full.`); return false; }\n        book.push({ id: 'B-' + (308 + book.length), day: state.resDay, band, time, name: v.name, phone: v.phone, guests: v.guests, note: v.note, table: v.table ? +v.table : null, st: 'confirmed' });\n        toast(`Booking confirmed for ${v.name} \u00b7 ${time}.`); later(refresh, 300);\n      },\n    });\n  }\n\n  // ---------- 6. MENU ----------\n  const menuRows = () => {\n    const q = state.menuQ.trim().toLowerCase(), f = state.menuFilter;\n    const l = menu.filter((m) => (f === 'archived' ? m.arch : !m.arch) && (state.menuCat === 'All' || m.cat === state.menuCat)\n      && (f === 'all' || f === 'archived' || (f === 'in' && m.avail) || (f === 'out' && !m.avail) || (f === 'veg' && m.v) || (f === 'nonveg' && !m.v))\n      && (!q || m.n.toLowerCase().includes(q)));\n    return l.length ? l.map((m, i) => `<div class=\"item ${m.avail && !m.arch ? '' : 'is-off'}\" style=\"--n:${Math.min(i, 8)}\"><button class=\"item__main\" type=\"button\" data-act=\"openItem\" data-id=\"${m.id}\"><span class=\"thumb\">${m.img ? `<img src=\"${m.img}\" alt=\"\" ument.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map((x) => x.join(',')).join('\\n')], { type: 'text/csv' })); a.download = `ember-plate-report-${state.range}.csv`; a.click(); toast('CSV exported.');\n    },\n    pdf: () => { toast('Opening print dialog. Choose \u201cSave as PDF\u201d.'); setTimeout(() => window.print(), 500); },\n    // staff\n    staffTab: (b) => { state.staffTab = b.dataset.k; refresh(); },\n    openStaff: (b) => staffForm(b.dataset.id),\n    newStaff: () => staffForm(null),\n    // settings\n    setRow: (b) => settingsForm(b.dataset.k),\n    svc: (b) => { cfg.service = !cfg.service; b.setAttribute('aria-checked', String(cfg.service)); logCfg(`Service charge ${cfg.service ? 'enabled' : 'disabled'}`); toast(`Service charge ${cfg.service ? 'on' : 'off'}.`); later(refresh); },\n    openLog: () => { location.hash = '#settings/log'; },\n  };\n\n  document.addEventListener('click', (e) => {\n    const m = e.target.closest('[data-act=\"mq\"]');\n    if (m) { const id = m.dataset.id, q = Math.max(0, (manualOrder.qty[id] || 0) + +m.dataset.d); manualOrder.qty[id] = q; $(`#q_${id}`).textContent = q; const t = manualOrder.total(), go = $('#moGo'); go.textContent = `Create order \u00b7 ${INR(t)}`; go.setAttribute('aria-disabled', String(t === 0)); return; }\n    const b = e.target.closest('[data-act]'); if (!b || b.dataset.act === 'kItem') return;\n    const fn = act[b.dataset.act]; if (fn) fn(b, e);\n  });\n  document.addEventListener('change', (e) => { const b = e.target.closest('[data-act=\"kItem\"]'); if (b) act.kItem(b); });\n\n  // live search inputs update only their list (keeps focus)\n  document.addEventListener('input', (e) => {\n    const k = e.target.dataset && e.target.dataset.in; if (!k) return;\n    if (k === 'ordQ') { state.ordQ = e.target.value; $('#ordList').innerHTML = ordCards(); }\n    if (k === 'menuQ') { state.menuQ = e.target.value; $('#menuList').innerHTML = menuRows(); }\n  });\n  document.addEventListener('change', (e) => {\n    if (e.target.dataset && e.target.dataset.in === 'resDate' && e.target.value) {\n      const d = Math.round((new Date(e.target.value + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);\n      if (d >= 0 && d <= 2) { state.resDay = d; refresh(); } else toast('Bookings open only 3 days ahead. No data for that date in this demo.');\n    }\n  });\n\n  // long-press on a kitchen card = reprioritise (\u22ef button is the accessible alternative)\n  let lp = null;\n  view.addEventListener('pointerdown', (e) => { const k = e.target.closest('.kcard'); if (!k || e.target.closest('button, label, input')) return; lp = setTimeout(() => { act.kMenu({ dataset: { id: k.dataset.oid } }); if (navigator.vibrate) navigator.vibrate(20); }, 600); });\n  ['pointerup', 'pointermove', 'pointercancel', 'pointerleave'].forEach((ev) => view.addEventListener(ev, () => clearTimeout(lp)));\n\n  // ---------- Nav / header ----------\n  $('#moreBtn').addEventListener('click', () => {\n    openSheet('More', `<div class=\"tiles\">${Object.entries(MORE).map(([k, [ic, l]], i) => `<button class=\"tile\" type=\"button\" data-more=\"${k}\" style=\"--n:${i}\">${ico(ic, 24)}${l}<\/button>`).join('')}<\/div>`);\n  });\n  $('#sheetBody').addEventListener('click', (e) => { const t = e.target.closest('[data-more]'); if (t) { closeSheet(); location.hash = '#' + t.dataset.more; } });\n  $('#backBtn').addEventListener('click', () => { location.hash = '#settings'; });\n  $('#avatarBtn').addEventListener('click', async () => {\n    const ok = await dialog({ title: 'Sign out?', text: 'Ritesh Kumar \u00b7 Restaurant manager', okLabel: 'Sign out' });\n    if (ok) { try { localStorage.removeItem(AUTH_KEY); } catch { /* ignore */ } EP.go('login.html?role=admin&switch'); }\n  });\n\n  // A new waiter call arrives while you're on the dashboard (real app: websocket push)\n  setTimeout(() => { calls.unshift({ id: 'c' + Date.now(), table: 7, at: Date.now() }); toast('Table 7 is calling a waiter.'); if (cur === 'home' && !sheetOpen && !dlgOpen) refresh(); }, 25000);\n\n  // ---------- Init ----------\n  try { const a = JSON.parse(localStorage.getItem(AUTH_KEY)); if (a && a.role && a.role !== 'admin') EP.go('login.html?role=admin&switch'); } catch { /* ignore */ }\n  render();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"
};

  var TITLES = {
    login: 'Sign in · Ember & Plate',
    admin: 'Admin · Ember & Plate',
    waiter: 'Waiter · Ember & Plate',
    user: 'Ember & Plate'
  };
  var PAGES = { 'login.html': 'login', 'admin.html': 'admin', 'waitersample.html': 'waiter', 'userhome.html': 'user' };

  var stage = document.getElementById('stage');
  var frame = null;

  /* Injected at the top of every app: navigation bridge. */
  function shim(search, hash) {
    return '<base href="about:srcdoc">' + '<script>(function(){' +
      'window.EP={search:' + JSON.stringify(search) + ',go:function(u){try{parent.postMessage({ep:1,to:String(u)},"*")}catch(e){}}};' +
      (hash ? 'try{history.replaceState(null,"",' + JSON.stringify(hash) + ')}catch(e){}' : '') +
      'document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(!a)return;' +
      'var h=a.getAttribute("href")||"";' +
      'if(/^(login|admin|waitersample|userhome|scan)\\.html(\\?.*)?$/.test(h)){e.preventDefault();EP.go(h)}},true);' +
      '})();<\/script>';
  }

  function toRoute(u) {
    var m = /^([a-z]+\.html)(?:\?(.*))?$/.exec(u);
    if (!m) return null;
    if (m[1] === 'scan.html') return 'user/scan';
    var n = PAGES[m[1]];
    if (!n) return null;
    return n + (n === 'login' && m[2] ? '?' + m[2] : '');
  }

  function parse() {
    var raw = location.hash.replace(/^#\/?/, '');
    var qi = raw.indexOf('?');
    var search = qi > -1 ? raw.slice(qi) : '';
    var path = qi > -1 ? raw.slice(0, qi) : raw;
    var seg = path.split('/');
    var name = seg[0];
    if (!Object.prototype.hasOwnProperty.call(APPS, name)) return { name: 'login', search: '', hash: '', bad: true };
    return {
      name: name,
      search: name === 'login' ? search : '',
      hash: name === 'user' && seg.length > 1 && seg[1] ? '#' + seg.slice(1).join('/') : ''
    };
  }

  function render() {
    var r = parse();
    if (r.bad) { try { history.replaceState(null, '', '#login'); } catch (e) { /* ignore */ } }

    var f = document.createElement('iframe');
    f.title = TITLES[r.name];
    f.setAttribute('allow', 'geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen');
    f.addEventListener('load', function () {
      try {
        if (r.hash && f.contentWindow.location.hash !== r.hash) f.contentWindow.location.hash = r.hash;
        f.contentWindow.focus();
      } catch (e) { /* ignore */ }
    });
    var s = shim(r.search, r.hash);
    f.srcdoc = APPS[r.name].replace('<head>', function () { return '<head>' + s; });

    stage.textContent = '';
    stage.appendChild(f);
    frame = f;
    document.title = TITLES[r.name];
  }

  function go(route) {
    var h = '#' + route;
    if (location.hash === h) render();
    else location.hash = h;
  }

  window.addEventListener('message', function (e) {
    if (!frame || e.source !== frame.contentWindow) return;
    var d = e.data;
    if (!d || d.ep !== 1) return;
    var r = toRoute(d.to);
    if (r) go(r);
  });

  window.addEventListener('hashchange', render);

  if (!location.hash) { try { history.replaceState(null, '', '#login'); } catch (e) { /* ignore */ } }
  render();
})();
</script>
