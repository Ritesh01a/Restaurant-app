n\n/* ---------- Paid overlay ---------- */\n.done { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: var(--s6) var(--s5); background: var(--bg); animation: fade .3s ease both; }\n@keyframes fade { from { opacity: 0; } to { opacity: 1; } }\n.done__card { width: min(100%, 420px); text-align: center; display: flex; flex-direction: column; align-items: center; }\n.done__check { animation: pop .5s var(--ease) both; }\n.done__ring { stroke-dasharray: 190; stroke-dashoffset: 190; animation: draw .7s .1s var(--ease) forwards; }\n.done__tick { stroke-dasharray: 50; stroke-dashoffset: 50; animation: draw .45s .6s var(--ease) forwards; }\n@keyframes draw { to { stroke-dashoffset: 0; } }\n.done__title { margin-top: var(--s4); animation: fadeUp .5s .5s var(--ease) both; }\n.done__title:focus { outline: 0; }\n.done__amt { margin-top: var(--s2); font-size: 32px; line-height: 40px; font-weight: 700; font-variant-numeric: tabular-nums; animation: fadeUp .5s .6s var(--ease) both; }\n.done__meta { margin-top: var(--s1); font-size: 12px; font-weight: 500; color: var(--text-2); animation: fadeUp .5s .7s var(--ease) both; }\n.done__text { margin-top: var(--s4); max-width: 30ch; color: var(--text-2); animation: fadeUp .5s .8s var(--ease) both; }\n.done .obtn { animation: fadeUp .5s .9s var(--ease) both; }\n\n/* ---------- Guard ---------- */\n.guard { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: var(--s6) var(--s5); }\n.guard__card { width: 100%; padding: var(--s8) var(--s6); text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; animation: fadeUp .5s var(--ease) both; display: flex; flex-direction: column; align-items: center; }\n.guard__icon { display: inline-grid; place-items: center; width: 48px; height: 48px; margin-bottom: var(--s3); border-radius: 50%; background: var(--primary-subtle); color: var(--primary); }\n.guard__title { font-size: 22px; line-height: 30px; font-weight: 600; }\n.guard__text { margin: var(--s2) auto 0; max-width: 30ch; color: var(--text-2); }\n\n/* ---------- Toast ---------- */\n.toast { position: fixed; z-index: 90; left: 50%; bottom: calc(var(--drawer-h) + var(--s3)); transform: translateX(-50%); max-width: calc(min(100%, 480px) - 32px); padding: var(--s3) var(--s4); border-radius: 12px; background: var(--text); color: var(--bg); font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); border: 1px solid rgba(255, 248, 239, .15); animation: toastIn .3s var(--ease); }\n.toast.is-out { animation: toastOut .2s ease forwards; }\n@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }\n@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 8px); } }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; animation-delay: 0ms !important; transition-delay: 0ms !important; }\n  .obtn__spinner, .cta__spinner { animation: spin 1.6s linear infinite !important; animation-duration: 1.6s !important; animation-iteration-count: infinite !important; }\n  .live__dot::after, .st__dot::after, .step__node i::after { display: none; }\n  .done__ring, .done__tick { stroke-dashoffset: 0; }\n}\n\n:host { display: block; }\n\n<\/style>\n<div class=\"app\" id=\"app\">\n\n    <\!-- Header -->\n    <header class=\"top\" id=\"top\">\n      <a class=\"back\" href=\"#dmenu\" aria-label=\"Back to menu\">\n        <svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.200\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 12H5M12 19l-7-7 7-7\"/><\/svg>\n      <\/a>\n      <h1 class=\"h1\" id=\"pageTitle\">Table 12 Overview<\/h1>\n    <\/header>\n\n    <p class=\"sr-only\" id=\"liveRegion\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"><\/p>\n\n    <main class=\"content\" id=\"shell\">\n\n      <\!-- 1. Live kitchen tracker -->\n      <section class=\"card tracker\" id=\"tracker\" aria-labelledby=\"trackHead\">\n        <div class=\"tracker__top\">\n          <span class=\"live\"><i class=\"live__dot\" aria-hidden=\"true\"><\/i>Live<\/span>\n          <span class=\"tracker__upd\" id=\"updText\">Updated just now<\/span>\n        <\/div>\n        <h2 class=\"h2 tracker__head\" id=\"trackHead\">Chef is preparing your order<\/h2>\n        <ol class=\"steps\" id=\"steps\" aria-label=\"Order progress\"><\/ol>\n      <\/section>\n\n      <\!-- 2. Items summary -->\n      <section class=\"card items\" id=\"itemsCard\" aria-labelledby=\"itemsTitle\">\n        <div class=\"items__head\">\n          <h3 class=\"h3\" id=\"itemsTitle\">Your items<\/h3>\n          <span class=\"items__count\" id=\"itemsCount\">0 of 0 served<\/span>\n        <\/div>\n        <ul class=\"its\" id=\"itemsList\"><\/ul>\n      <\/section>\n\n      <\!-- Unsent items nudge -->\n      <a class=\"nudge\" id=\"nudge\" href=\"#dcart\" hidden>\n        <span id=\"nudgeText\">You have 2 new items not sent yet.<\/span>\n        <strong>Review \u2192<\/strong>\n      <\/a>\n\n      <\!-- 3. Quick actions -->\n      <section class=\"actions\" id=\"actions\" aria-label=\"Quick actions\">\n        <a class=\"obtn obtn--red\" href=\"#dmenu\">+ Order More Items<\/a>\n        <button class=\"obtn obtn--dark\" id=\"callBtn\" type=\"button\" data-state=\"idle\">\n          <span class=\"obtn__spinner\" aria-hidden=\"true\"><\/span>\n          <span aria-hidden=\"true\" class=\"obtn__icon\">\ud83d\udece<\/span>\n          <span id=\"callText\">Call Server<\/span>\n        <\/button>\n      <\/section>\n\n      <\!-- Empty state -->\n      <section class=\"card empty\" id=\"emptyCard\" hidden>\n        <span class=\"empty__icon\" aria-hidden=\"true\">\ud83c\udf7d\ufe0f<\/span>\n        <h2 class=\"h2\">No orders sent yet<\/h2>\n        <p class=\"empty__text\">Send items to the kitchen and you\u2019ll see live progress here.<\/p>\n        <a class=\"obtn obtn--red obtn--inline\" id=\"emptyLink\" href=\"#dmenu\">Browse the menu<\/a>\n      <\/section>\n    <\/main>\n\n    <\!-- No session guard -->\n    <main class=\"guard\" id=\"guard\" hidden>\n      <div class=\"guard__card\">\n        <span class=\"guard__icon\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><path d=\"M14 14h3v3h-3zM20 14v1M14 20h1M20 18v3h-3\"/><\/svg>\n        <\/span>\n        <h2 class=\"guard__title\">Verify your table first<\/h2>\n        <p class=\"guard__text\">Scan the QR code on your table to see your order progress.<\/p>\n        <a class=\"obtn obtn--red obtn--inline\" href=\"#scan\">Scan table QR<\/a>\n      <\/div>\n    <\/main>\n\n    <\!-- 4. Bill drawer -->\n    <aside class=\"drawer\" id=\"drawer\" aria-label=\"Bill summary\">\n      <button class=\"drawer__handle\" id=\"drawerToggle\" type=\"button\" aria-expanded=\"true\" aria-controls=\"billBody\">\n        <span class=\"drawer__grip\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Show or hide bill details<\/span>\n      <\/button>\n\n      <div class=\"bill is-open\" id=\"billBody\">\n        <div class=\"bill__inner\">\n          <dl class=\"rows\">\n            <div class=\"rowb\"><dt>Food subtotal<\/dt><dd id=\"subAmt\" data-val=\"0\">\u20b90<\/dd><\/div>\n            <div class=\"rowb\"><dt>Taxes &amp; GST (5%)<\/dt><dd id=\"gstAmt\" data-val=\"0\">\u20b90<\/dd><\/div>\n            <div class=\"rowb\">\n              <dt id=\"svcLbl\">Service charge (optional)<\/dt>\n              <dd class=\"rowb__r\">\n                <button class=\"sw\" id=\"svcSw\" type=\"button\" role=\"switch\" aria-checked=\"true\" aria-labelledby=\"svcLbl\"><span class=\"sw__knob\"><\/span><\/button>\n                <span id=\"svcAmt\" data-val=\"20\">\u20b920<\/span>\n              <\/dd>\n            <\/div>\n          <\/dl>\n        <\/div>\n      <\/div>\n\n      <div class=\"total\">\n        <h2 class=\"h2\">Grand total<\/h2>\n        <strong class=\"price\" id=\"grandAmt\" data-val=\"0\">\u20b90<\/strong>\n      <\/div>\n\n      <button class=\"cta cta--primary\" id=\"payBtn\" type=\"button\">\n        <span class=\"cta__spinner\" aria-hidden=\"true\"><\/span>\n        <span id=\"payLabel\">Pay Online Now<\/span>\n      <\/button>\n      <button class=\"cta cta--outline\" id=\"reqBtn\" type=\"button\" data-state=\"idle\">\n        <span class=\"cta__spinner\" aria-hidden=\"true\"><\/span>\n        <span id=\"reqLabel\">Request Cash / Card Machine at Table<\/span>\n      <\/button>\n      <button class=\"link\" id=\"cancelReq\" type=\"button\" hidden>Cancel request<\/button>\n    <\/aside>\n\n    <\!-- Paid overlay -->\n    <section class=\"done\" id=\"done\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"doneTitle\" hidden>\n      <div class=\"done__card\">\n        <svg class=\"done__check\" viewBox=\"0 0 64 64\" width=\"88\" height=\"88\" aria-hidden=\"true\">\n          <circle class=\"done__ring\" cx=\"32\" cy=\"32\" r=\"29\" fill=\"none\" stroke=\"#237A45\" stroke-width=\"4\"/>\n          <path class=\"done__tick\" d=\"M19 33l9 9 17-19\" fill=\"none\" stroke=\"#237A45\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n        <\/svg>\n        <h2 class=\"h1 done__title\" id=\"doneTitle\" tabindex=\"-1\">Payment successful<\/h2>\n        <p class=\"done__amt\" id=\"doneAmt\">\u20b90<\/p>\n        <p class=\"done__meta\" id=\"doneMeta\">Receipt EP-0000 \u00b7 Table 12<\/p>\n        <p class=\"done__text\">Thank you for dining with us. Your table session is now closed.<\/p>\n        <a class=\"obtn obtn--red obtn--inline\" id=\"doneLink\" href=\"#dmenu\">Start a new order<\/a>\n      <\/div>\n    <\/section>\n\n    <div class=\"toast\" id=\"toast\" role=\"status\" hidden><\/div>\n  <\/div>\n<\/template>\n\n<\!-- ===== SCREEN: book ===== -->\n<template id=\"tpl-book\">\n<style>\n/* ---------- Tokens ---------- */\n:host {\n  --primary: #B83225;\n  --primary-hover: #98281F;\n  --primary-subtle: #F5E3DF;\n  --bg: #FFF8EF;\n  --surface: #FFFFFF;\n  --text: #29211E;\n  --text-2: #6F625C;\n  --border: #E6D9CD;\n  --disabled: #B9AEA7;\n\n  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px;\n  --r-card: 16px; --r-btn: 12px;\n  --ease: cubic-bezier(.2, .9, .3, 1.15);\n}\n\n* { box-sizing: border-box; margin: 0; }\nbutton, input { font: inherit; color: inherit; }\nbutton { cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }\n:focus-visible { outline: 3px solid rgba(184, 50, 37, .45); outline-offset: 2px; }\n\n:host {\n  font-family: 'Inter', system-ui, sans-serif;\n  color: var(--text);\n  background: var(--text);\n}\n\n/* ---------- Stage + phone frame ---------- */\n.stage {\n  min-height: 100dvh;\n  display: grid;\n  place-items: center;\n  background: radial-gradient(circle at 30% 20%, #3b2f2a, var(--text) 70%);\n}\n\n.phone {\n  position: relative;\n  width: min(390px, 100vw);\n  height: min(844px, 100dvh);\n  background: var(--bg);\n  border-radius: 36px;\n  box-shadow: 0 30px 80px rgba(0, 0, 0, .45);\n  padding: max(16px, env(safe-area-inset-top)) 20px max(16px, env(safe-area-inset-bottom));\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n  overflow: hidden;\n}\n\n@media (max-width: 500px) {\n  .phone { border-radius: 0; box-shadow: none; width: 100vw; height: 100dvh; }\n}\n\n.glow {\n  position: absolute;\n  top: -90px; right: -70px;\n  width: 240px; height: 240px;\n  background: radial-gradient(circle, rgba(184, 50, 37, .18), transparent 65%);\n  border-radius: 50%;\n  animation: drift 7s ease-in-out infinite alternate;\n  pointer-events: none;\n}\n\n/* ---------- Header ---------- */\n.top { display: flex; align-items: center; gap: var(--s3); position: relative; }\n\n.icon-btn {\n  width: 44px; height: 44px; flex: none;\n  display: grid; place-items: center;\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--r-btn);\n  transition: transform .15s, background .2s;\n}\n.icon-btn:active { transform: scale(.92); }\n\n.eyebrow { font-size: 12px; font-weight: 600; color: var(--primary); letter-spacing: .02em; }\nh1 { font-size: 24px; line-height: 1.15; font-weight: 700; }\n.sub { font-size: 14px; color: var(--text-2); margin-top: 2px; }\n\n/* ---------- Blocks ---------- */\n.block { position: relative; display: flex; flex-direction: column; gap: 10px; }\n.block.row { flex-direction: row; align-items: center; justify-content: space-between; }\n\nh2 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: var(--s2); }\n.step {\n  width: 20px; height: 20px; border-radius: 50%;\n  background: var(--primary); color: var(--bg);\n  font-size: 12px; font-weight: 600;\n  display: grid; place-items: center;\n}\n.opt { font-size: 12px; font-weight: 500; color: var(--text-2); }\n.hint { font-size: 12px; font-weight: 500; color: var(--text-2); margin: 2px 0 0 28px; }\n\n/* ---------- Dates ---------- */\n.dates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\n\n.date {\n  height: 76px;\n  background: var(--surface);\n  border: 1.5px solid var(--border);\n  border-radius: var(--r-card);\n  display: flex; flex-direction: column; align-items: center; justify-content: center;\n  gap: 1px;\n  transition: transform .25s var(--ease), background .25s, border-color .25s, box-shadow .25s, color .25s;\n}\n.date .d-rel { font-size: 12px; font-weight: 500; color: var(--text-2); }\n.date .d-num { font-size: 18px; font-weight: 700; }\n.date .d-day { font-size: 12px; font-weight: 500; color: var(--text-2); }\n.date:active { transform: scale(.96); }\n\n.date[aria-checked=\"true\"] {\n  background: var(--primary);\n  border-color: var(--primary);\n  color: var(--bg);\n  transform: translateY(-3px);\n  box-shadow: 0 10px 20px rgba(184, 50, 37, .28);\n}\n.date[aria-checked=\"true\"] span { color: var(--bg); }\n\n/* ---------- Stepper ---------- */\n.stepper {\n  display: flex; align-items: center; gap: 4px;\n  background: var(--surface);\n  border: 1.5px solid var(--border);\n  border-radius: var(--r-btn);\n  padding: 4px;\n}\n.step-btn {\n  width: 44px; height: 44px;\n  display: grid; place-items: center;\n  border-radius: 10px;\n  color: var(--primary);\n  background: var(--primary-subtle);\n  transition: transform .15s, background .2s, opacity .2s;\n}\n.step-btn:active { transform: scale(.88); }\n.step-btn:disabled { opacity: .4; cursor: not-allowed; background: transparent; color: var(--disabled); }\n.count { min-width: 36px; text-align: center; font-size: 18px; font-weight: 700; }\n.count.bump { animation: bump .3s var(--ease); }\n\n/* ---------- Slots ---------- */\n#slots { display: flex; flex-direction: column; gap: 8px; }\n.group-label { font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }\n.slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }\n\n.slot {\n  height: 44px;\n  font-size: 14px; font-weight: 500;\n  background: var(--surface);\n  border: 1.5px solid var(--border);\n  border-radius: var(--r-btn);\n  transition: transform .2s var(--ease), background .2s, border-color .2s, color .2s;\n  animation: rise .4s var(--ease) backwards;\n  animation-delay: calc(var(--i, 0) * 35ms);\n}\n.slot:active:not(:disabled) { transform: scale(.94); }\n.slot.is-selected {\n  background: var(--primary); border-color: var(--primary); color: var(--bg);\n  animation: pop .35s var(--ease);\n}\n.slot:disabled {\n  color: var(--disabled);\n  background: transparent;\n  border-style: dashed;\n  text-decoration: line-through;\n  cursor: not-allowed;\n}\n\n/* ---------- Preferences ---------- */\n.chips { display: flex; flex-wrap: wrap; gap: 8px; }\n.chip {\n  height: 34px; padding: 0 14px;\n  font-size: 12px; font-weight: 500;\n  background: var(--surface);\n  border: 1.5px solid var(--border);\n  border-radius: 999px;\n  transition: transform .2s var(--ease), background .2s, border-color .2s, color .2s;\n}\n.chip:active { transform: scale(.94); }\n.chip[aria-pressed=\"true\"] {\n  background: var(--primary-subtle);\n  border-color: var(--primary);\n  color: var(--primary);\n  font-weight: 600;\n  animation: pop .3s var(--ease);\n}\n.note {\n  height: 48px; padding: 0 14px; width: 100%;\n  font-size: 14px;\n  background: var(--surface);\n  border: 1.5px solid var(--border);\n  border-radius: var(--r-btn);\n  transition: border-color .2s, box-shadow .2s;\n}\n.note::placeholder { color: var(--disabled); }\n.note:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-subtle); }\n\n/* ---------- Footer / CTA ---------- */\n.foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }\n.summary { font-size: 14px; font-weight: 500; text-align: center; color: var(--text-2); min-height: 20px; }\n.summary.ready { color: var(--text); font-weight: 600; }\n.summary.warn { color: var(--primary); animation: shake .4s; }\n\n.cta {\n  position: relative; overflow: hidden;\n  width: 100%; height: 54px;\n  background: var(--primary); color: var(--bg);\n  font-size: 15px; font-weight: 600;\n  border-radius: var(--r-btn);\n  display: flex; align-items: center; justify-content: center; gap: 10px;\n  transition: transform .15s, background .2s, box-shadow .3s, opacity .2s;\n}\n.cta:hover:not(:disabled) { background: var(--primary-hover); }\n.cta:active:not(:disabled) { transform: scale(.97); }\n.cta:disabled { background: var(--disabled); cursor: not-allowed; }\n.cta:not(:disabled):not(.loading) { box-shadow: 0 10px 22px rgba(184, 50, 37, .3); }\n.cta:not(:disabled)::after {\n  content: \"\"; position: absolute; top: 0; left: -60%;\n  width: 40%; height: 100%;\n  background: linear-gradient(100deg, transparent, rgba(255, 248, 239, .28), transparent);\n  transform: skewX(-20deg);\n  animation: shine 3.2s ease-in-out infinite;\n}\n.spinner {\n  display: none; width: 18px; height: 18px;\n  border: 2.5px solid rgba(255, 248, 239, .4); border-top-color: var(--bg);\n  border-radius: 50%; animation: spin .7s linear infinite;\n}\n.cta.loading .spinner { display: block; }\n.cta.loading { pointer-events: none; }\n\n/* ---------- Confirmation sheet ---------- */\n.overlay {\n  position: absolute; inset: 0; z-index: 10;\n  background: rgba(41, 33, 30, 0);\n  display: flex; align-items: flex-end;\n  transition: background .35s;\n}\n.overlay[hidden] { display: none; }\n.overlay.open { background: rgba(41, 33, 30, .55); }\n\n.sheet {\n  position: relative; overflow: hidden;\n  width: 100%;\n  background: var(--bg);\n  border-radius: 28px 28px 0 0;\n  padding: 28px 20px max(20px, env(safe-area-inset-bottom));\n  display: flex; flex-direction: column; align-items: center; gap: 8px;\n  text-align: center;\n  transform: translateY(100%);\n  transition: transform .5s var(--ease);\n}\n.overlay.open .sheet { transform: translateY(0); }\n\n.tick-circle { stroke: var(--primary); stroke-dasharray: 145; stroke-dashoffset: 145; }\n.tick-path { stroke: var(--primary); stroke-dasharray: 40; stroke-dashoffset: 40; }\n.overlay.open .tick-circle { animation: draw .6s .25s ease forwards; }\n.overlay.open .tick-path { animation: draw .4s .65s ease forwards; }\n.overlay.open .tick { animation: pop .5s .25s var(--ease) backwards; }\n\n#sheetTitle { font-size: 22px; font-weight: 600; }\n.sheet-sub { font-size: 14px; color: var(--text-2); }\n\n.ticket {\n  width: 100%; margin-top: 8px;\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--r-card);\n  text-align: left;\n  overflow: hidden;\n}\n.ticket-top { padding: 14px 16px; border-bottom: 2px dashed var(--border); }\n.cap { font-size: 12px; font-weight: 500; color: var(--text-2); }\n.ref-row { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }\n.ref-row strong { font-size: 24px; font-weight: 700; color: var(--primary); letter-spacing: .04em; }\n.copy {\n  height: 32px; padding: 0 12px;\n  font-size: 12px; font-weight: 600; color: var(--primary);\n  background: var(--primary-subtle); border-radius: 8px;\n  transition: transform .15s;\n}\n.copy:active { transform: scale(.92); }\n\n.ticket-rows { padding: 12px 16px; display: grid; gap: 8px; }\n.ticket-rows div { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; }\n.ticket-rows span { color: var(--text-2); }\n.ticket-rows b { font-weight: 600; text-align: right; }\n\n.policy { font-size: 12px; font-weight: 500; color: var(--text-2); margin: 4px 0 6px; }\n\n.sparks { position: absolute; inset: 0; pointer-events: none; }\n.sparks i {\n  position: absolute; bottom: 40%;\n  width: 6px; height: 6px; border-radius: 50%;\n  background: var(--primary); opacity: 0;\n  animation: float var(--t, 2s) var(--dl, 0s) ease-out forwards;\n}\n\n/* ---------- Entrance + keyframes ---------- */\n.rise { animation: rise .6s var(--ease) backwards; animation-delay: var(--d, 0ms); }\n\n@keyframes rise  { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }\n@keyframes pop   { 0% { transform: scale(.9); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }\n@keyframes bump  { 0% { transform: scale(1); } 40% { transform: scale(1.35); color: var(--primary); } 100% { transform: scale(1); } }\n@keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }\n@keyframes spin  { to { transform: rotate(360deg); } }\n@keyframes draw  { to { stroke-dashoffset: 0; } }\n@keyframes drift { to { transform: translate(-24px, 28px) scale(1.1); } }\n@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }\n@keyframes float {\n  0%   { opacity: 0; transform: translate(0, 0) scale(.6); }\n  15%  { opacity: 1; }\n  100% { opacity: 0; transform: translate(var(--x, 0), -240px) scale(1.2); }\n}\n\n/* ---------- Small phones: tighten, never scroll ---------- */\n@media (max-height: 740px) {\n  .phone { gap: 10px; padding-top: 12px; padding-bottom: 12px; }\n  h1 { font-size: 22px; }\n  .sub { display: none; }\n  .date { height: 66px; }\n  .cta { height: 50px; }\n  .hint { display: none; }\n}\n\n/* ---------- Reduced motion ---------- */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: .01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: .01ms !important;\n  }\n}\n:host { display: block; }\n\n<\/style>\n<div class=\"stage\">\n    <main class=\"phone\">\n      <div class=\"glow\" aria-hidden=\"true\"><\/div>\n\n      <\!-- Header -->\n      <header class=\"top rise\" style=\"--d:0ms\">\n        <button class=\"icon-btn\" type=\"button\" aria-label=\"Go back\">\n          <svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/><\/svg>\n        <\/button>\n        <div class=\"titles\">\n          <p class=\"eyebrow\">Ember &amp; Plate<\/p>\n          <h1>Reserve your table<\/h1>\n          <p class=\"sub\">Choose your preferred dining time.<\/p>\n        <\/div>\n      <\/header>\n\n      <\!-- 1. Date -->\n      <section class=\"block rise\" style=\"--d:80ms\" aria-labelledby=\"h-date\">\n        <h2 id=\"h-date\"><span class=\"step\">1<\/span>Select your date<\/h2>\n        <div class=\"dates\" id=\"dates\" role=\"radiogroup\" aria-label=\"Booking date\"><\/div>\n      <\/section>\n\n      <\!-- 2. Guests -->\n      <section class=\"block row rise\" style=\"--d:160ms\" aria-labelledby=\"h-guests\">\n        <div>\n          <h2 id=\"h-guests\"><span class=\"step\">2<\/span>Number of guests<\/h2>\n          <p class=\"hint\">Adults and children<\/p>\n        <\/div>\n        <div class=\"stepper\" role=\"group\" aria-label=\"Guest count\">\n          <button type=\"button\" class=\"step-btn\" id=\"minus\" aria-label=\"Decrease guests\">\n            <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M5 12h14\"/><\/svg>\n          <\/button>\n          <span class=\"count\" id=\"count\" aria-live=\"polite\">2<\/span>\n          <button type=\"button\" class=\"step-btn\" id=\"plus\" aria-label=\"Increase guests\">\n            <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n          <\/button>\n        <\/div>\n      <\/section>\n\n      <\!-- 3. Time -->\n      <section class=\"block rise\" style=\"--d:240ms\" aria-labelledby=\"h-time\">\n        <h2 id=\"h-time\"><span class=\"step\">3<\/span>Select a time<\/h2>\n        <div id=\"slots\"><\/div>\n      <\/section>\n\n      <\!-- 4. Preferences -->\n      <section class=\"block rise\" style=\"--d:320ms\" aria-labelledby=\"h-pref\">\n        <h2 id=\"h-pref\"><span class=\"step\">4<\/span>Preferences <span class=\"opt\">Optional<\/span><\/h2>\n        <div class=\"chips\" id=\"chips\">\n          <button type=\"button\" class=\"chip\" aria-pressed=\"false\">Window seat<\/button>\n          <button type=\"button\" class=\"chip\" aria-pressed=\"false\">Quiet corner<\/button>\n          <button type=\"button\" class=\"chip\" aria-pressed=\"false\">Birthday<\/button>\n          <button type=\"button\" class=\"chip\" aria-pressed=\"false\">High chair<\/button>\n        <\/div>\n        <input class=\"note\" id=\"note\" type=\"text\" maxlength=\"120\" placeholder=\"Any special request?\" autocomplete=\"off\" aria-label=\"Special request\">\n      <\/section>\n\n      <\!-- Footer / CTA -->\n      <footer class=\"foot rise\" style=\"--d:400ms\">\n        <p class=\"summary\" id=\"summary\">Pick a time to continue<\/p>\n        <button type=\"button\" class=\"cta\" id=\"confirmBtn\" disabled>\n          <span class=\"cta-label\">Confirm booking<\/span>\n          <span class=\"spinner\" aria-hidden=\"true\"><\/span>\n        <\/button>\n      <\/footer>\n\n      <\!-- Confirmation sheet -->\n      <div class=\"overlay\" id=\"overlay\" hidden>\n        <section class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheetTitle\">\n          <div class=\"sparks\" id=\"sparks\" aria-hidden=\"true\"><\/div>\n\n          <div class=\"tick\" aria-hidden=\"true\">\n            <svg viewBox=\"0 0 52 52\" width=\"64\" height=\"64\">\n              <circle class=\"tick-circle\" cx=\"26\" cy=\"26\" r=\"23\" fill=\"none\" stroke-width=\"3.5\"/>\n              <path class=\"tick-path\" d=\"M15 27l8 8 14-16\" fill=\"none\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n            <\/svg>\n          <\/div>\n          <h3 id=\"sheetTitle\">Table confirmed!<\/h3>\n          <p class=\"sheet-sub\">See you soon. Show this reference at the door.<\/p>\n\n          <div class=\"ticket\">\n            <div class=\"ticket-top\">\n              <span class=\"cap\">Booking reference<\/span>\n              <div class=\"ref-row\">\n                <strong id=\"ref\">EP-0000-0000<\/strong>\n                <button type=\"button\" class=\"copy\" id=\"copy\">Copy<\/button>\n              <\/div>\n            <\/div>\n            <div class=\"ticket-rows\">\n              <div><span>Date<\/span><b id=\"s-date\"><\/b><\/div>\n              <div><span>Time<\/span><b id=\"s-time\"><\/b><\/div>\n              <div><span>Guests<\/span><b id=\"s-guests\"><\/b><\/div>\n              <div><span>Requests<\/span><b id=\"s-pref\"><\/b><\/div>\n            <\/div>\n          <\/div>\n\n          <p class=\"policy\">Free cancellation up to 2 hours before. 15-minute grace period.<\/p>\n          <button type=\"button\" class=\"cta\" id=\"doneBtn\"><span class=\"cta-label\">Done<\/span><\/button>\n        <\/section>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/template>\n\n<\!-- ===== Router / screen isolation =====\n  Delivery:  #location  #menu  #cart  #checkout  #track\n  Dine-in:   #scan  #verify  #dmenu  #dcart  #dtrack\n  Booking:   #book   (Bookings tab in the delivery menu)\n  Start:     #home   (Delivery / Dine in / Book a table)   (#scan/demo shows the demo-scan buttons)\n-->\n<script>\n(function () {\n  var NAMES = [\"home\", \"location\", \"menu\", \"cart\", \"checkout\", \"track\", \"scan\", \"verify\", \"dmenu\", \"dcart\", \"dtrack\", \"book\"];\n  var App = window.App = { enter: {}, leave: {}, sr: {}, hosts: {}, current: null };\n  NAMES.forEach(function (n) {\n    var host = document.getElementById('host-' + n);\n    var sr = host.attachShadow({ mode: 'open' });\n    sr.appendChild(document.getElementById('tpl-' + n).content.cloneNode(true));\n    App.hosts[n] = host; App.sr[n] = sr;\n  });\n  function show(name, arg) {\n    var prev = App.current;\n    if (prev && prev !== name && App.leave[prev]) { try { App.leave[prev](); } catch (e) { console.error(e); } }\n    NAMES.forEach(function (k) { App.hosts[k].hidden = k !== name; });\n    App.current = name;\n    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });\n    var fn = App.enter[name];\n    if (fn) fn(arg);\n  }\n  function route() {\n    var p = (location.hash || '').replace(/^#/, '').split('/');\n    show(NAMES.indexOf(p[0]) > -1 ? p[0] : 'home', p[1] || null);\n  }\n  App.go = function (name, arg, replace) {\n    var h = '#' + name + (arg ? '/' + arg : '');\n    if (replace) { history.replaceState(null, '', h); route(); }\n    else if (location.hash === h) route();\n    else location.hash = h;\n  };\n  App.start = route;\n  window.addEventListener('hashchange', route);\n})();\n<\/script>\n\n<\!-- ===== SCRIPT: home ===== -->\n<script>\n(function (SR) {\n(() => {\n  'use strict';\n  const $ = (s, r = SR) => r.querySelector(s);\n  const DEFAULT = 'Fire-grilled favourites, at your door';\n  App.enter.home = () => {\n    let sub = DEFAULT;\n    try {\n      const s = JSON.parse(localStorage.getItem('barbiqnation.deliveryAddress'));\n      if (s && s.address) sub = 'Delivering to ' + (s.label || s.address.split(',').slice(0, 2).join(',').trim());\n    } catch { /* ignore */ }\n    $('#delSub').textContent = sub;\n  };\n})();\n\n})(App.sr.home);\n<\/script>\n\n<\!-- ===== SCRIPT: location ===== -->\n<script>\n(function (SR) {\n/* ==========================================================\n   Barbiqnation \u00b7 Set delivery location\n   States: loading \u2192 idle \u2192 detected / typed \u2192 validating \u2192 confirmed | error\n   ========================================================== */\n(() => {\n  'use strict';\n\n  // ---------- Config (demo) ----------\n  const STORAGE_KEY = 'barbiqnation.deliveryAddress';\n  const DEMO_MODE = true; // true = simulated detection + validation. Swap with real geolocation / API.\n  const DEMO_DETECTED = '24, Sunrise Residency, Sector 18, Noida 201301';\n  const SERVICE_PREFIXES = ['110', '122', '201', '400', '560']; // postcode prefixes we deliver to\n  const SERVICE_AREAS = ['connaught', 'saket', 'dwarka', 'gurgaon', 'noida', 'andheri', 'indiranagar'];\n  const TRANSITION_DELAY = 1300; // ms to show the confirmed chip before moving to menu\n\n  const SAVED = [\n    { id: 'home', label: 'Home', address: 'B-42, Green Park Extension, New Delhi 110016' },\n    { id: 'work', label: 'Work', address: 'Tower 2, DLF Cyber City, Gurgaon 122002' },\n    { id: 'parents', label: \"Parents' place\", address: '12, MG Road, Indiranagar, Bengaluru 560038' },\n  ];\n\n  // ---------- Elements ----------\n  const $ = (id) => SR.getElementById(id);\n  const screenLocation = $('screenLocation');\n  const screenMenu = $('screenMenu');\n  const mapCard = $('mapCard');\n  const addrChip = $('addrChip');\n  const addrText = $('addrText');\n  const liveRegion = $('liveRegion');\n  const locateBtn = $('locateBtn');\n  const form = $('addressForm');\n  const input = $('addressInput');\n  const fieldControl = $('fieldControl');\n  const clearBtn = $('clearBtn');\n  const confirmBtn = $('confirmBtn');\n  const notice = $('areaNotice');\n  const checkAnotherBtn = $('checkAnotherBtn');\n  const savedList = $('savedList');\n  const backBtn = $('backBtn');\n  const menuAddrText = $('menuAddrText');\n  const menuAddrBtn = $('menuAddrBtn');\n\n  let busy = false;\n  let transitionTimer = null;\n\n  // ---------- Helpers ----------\n  const wait = (ms) => new Promise((r) => setTimeout(r, ms));\n  const announce = (msg) => {\n    liveRegion.textContent = '';\n    // re-set on next tick so repeated messages are still announced\n    setTimeout(() => (liveRegion.textContent = msg), 50);\n  };\n  const setState = (s) => (screenLocation.dataset.state = s);\n\n  const store = {\n    get() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; } },\n    set(v) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); } catch { /* storage unavailable */ } },\n  };\n\n  function setChip(text, variant) {\n    addrChip.classList.remove('is-updating');\n    void addrChip.offsetWidth; // restart animation\n    addrChip.classList.add('is-updating');\n    addrText.textContent = variant === 'confirmed' ? `Delivering to ${text}` : text;\n    addrChip.dataset.variant = variant;\n  }\n\n  function setBusy(btn, on) {\n    busy = on;\n    [locateBtn, confirmBtn].forEach((b) => (b.disabled = on));\n    btn.classList.toggle('is-loading', on);\n    btn.setAttribute('aria-busy', String(on));\n    savedList.querySelectorAll('input, button').forEach((el) => (el.disabled = on));\n  }\n\n  function showError(on) {\n    notice.hidden = !on;\n    fieldControl.classList.toggle('has-error', on);\n    input.toggleAttribute('aria-invalid', on);\n    if (on) {\n      notice.classList.remove('shake');\n      void notice.offsetWidth;\n      notice.classList.add('shake');\n    }\n  }\n\n  function bounceMap() {\n    mapCard.classList.remove('is-bouncing');\n    void mapCard.offsetWidth;\n    mapCard.classList.add('is-bouncing', 'is-panned');\n  }\n\n  // ---------- \"Backend\" (replace with real services) ----------\n  function isServiceable(text) {\n    const pc = text.match(/\\b\\d{6}\\b/);\n    if (pc) return SERVICE_PREFIXES.includes(pc[0].slice(0, 3));\n    const t = text.toLowerCase();\n    return SERVICE_AREAS.some((a) => t.includes(a));\n  }\n\n  async function validateAddress(text) {\n    await wait(DEMO_MODE ? 900 : 0);\n    return isServiceable(text);\n  }\n\n  async function detectLocation() {\n    if (DEMO_MODE) { await wait(1300); return DEMO_DETECTED; }\n    // Real version: navigator.geolocation.getCurrentPosition \u2192 reverse-geocode API\n    throw new Error('Not implemented');\n  }\n\n  // ---------- Confirm + transition ----------\n  function confirmAddress(address, meta) {\n    showError(false);\n    setState('confirmed');\n    setChip(address, 'confirmed');\n    bounceMap();\n    store.set({ address, ...meta, savedAt: Date.now() });\n    announce(`Delivering to ${address}. Taking you to the menu.`);\n    clearTimeout(transitionTimer);\n    transitionTimer = setTimeout(() => goToMenu(address), TRANSITION_DELAY);\n  }\n\n  function goToMenu(address) {\n    App.go('menu'); return;\n    menuAddrText.textContent = address;\n    screenLocation.hidden = true;\n    screenMenu.hidden = false;\n    window.scrollTo(0, 0);\n    menuAddrBtn.focus({ preventScroll: true });\n  }\n\n  function backToLocation() {\n    clearTimeout(transitionTimer);\n    history.replaceState(null, '', '?change=1');\n    screenMenu.hidden = true;\n    screenLocation.hidden = false;\n    setState('idle');\n    setChip('No location set yet', 'empty');\n    savedList.querySelectorAll('input').forEach((r) => (r.checked = false));\n    input.focus();\n  }\n\n  // ---------- Flow: current location ----------\n  async function useCurrentLocation() {\n    if (busy) return;\n    clearTimeout(transitionTimer);\n    showError(false);\n    setBusy(locateBtn, true);\n    setState('validating');\n    announce('Detecting your location.');\n    try {\n      const address = await detectLocation();\n      setState('detected');\n      setChip(address, 'detected');\n      input.value = '';\n      syncInputUI();\n      bounceMap();\n      announce(`Location detected: ${address}. Checking delivery area.`);\n      const ok = await validateAddress(address);\n      setBusy(locateBtn, false);\n      if (ok) confirmAddress(address, { via: 'gps' });\n      else outOfArea(address);\n    } catch {\n      setBusy(locateBtn, false);\n      setState('idle');\n      announce(\"We couldn't detect your location. Please enter your address instead.\");\n      input.focus();\n    }\n  }\n\n  // ---------- Flow: typed address ----------\n  async function submitTyped(e) {\n    e.preventDefault();\n    const value = input.value.trim();\n    if (busy || value.length < 3) return;\n    clearTimeout(transitionTimer);\n    showError(false);\n    setBusy(confirmBtn, true);\n    setState('validating');\n    announce('Checking delivery area.');\n    const ok = await validateAddress(value);\n    setBusy(confirmBtn, false);\n    if (ok) confirmAddress(value, { via: 'manual' });\n    else outOfArea(value);\n  }\n\n  function outOfArea(address) {\n    setState('error');\n    setChip(address, 'detected');\n    showError(true);\n    announce(\"We don't deliver to this address yet. Try a nearby postcode.\");\n  }\n\n  function syncInputUI() {\n    const has = input.value.trim().length > 0;\n    clearBtn.hidden = !has;\n    confirmBtn.hidden = input.value.trim().length < 3;\n  }\n\n  // ---------- Saved addresses ----------\n , '19:30', '20:00', '20:30'];\n  const ALL_SLOTS = [...LUNCH, ...DINNER];\n  const REL = ['Today', 'Tomorrow', 'In 2 days'];\n\n  const state = { dateIdx: 0, guests: 2, slot: null, prefs: new Set() };\n\n  /* ---------- Helpers ---------- */\n  const $ = (s) => SR.querySelector(s);\n  const dayList = [0, 1, 2].map((i) => {\n    const d = new Date();\n    d.setHours(0, 0, 0, 0);\n    d.setDate(d.getDate() + i);\n    return d;\n  });\n\n  const fmt = (d, o) => d.toLocaleDateString('en-IN', o);\n  const toMinutes = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };\n  const to12h = (t) => {\n    const [h, m] = t.split(':').map(Number);\n    return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;\n  };\n\n  /* Demo availability. In production this comes from the server's live table inventory. */\n  function slotStatus(dateIdx, slot) {\n    if (dateIdx === 0) {\n      const now = new Date();\n      if (toMinutes(slot) <= now.getHours() * 60 + now.getMinutes() + CUTOFF_MIN) return 'past';\n    }\n    const idx = ALL_SLOTS.indexOf(slot);\n    if ((dateIdx * 3 + idx + Math.ceil(state.guests / 3)) % 5 === 0) return 'full';\n    if (state.guests > 6 && (slot === '19:00' || slot === '20:00')) return 'full';\n    return 'open';\n  }\n\n  /* ---------- Dates ---------- */\n  const datesEl = $('#dates');\n  function buildDates() {\n    dayList.forEach((d, i) => {\n      const b = document.createElement('button');\n      b.type = 'button';\n      b.className = 'date';\n      b.setAttribute('role', 'radio');\n      b.innerHTML =\n        `<span class=\"d-rel\">${REL[i]}<\/span>` +\n        `<span class=\"d-num\">${fmt(d, { day: 'numeric', month: 'short' })}<\/span>` +\n        `<span class=\"d-day\">${fmt(d, { weekday: 'short' })}<\/span>`;\n      b.addEventListener('click', () => {\n        if (state.dateIdx === i) return;\n        state.dateIdx = i;\n        refreshDates();\n        refreshSlots(true);\n        refreshSummary();\n      });\n      datesEl.appendChild(b);\n    });\n    refreshDates();\n  }\n  function refreshDates() {\n    [...datesEl.children].forEach((b, i) =>\n      b.setAttribute('aria-checked', String(i === state.dateIdx)));\n  }\n\n  /* ---------- Slots ---------- */\n  const slotsEl = $('#slots');\n  const slotBtns = new Map();\n\n  function buildSlots() {\n    [['Lunch', LUNCH], ['Dinner', DINNER]].forEach(([label, list]) => {\n      const wrap = document.createElement('div');\n      wrap.innerHTML = `<p class=\"group-label\">${label}<\/p>`;\n      const grid = document.createElement('div');\n      grid.className = 'slot-grid';\n      list.forEach((t) => {\n        const b = document.createElement('button');\n        b.type = 'button';\n        b.className = 'slot';\n        b.textContent = to12h(t);\n        b.addEventListener('click', () => {\n          state.slot = t;\n          refreshSlots(false);\n          refreshSummary();\n        });\n        slotBtns.set(t, b);\n        grid.appendChild(b);\n      });\n      wrap.appendChild(grid);\n      slotsEl.appendChild(wrap);\n    });\n    refreshSlots(false);\n  }\n\n  function refreshSlots(animate) {\n    let dropped = false;\n    ALL_SLOTS.forEach((t, i) => {\n      const b = slotBtns.get(t);\n      const st = slotStatus(state.dateIdx, t);\n      const unavailable = st !== 'open';\n      b.disabled = unavailable;\n      b.title = st === 'full' ? 'Fully booked' : st === 'past' ? 'Booking closed for this time' : '';\n      b.setAttribute('aria-label',\n        `${to12h(t)}${st === 'full' ? ', fully booked' : st === 'past' ? ', closed' : ''}`);\n\n      if (unavailable && state.slot === t) { state.slot = null; dropped = true; }\n      b.classList.toggle('is-selected', state.slot === t);\n\n      // replay stagger animation when date changes\n      b.style.setProperty('--i', i % 4);\n      if (animate) { b.style.animation = 'none'; void b.offsetWidth; b.style.animation = ''; }\n    });\n    if (dropped) flashWarn('That slot just filled up. Pick another time.');\n  }\n\n  /* ---------- Guests ---------- */\n  const countEl = $('#count');\n  const minus = $('#minus');\n  const plus = $('#plus');\n\n  function setGuests(n) {\n    state.guests = Math.min(MAX_GUESTS, Math.max(MIN_GUESTS, n));\n    countEl.textContent = state.guests;\n    countEl.classList.remove('bump'); void countEl.offsetWidth; countEl.classList.add('bump');\n    minus.disabled = state.guests === MIN_GUESTS;\n    plus.disabled = state.guests === MAX_GUESTS;\n    refreshSlots(false); // capacity changes with party size\n    refreshSummary();\n  }\n  minus.addEventListener('click', () => setGuests(state.guests - 1));\n  plus.addEventListener('click', () => setGuests(state.guests + 1));\n\n  /* ---------- Preferences ---------- */\n  SR.querySelectorAll('.chip').forEach((c) => {\n    c.addEventListener('click', () => {\n      const on = c.getAttribute('aria-pressed') !== 'true';\n      c.setAttribute('aria-pressed', String(on));\n      on ? state.prefs.add(c.textContent) : state.prefs.delete(c.textContent);\n    });\n  });\n\n  /* ---------- Summary + CTA ---------- */\n  const summary = $('#summary');\n  const confirmBtn = $('#confirmBtn');\n\n  function refreshSummary() {\n    summary.classList.remove('warn');\n    if (!state.slot) {\n      summary.textContent = 'Pick a time to continue';\n      summary.classList.remove('ready');\n      confirmBtn.disabled = true;\n      return;\n    }\n    const d = fmt(dayList[state.dateIdx], { weekday: 'short', day: 'numeric', month: 'short' });\n    summary.textContent =\n      `${d} \u00b7 ${state.guests} ${state.guests === 1 ? 'guest' : 'guests'} \u00b7 ${to12h(state.slot)}`;\n    summary.classList.add('ready');\n    confirmBtn.disabled = false;\n  }\n  function flashWarn(msg) {\n    summary.textContent = msg;\n    summary.classList.remove('ready', 'warn');\n    void summary.offsetWidth;\n    summary.classList.add('warn');\n    confirmBtn.disabled = true;\n  }\n\n  /* ---------- Confirm + sheet ---------- */\n  const overlay = $('#overlay');\n  const label = confirmBtn.querySelector('.cta-label');\n\n  function makeRef() {\n    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';\n    const d = dayList[state.dateIdx];\n    const code = String(d.getDate()).padStart(2, '0') + String(d.getMonth() + 1).padStart(2, '0');\n    let tail = '';\n    for (let i = 0; i < 4; i++) tail += chars[Math.floor(Math.random() * chars.length)];\n    return `EP-${code}-${tail}`;\n  }\n\n  confirmBtn.addEventListener('click', () => {\n    if (!state.slot) return;\n    confirmBtn.classList.add('loading');\n    label.textContent = 'Confirming\u2026';\n\n    // Simulated server round-trip: re-check live availability, then reserve atomically.\n    setTimeout(() => {\n      confirmBtn.classList.remove('loading');\n      label.textContent = 'Confirm booking';\n      if (slotStatus(state.dateIdx, state.slot) !== 'open') {\n        refreshSlots(false);\n        return;\n      }\n      openSheet();\n    }, 1000);\n  });\n\n  function openSheet() {\n    $('#ref').textContent = makeRef();\n    $('#s-date').textContent = fmt(dayList[state.dateIdx], { weekday: 'long', day: 'numeric', month: 'short' });\n    $('#s-time').textContent = to12h(state.slot);\n    $('#s-guests').textContent = `${state.guests} ${state.guests === 1 ? 'guest' : 'guests'}`;\n    const extras = [...state.prefs];\n    const note = $('#note').value.trim();\n    if (note) extras.push(note);\n    $('#s-pref').textContent = extras.length ? extras.join(', ') : 'None';\n\n    spawnSparks();\n    overlay.hidden = false;\n    void overlay.offsetWidth;\n    overlay.classList.add('open');\n    $('#doneBtn').focus({ preventScroll: true });\n  }\n\n  function closeSheet() {\n    overlay.classList.remove('open');\n    setTimeout(() => { overlay.hidden = true; }, 450);\n    // reset for the next booking\n    state.slot = null;\n    state.prefs.clear();\n    SR.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));\n    $('#note').value = '';\n    refreshSlots(false);\n    refreshSummary();\n  }\n\n  $('#doneBtn').addEventListener('click', closeSheet);\n  document.addEventListener('keydown', (e) => {\n    if (App.current === 'book' && e.key === 'Escape' && !overlay.hidden) closeSheet();\n  });\n\n  $('#copy').addEventListener('click', async (e) => {\n    const btn = e.currentTarget;\n    try { await navigator.clipboard.writeText($('#ref').textContent); btn.textContent = 'Copied'; }\n    catch { btn.textContent = 'Select & copy'; }\n    setTimeout(() => { btn.textContent = 'Copy'; }, 1600);\n  });\n\n  function spawnSparks() {\n    const box = $('#sparks');\n    box.innerHTML = '';\n    for (let i = 0; i < 16; i++) {\n      const s = document.createElement('i');\n      s.style.left = `${10 + Math.random() * 80}%`;\n      s.style.setProperty('--x', `${(Math.random() - 0.5) * 80}px`);\n      s.style.setProperty('--t', `${1.6 + Math.random() * 1.2}s`);\n      s.style.setProperty('--dl', `${0.3 + Math.random() * 0.6}s`);\n      s.style.background = i % 3 === 0 ? '#29211E' : '#B83225';\n      box.appendChild(s);\n    }\n  }\n\n  /* ---------- Init ---------- */\n  buildDates();\n  buildSlots();\n  setGuests(2);\n\n  SR.querySelector('.icon-btn').addEventListener('click', () => App.go('home'));\n  App.enter.book = () => {\n    state.slot = null; state.prefs.clear();\n    SR.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));\n    $('#note').value = '';\n    overlay.classList.remove('open'); overlay.hidden = true;\n    confirmBtn.classList.remove('loading'); label.textContent = 'Confirm booking';\n    refreshSlots(false); refreshSummary();\n  };\n})();\n})(App.sr.book);\n<\/script>\n\n<script>App.start();<\/script>\n<\/body>\n<\/html>\n",
