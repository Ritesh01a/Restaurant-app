>Checkout \u2192<\/span>\n      <\/button>\n    <\/div>\n\n    <\!-- Toast (supports Undo) -->\n    <div class=\"toast\" id=\"toast\" role=\"status\" hidden>\n      <span id=\"toastText\"><\/span>\n      <button class=\"toast__btn\" id=\"toastUndo\" type=\"button\" hidden>Undo<\/button>\n    <\/div>\n\n  <\/div>\n<\/template>\n\n<\!-- ===== SCREEN: checkout ===== -->\n<template id=\"tpl-checkout\">\n<style>\n/* ==========================================================\n   Ember & Plate \u00b7 Delivery instructions & payment (/delivery/checkout)\n   ========================================================== */\n:host {\n  --primary: #B83225;\n  --primary-hover: #98281F;\n  --primary-subtle: #F5E3DF;\n  --bg: #FFF8EF;\n  --surface: #FFFFFF;\n  --text: #29211E;\n  --text-2: #6F625C;\n  --border: #E6D9CD;\n  --disabled: #B9AEA7;\n  --success: #237A45;\n  --error: #B42318;\n\n  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;\n  --ease: cubic-bezier(.2, .8, .2, 1);\n  --safe-b: env(safe-area-inset-bottom, 0px);\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n\n\n:host { margin: 0; font-family: \"Inter\", system-ui, -apple-system, \"Segoe UI\", sans-serif; font-size: 14px; line-height: 20px; color: var(--text); background: var(--bg); }\nbutton, input { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\nh1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }\nul { list-style: none; }\na { color: inherit; text-decoration: none; }\n[hidden] { display: none !important; }\n:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }\n.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }\n\n.app { max-width: 480px; min-height: 100vh; margin: 0 auto; background: var(--bg); position: relative; }\n.h2 { font-size: 22px; line-height: 30px; font-weight: 600; }\n.h3 { font-size: 18px; line-height: 26px; font-weight: 600; }\n\n/* ---------- Header ---------- */\n.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4) var(--s2) var(--s2); background: var(--bg); }\n.topbar__title { font-size: 28px; line-height: 36px; font-weight: 700; }\n.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--text); transition: background-color .15s ease, transform .12s ease; }\n.icon-btn:hover { background: rgba(41, 33, 30, .06); }\n.icon-btn:active { transform: scale(.92); }\n\n/* ---------- Layout / entrance ---------- */\n.content { display: flex; flex-direction: column; gap: var(--s6); padding: var(--s2) var(--s4) calc(56px + var(--s6) * 2 + var(--safe-b)); }\n.content > * { animation: fadeUp .5s var(--ease) both; }\n.content > :nth-child(2) { animation-delay: 60ms; }\n.content > :nth-child(3) { animation-delay: 120ms; }\n.content > :nth-child(4) { animation-delay: 180ms; }\n.content > :nth-child(5) { animation-delay: 240ms; }\n@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n.block > .h3, .block > .h2 { margin-bottom: var(--s3); }\n\n.link-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0 var(--s2); font-size: 15px; line-height: 20px; font-weight: 600; color: var(--primary); background: transparent; border: 0; }\n.link-btn:hover { text-decoration: underline; }\n\n/* ---------- 1. Address banner ---------- */\n.addr { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s3) var(--s3) var(--s4); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }\n.addr__icon { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--primary-subtle); color: var(--primary); }\n.addr__text { flex: 1; min-width: 0; }\n.addr__label { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.addr__label strong { color: var(--text); font-weight: 600; font-size: 14px; }\n.addr__line { font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }\n\n/* ---------- 2. Instruction toggle cards ---------- */\n.instr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }\n.opt { position: relative; display: flex; align-items: center; gap: var(--s2); min-height: 56px; padding: var(--s3); padding-right: var(--s6); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: border-color .2s ease, background-color .2s ease, box-shadow .2s ease, transform .15s ease; }\n.opt input { position: absolute; opacity: 0; pointer-events: none; }\n.opt:hover { border-color: #D7C5B5; }\n.opt:active { transform: scale(.97); }\n.opt__emoji { flex: none; font-size: 20px; line-height: 1; transition: transform .3s var(--ease); }\n.opt__text { font-size: 14px; line-height: 18px; font-weight: 600; }\n.opt__check { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; background: var(--primary); color: #fff; opacity: 0; transform: scale(.4); transition: opacity .15s ease, transform .3s var(--ease); }\n.opt:has(input:checked) { border-color: var(--primary); background: var(--primary-subtle); box-shadow: 0 0 0 1px var(--primary); }\n.opt:has(input:checked) .opt__check { opacity: 1; transform: none; }\n.opt:has(input:checked) .opt__emoji { transform: scale(1.18) rotate(-6deg); }\n.opt:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }\n\n/* ---------- 3. Coupon card ---------- */\n.coupon { display: flex; align-items: center; background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; transition: border-color .25s ease, background-color .25s ease; }\n.coupon__main { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: var(--s3) var(--s4); border: 0; background: transparent; text-align: left; border-radius: 12px; }\n.coupon__main:hover .coupon__arrow { transform: translateX(3px); }\n.coupon__icon { position: relative; flex: none; width: 24px; height: 24px; color: var(--primary); }\n.coupon__icon svg { position: absolute; inset: 0; transition: opacity .2s ease, transform .35s var(--ease); }\n.coupon__icon .i-ok { opacity: 0; transform: scale(.4) rotate(-30deg); color: var(--success); }\n.coupon__body { flex: 1; min-width: 0; display: flex; flex-direction: column; }\n.coupon__text { font-size: 14px; line-height: 20px; font-weight: 400; }\n.coupon__sub { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--success); }\n.coupon__arrow { flex: none; color: var(--primary); transition: transform .2s var(--ease); }\n.coupon__remove { flex: none; min-height: 44px; margin-right: var(--s2); padding: 0 var(--s3); border: 0; background: transparent; color: var(--primary); font-size: 14px; font-weight: 600; }\n.coupon__remove:hover { text-decoration: underline; }\n.coupon.is-applied { border-style: solid; border-color: var(--success); background: #F3FAF5; }\n.coupon.is-applied .coupon__text { font-weight: 600; }\n.coupon.is-applied .coupon__icon .i-tag { opacity: 0; transform: scale(.4); }\n.coupon.is-applied .coupon__icon .i-ok { opacity: 1; transform: none; }\n.coupon.is-applied .coupon__arrow { display: none; }\n.coupon.stamp { animation: stamp .5s var(--ease); }\n@keyframes stamp { 0% { transform: scale(.96); } 50% { transform: scale(1.025); } 100% { transform: none; } }\n\n/* ---------- 4. Bill ---------- */\n.bill-card { padding: var(--s4); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }\n.bill { margin-top: var(--s3); }\n.bill__row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); font-size: 14px; line-height: 20px; color: var(--text); }\n.bill__row + .bill__row { margin-top: var(--s2); }\n.bill__row dd { margin: 0; font-variant-numeric: tabular-nums; }\n.bill__count { color: var(--text-2); font-size: 12px; }\n.bill__row--discount { color: var(--success); font-weight: 600; max-height: 24px; overflow: hidden; transition: max-height .35s var(--ease), opacity .3s ease, margin .35s var(--ease); }\n.bill__row--discount.is-off { max-height: 0; opacity: 0; margin-top: 0 !important; }\n.divider { height: 1px; margin: var(--s4) 0; border: 0; background: var(--border); }\n.total { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); }\n.total__label { font-size: 22px; line-height: 30px; font-weight: 600; }\n.total__value { font-size: 18px; line-height: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }\n.saving { display: flex; align-items: center; gap: 6px; margin-top: var(--s3); padding: var(--s2) var(--s3); border-radius: 8px; background: #E8F3EC; color: var(--success); font-size: 12px; line-height: 16px; font-weight: 600; max-height: 40px; overflow: hidden; transition: max-height .35s var(--ease), opacity .3s ease, margin .35s var(--ease), padding .35s var(--ease); }\n.saving.is-off { max-height: 0; opacity: 0; margin-top: 0; padding-top: 0; padding-bottom: 0; }\n.saving svg { flex: none; }\n\n/* ---------- 5. Payment ---------- */\n.pay { display: flex; flex-direction: column; gap: var(--s2); }\n.pay__card { position: relative; display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: 0 var(--s4); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: border-color .2s ease, background-color .2s ease, box-shadow .2s ease, transform .15s ease; }\n.pay__card input { position: absolute; opacity: 0; pointer-events: none; }\n.pay__card:hover { border-color: #D7C5B5; }\n.pay__card:active { transform: scale(.985); }\n.pay__name { flex: 1; min-width: 0; font-size: 14px; line-height: 20px; font-weight: 600; }\n.radio { flex: none; width: 22px; height: 22px; display: grid; place-items: center; border: 2px solid var(--text-2); border-radius: 50%; transition: border-color .2s ease, transform .3s var(--ease); }\n.radio::after { content: \"\"; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); transform: scale(0); transition: transform .3s var(--ease); }\n.pay__card:has(input:checked) { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }\n.pay__card:has(input:checked) .radio { border-color: var(--primary); transform: scale(1.06); }\n.pay__card:has(input:checked) .radio::after { transform: scale(1); }\n.pay__card:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }\n.tag { flex: none; padding: 2px var(--s2); border-radius: 999px; background: var(--primary-subtle); color: var(--primary); font-size: 12px; line-height: 16px; font-weight: 600; }\n.brands { display: inline-flex; gap: 4px; flex: none; }\n.brand { padding: 1px 6px; border: 1px solid var(--border); border-radius: 6px; font-size: 11px; line-height: 16px; font-weight: 600; color: var(--text-2); background: var(--bg); }\n.pay__more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease); }\n.pay__more > p { min-height: 0; overflow: hidden; padding: 0 var(--s4) 0 calc(var(--s4) + 22px + var(--s3)); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); opacity: 0; transition: opacity .25s ease, padding .3s var(--ease); }\n.pay__item:has(input:checked) .pay__more { grid-template-rows: 1fr; }\n.pay__item:has(input:checked) .pay__more > p { opacity: 1; padding-top: var(--s2); padding-bottom: 2px; }\n\n.alert { display: flex; gap: var(--s2); margin-bottom: var(--s3); padding: var(--s3); background: var(--surface); border: 1px solid var(--error); border-radius: 12px; animation: noticeIn .35s var(--ease), shake .4s .1s ease; }\n.alert svg { flex: none; color: var(--error); }\n@keyframes noticeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }\n@keyframes shake { 0%, 100% { translate: 0; } 25% { translate: -5px; } 75% { translate: 5px; } }\n\n/* ---------- 6. Sticky CTA ---------- */\n.cta { position: fixed; z-index: 30; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 480px); padding: var(--s6) var(--s4) calc(var(--s3) + var(--safe-b)); background: linear-gradient(to top, var(--bg) 70%, rgba(255, 248, 239, 0)); animation: ctaIn .5s .25s var(--ease) both; }\n@keyframes ctaIn { from { opacity: 0; transform: translate(-50%, 30px); } to { opacity: 1; transform: translate(-50%, 0); } }\n.cta__btn { position: relative; width: 100%; height: 56px; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); border: 0; border-radius: 12px; background: var(--primary); color: var(--bg); font-size: 15px; line-height: 20px; font-weight: 600; box-shadow: 0 8px 20px rgba(184, 50, 37, .3); transition: background-color .15s ease, transform .12s ease, box-shadow .2s ease; overflow: hidden; }\n.cta__btn::after { content: \"\"; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.22) 50%, transparent 70%); transform: translateX(-120%); }\n.cta__btn:hover { background: var(--primary-hover); }\n.cta__btn:hover::after { transform: translateX(120%); transition: transform .7s ease; }\n.cta__btn:active { transform: scale(.985); }\n.cta__btn:focus-visible { outline-color: var(--text); outline-offset: 3px; }\n.cta__btn[aria-busy=\"true\"] { cursor: progress; background: var(--primary); }\n.cta__spinner { display: none; width: 18px; height: 18px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }\n.cta__btn[aria-busy=\"true\"] .cta__spinner { display: inline-block; }\n@keyframes spin { to { transform: rotate(360deg); } }\n.cta.bump .cta__label { animation: labelSwap .3s var(--ease); }\n@keyframes labelSwap { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }\n\n/* ---------- Buttons / sheet ---------- */\n.btn { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 var(--s5); border: 0; border-radius: 12px; font-size: 15px; font-weight: 600; transition: background-color .15s ease, transform .12s ease; }\n.btn--primary { background: var(--primary); color: #fff; }\n.btn--primary:hover { background: var(--primary-hover); }\n.btn:active { transform: scale(.97); }\n\n.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(41, 33, 30, .5); opacity: 0; transition: opacity .25s ease; }\n.scrim.is-open { opacity: 1; }\n.sheet { position: fixed; z-index: 51; left: 50%; bottom: 0; width: min(100%, 480px); max-height: 88vh; overflow-y: auto; padding: var(--s2) var(--s4) calc(var(--s6) + var(--safe-b)); background: var(--bg); border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(41, 33, 30, .2); transform: translate(-50%, 100%); transition: transform .3s var(--ease); }\n.sheet.is-open { transform: translate(-50%, 0); }\n.sheet__handle { width: 40px; height: 4px; margin: 0 auto var(--s2); border-radius: 4px; background: var(--border); }\n.sheet__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s2); }\n.sheet__sub { margin: var(--s5) 0 var(--s3); }\n.code__label { display: block; margin-bottom: var(--s2); font-size: 14px; font-weight: 600; }\n.code__row { display: flex; gap: var(--s2); }\n.code__input { flex: 1; min-width: 0; height: 48px; padding: 0 var(--s3); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font-size: 16px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; outline: 0; transition: border-color .15s ease, box-shadow .2s ease; }\n.code__input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(184, 50, 37, .2); }\n.code__input[aria-invalid=\"true\"] { border-color: var(--error); }\n.code__help { margin-top: var(--s1); font-size: 12px; line-height: 16px; color: var(--text-2); }\n.code__help.is-error { color: var(--error); font-weight: 600; }\n.offers { display: flex; flex-direction: column; gap: var(--s2); }\n.offer { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; animation: fadeUp .35s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }\n.offer__body { flex: 1; min-width: 0; }\n.offer__code { display: inline-block; padding: 0 var(--s2); border: 1px dashed var(--primary); border-radius: 6px; color: var(--primary); font-size: 12px; line-height: 20px; font-weight: 700; letter-spacing: .05em; }\n.offer__title { margin-top: 4px; font-size: 14px; line-height: 20px; font-weight: 600; }\n.offer__desc { font-size: 12px; line-height: 16px; color: var(--text-2); }\n.offer__action { flex: none; }\n.offer__note { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text-2); max-width: 9ch; text-align: right; }\n\n/* ---------- Toast ---------- */\n.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(56px + var(--s6) + var(--s4) + var(--safe-b)); transform: translateX(-50%); max-width: calc(min(100%, 480px) - 32px); padding: var(--s3) var(--s4); border-radius: 12px; background: var(--text); color: var(--bg); font-size: 14px; font-weight: 500; animation: toastIn .3s var(--ease); }\n.toast.is-out { animation: toastOut .2s ease forwards; }\n@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }\n@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 8px); } }\n\n/* ---------- Success overlay ---------- */\n.done { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: var(--s6); background: var(--bg); animation: doneIn .4s var(--ease); }\n@keyframes doneIn { from { opacity: 0; } to { opacity: 1; } }\n.done__inner { width: min(100%, 420px); display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s2); }\n.done__badge { position: relative; width: 96px; height: 96px; margin-bottom: var(--s4); }\n.done__ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--success); opacity: 0; animation: ring 1.6s .5s ease-out infinite; }\n.done__ring--2 { animation-delay: 1.1s; }\n@keyframes ring { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.9); opacity: 0; } }\n.done__circle { stroke-dasharray: 151; stroke-dashoffset: 151; animation: draw .6s .1s ease forwards; }\n.done__tick { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .4s .6s ease forwards; }\n@keyframes draw { to { stroke-dashoffset: 0; } }\n.done__title { font-size: 28px; line-height: 36px; font-weight: 700; outline: none; animation: fadeUp .5s .5s var(--ease) both; }\n.done__ref, .done__line, .done__pay { animation: fadeUp .5s .6s var(--ease) both; }\n.done__ref { color: var(--text-2); }\n.done__ref strong { color: var(--text); font-weight: 700; letter-spacing: .03em; }\n.done__line { font-size: 16px; line-height: 24px; }\n.done__pay { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.done__btn { margin-top: var(--s5); animation: fadeUp .5s .7s var(--ease) both; }\n.done__link { animation: fadeUp .5s .75s var(--ease) both; }\n\n/* ---------- Reduced motion ---------- */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; animation-delay: 0ms !important; }\n  .cta__spinner { animation: spin 1.6s linear infinite !important; }\n  .done__ring { display: none; }\n}\n\n:host { display: block; }\n\n<\/style>\n<div class=\"app\" id=\"app\">\n\n    <\!-- Header -->\n    <header class=\"topbar\">\n      <button class=\"icon-btn\" id=\"backBtn\" type=\"button\" aria-label=\"Back\">\n        <svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 18-6-6 6-6\"/><\/svg>\n      <\/button>\n      <h1 class=\"topbar__title\">Checkout<\/h1>\n    <\/header>\n\n    <p class=\"sr-only\" id=\"liveRegion\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"><\/p>\n\n    <main class=\"content\" id=\"main\">\n\n      <\!-- 1. Delivery address banner -->\n      <section class=\"addr\" aria-label=\"Delivery address\">\n        <span class=\"addr__icon\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><\/svg>\n        <\/span>\n        <div class=\"addr__text\">\n          <p class=\"addr__label\">Delivering to <strong id=\"addrLabel\">Home<\/strong> \u00b7 <span id=\"addrEta\">12 min<\/span><\/p>\n          <p class=\"addr__line\" id=\"addrLine\">B-42, Green Park Extension, New Delhi 110016<\/p>\n        <\/div>\n        <a class=\"link-btn\" id=\"editAddr\" href=\"#location/change\" aria-label=\"Edit delivery address\">Edit<\/a>\n      <\/section>\n\n      <\!-- 2. Delivery instructions -->\n      <section class=\"block\" aria-labelledby=\"instrTitle\">\n        <h2 class=\"h3\" id=\"instrTitle\">Delivery Instructions<\/h2>\n        <div class=\"instr\" role=\"radiogroup\" aria-labelledby=\"instrTitle\" id=\"instrGroup\">\n          <label class=\"opt\"><input type=\"radio\" name=\"instr\" value=\"door\" checked /><span class=\"opt__emoji\" aria-hidden=\"true\">\ud83d\udeaa<\/span><span class=\"opt__text\">Leave at door<\/span><span class=\"opt__check\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12.500 4.500 4.500L19 7.500\"/><\/svg><\/span><\/label>\n          <label class=\"opt\"><input type=\"radio\" name=\"instr\" value=\"bell\" /><span class=\"opt__emoji\" aria-hidden=\"true\">\ud83d\udd14<\/span><span class=\"opt__text\">Ring the bell<\/span><span class=\"opt__check\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12.500 4.500 4.500L19 7.500\"/><\/svg><\/span><\/label>\n          <label class=\"opt\"><input type=\"radio\" name=\"instr\" value=\"call\" /><span class=\"opt__emoji\" aria-hidden=\"true\">\ud83d\udcde<\/span><span class=\"opt__text\">Call upon arrival<\/span><span class=\"opt__check\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12.500 4.500 4.500L19 7.500\"/><\/svg><\/span><\/label>\n          <label class=\"opt\"><input type=\"radio\" name=\"instr\" value=\"nocontact\" /><span class=\"opt__emoji\" aria-hidden=\"true\">\ud83d\udeab<\/span><span class=\"opt__text\">Avoid ringing bell / No contact<\/span><span class=\"opt__check\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12.500 4.500 4.500L19 7.500\"/><\/svg><\/span><\/label>\n        <\/div>\n      <\/section>\n\n      <\!-- 3. Coupons -->\n      <section class=\"coupon\" id=\"couponCard\" aria-label=\"Coupons and offers\">\n        <button class=\"coupon__main\" id=\"couponOpen\" type=\"button\" aria-haspopup=\"dialog\">\n          <span class=\"coupon__icon\" id=\"couponIcon\" aria-hidden=\"true\">\n            <svg class=\"i-tag\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12.590 2.590A2 2 0 0 0 11.170 2H4a2 2 0 0 0-2 2v7.170a2 2 0 0 0 .59 1.420l8.700 8.700a2.430 2.430 0 0 0 3.420 0l6.580-6.580a2.430 2.430 0 0 0 0-3.420Z\"/><circle cx=\"7.500\" cy=\"7.500\" r=\".5\" fill=\"currentColor\"/><\/svg>\n            <svg class=\"i-ok\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m8 12.500 2.700 2.700L16 9.500\"/><\/svg>\n          <\/span>\n          <span class=\"coupon__body\">\n            <span class=\"coupon__text\" id=\"couponText\">Apply Coupon Code / View Offers<\/span>\n            <span class=\"coupon__sub\" id=\"couponSub\" hidden><\/span>\n          <\/span>\n          <svg class=\"coupon__arrow\" viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 18 6-6-6-6\"/><\/svg>\n        <\/button>\n        <button class=\"coupon__remove\" id=\"couponRemove\" type=\"button\" hidden>Remove<\/button>\n      <\/section>\n\n      <\!-- 4. Bill details -->\n      <section class=\"bill-card\" aria-labelledby=\"billTitle\">\n        <h2 class=\"h3\" id=\"billTitle\">Bill Details<\/h2>\n        <dl class=\"bill\">\n          <div class=\"bill__row\"><dt>Item subtotal <span class=\"bill__count\" id=\"bCount\">(2 items)<\/span><\/dt><dd id=\"bSub\">\u20b9578<\/dd><\/div>\n          <div class=\"bill__row\"><dt>Packaging fee<\/dt><dd id=\"bPack\">\u20b925<\/dd><\/div>\n          <div class=\"bill__row\"><dt>Delivery fee<\/dt><dd id=\"bDel\">\u20b935<\/dd><\/div>\n          <div class=\"bill__row\"><dt>Taxes &amp; GST<\/dt><dd id=\"bTax\">\u20b929<\/dd><\/div>\n          <div class=\"bill__row bill__row--discount\" id=\"rowDiscount\"><dt id=\"discLabel\">Discount applied<\/dt><dd id=\"bDisc\">\u2212\u20b950<\/dd><\/div>\n        <\/dl>\n        <hr class=\"divider\" />\n        <div class=\"total\">\n          <span class=\"total__label\">Grand total<\/span>\n          <span class=\"total__value\" id=\"bTotal\">\u20b9617<\/span>\n        <\/div>\n        <p class=\"saving\" id=\"saving\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m8 12.500 2.700 2.700L16 9.500\"/><\/svg><span id=\"savingText\">You\u2019re saving \u20b950 on this order<\/span><\/p>\n      <\/section>\n\n      <\!-- 5. Payment method -->\n      <section class=\"block\" aria-labelledby=\"payTitle\">\n        <h2 class=\"h2\" id=\"payTitle\">Payment Method<\/h2>\n\n        <div class=\"alert\" id=\"payError\" role=\"alert\" hidden>\n          <svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 8v4M12 16h.01\"/><\/svg>\n          <p>Payment didn\u2019t go through. Your cart is safe, so retry or pick another method. You won\u2019t be charged twice.<\/p>\n        <\/div>\n\n        <ul class=\"pay\" role=\"radiogroup\" aria-labelledby=\"payTitle\" id=\"payGroup\">\n          <li class=\"pay__item\" data-pay=\"upi\">\n            <label class=\"pay__card\">\n              <input type=\"radio\" name=\"pay\" value=\"upi\" checked />\n              <span class=\"radio\" aria-hidden=\"true\"><\/span>\n              <span class=\"pay__name\">UPI / GPay / PhonePe<\/span>\n              <span class=\"tag\">Fast checkout<\/span>\n            <\/label>\n            <div class=\"pay__more\"><p class=\"pay__hint\" data-hint=\"upi\">You\u2019ll pick your UPI app on the next step.<\/p><\/div>\n          <\/li>\n          <li class=\"pay__item\" data-pay=\"card\">\n            <label class=\"pay__card\">\n              <input type=\"radio\" name=\"pay\" value=\"card\" />\n              <span class=\"radio\" aria-hidden=\"true\"><\/span>\n              <span class=\"pay__name\">Credit / Debit Cards<\/span>\n              <span class=\"brands\"><span class=\"brand\">Visa<\/span><span class=\"brand\">Mastercard<\/span><\/span>\n            <\/label>\n            <div class=\"pay__more\"><p class=\"pay__hint\">Enter your card details securely on the next step.<\/p><\/div>\n          <\/li>\n          <li class=\"pay__item\" data-pay=\"netbanking\">\n            <label class=\"pay__card\">\n              <input type=\"radio\" name=\"pay\" value=\"netbanking\" />\n              <span class=\"radio\" aria-hidden=\"true\"><\/span>\n              <span class=\"pay__name\">Net Banking<\/span>\n            <\/label>\n            <div class=\"pay__more\"><p class=\"pay__hint\">You\u2019ll choose your bank on the next step.<\/p><\/div>\n          <\/li>\n          <li class=\"pay__item\" data-pay=\"cod\">\n            <label class=\"pay__card\">\n              <input type=\"radio\" name=\"pay\" value=\"cod\" />\n              <span class=\"radio\" aria-hidden=\"true\"><\/span>\n              <span class=\"pay__name\">Cash on Delivery (COD)<\/span>\n            <\/label>\n            <div class=\"pay__more\"><p class=\"pay__hint\" id=\"codHint\">Keep the exact amount ready. It helps our rider.<\/p><\/div>\n          <\/li>\n        <\/ul>\n      <\/section>\n    <\/main>\n\n    <\!-- 6. Sticky CTA -->\n    <div class=\"cta\" id=\"cta\">\n      <button class=\"cta__btn\" id=\"payBtn\" type=\"button\">\n        <span class=\"cta__spinner\" aria-hidden=\"true\"><\/span>\n        <span class=\"cta__label\" id=\"payLabel\">Pay \u20b9617 &amp; Place Order<\/span>\n      <\/button>\n    <\/div>\n\n    <\!-- Offers sheet -->\n    <div class=\"scrim\" id=\"scrim\" hidden><\/div>\n    <section class=\"sheet\" id=\"offerSheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"offerTitle\" hidden>\n      <div class=\"sheet__handle\" aria-hidden=\"true\"><\/div>\n      <div class=\"sheet__head\">\n        <h2 class=\"h2\" id=\"offerTitle\">Offers &amp; coupons<\/h2>\n        <button class=\"icon-btn\" type=\"button\" data-close aria-label=\"Close offers\">\n          <svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.500\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/><\/svg>\n        <\/button>\n      <\/div>\n      <form class=\"code\" id=\"codeForm\" novalidate>\n        <label class=\"code__label\" for=\"codeInput\">Have a coupon code?<\/label>\n        <div class=\"code__row\">\n          <input class=\"code__input\" id=\"codeInput\" type=\"text\" autocomplete=\"off\" autocapitalize=\"characters\" spellcheck=\"false\" aria-describedby=\"codeHelp\" />\n          <button class=\"btn btn--primary\" type=\"submit\">Apply<\/button>\n        <\/div>\n        <p class=\"code__help\" id=\"codeHelp\">Enter a code, or pick an offer below.<\/p>\n      <\/form>\n      <h3 class=\"h3 sheet__sub\">Available offers<\/h3>\n      <ul class=\"offers\" id=\"offerList\"><\/ul>\n    <\/section>\n\n    <\!-- Toast -->\n    <div class=\"toast\" id=\"toast\" role=\"status\" hidden><\/div>\n\n    <\!-- Success overlay -->\n    <section class=\"done\" id=\"done\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"doneTitle\" hidden>\n      <div class=\"done__inner\">\n        <div class=\"done__badge\" aria-hidden=\"true\">\n          <span class=\"done__ring\"><\/span><span class=\"done__ring done__ring--2\"><\/span>\n          <svg viewBox=\"0 0 52 52\" width=\"96\" height=\"96\" fill=\"none\"><circle class=\"done__circle\" cx=\"26\" cy=\"26\" r=\"24\" stroke=\"#237A45\" stroke-width=\"3\"/><path class=\"done__tick\" d=\"m15 27 8 8 15-17\" stroke=\"#237A45\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n        <\/div>\n        <h2 class=\"done__title\" id=\"doneTitle\" tabindex=\"-1\">Order placed!<\/h2>\n        <p class=\"done__ref\">Order <strong id=\"doneRef\">EP-000000<\/strong><\/p>\n        <p class=\"done__line\" id=\"doneLine\">Arriving in about 12 min.<\/p>\n        <p class=\"done__pay\" id=\"donePay\"><\/p>\n        <button class=\"cta__btn done__btn\" id=\"trackBtn\" type=\"button\">Track order<\/button>\n        <a class=\"link-btn done__link\" href=\"#menu\">Back to menu<\/a>\n      <\/div>\n    <\/section>\n\n  <\/div>\n<\/template>\n\n<\!-- ===== SCREEN: track ===== -->\n<template id=\"tpl-track\">\n<style>\n/* ==========================================================\n   Ember & Plate \u00b7 Live order tracking (/delivery/track/{order_id})\n   ========================================================== */\n:host {\n  --primary: #B83225;\n  --primary-hover: #98281F;\n  --primary-subtle: #F5E3DF;\n  --bg: #FFF8EF;\n  --surface: #FFFFFF;\n  --text: #29211E;\n  --text-2: #6F625C;\n  --border: #E6D9CD;\n  --disabled: #B9AEA7;\n  --success: #237A45;\n\n  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;\n  --ease: cubic-bezier(.2, .8, .2, 1);\n  --safe-b: env(safe-area-inset-bottom, 0px);\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n\n:host { margin: 0; font-family: \"Inter\", system-ui, -apple-system, \"Segoe UI\", sans-serif; font-size: 14px; line-height: 20px; color: var(--text); background: var(--bg); }\nbutton { font: inherit; color: inherit; cursor: pointer; }\nh1, h2, h3, p, ul, ol { margin: 0; padding: 0; }\nul, ol { list-style: none; }\na { color: inherit; text-decoration: none; }\n[hidden] { display: none !important; }\n:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }\n.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }\n\n.app { max-width: 480px; min-height: 100vh; margin: 0 auto; background: var(--bg); position: relative; }\n.h2 { font-size: 22px; line-height: 30px; font-weight: 600; }\n.h3 { font-size: 18px; line-height: 26px; font-weight: 600; }\n\n/* ---------- Header ---------- */\n.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s2) var(--s4) var(--s2) var(--s2); background: var(--bg); }\n.home-btn { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 var(--s3) 0 var(--s2); border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--text); transition: background-color .15s ease, transform .12s ease; }\n.home-btn:hover { background: rgba(41, 33, 30, .06); }\n.home-btn:active { transform: scale(.95); }\n.topbar__ref { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); animation: fadeIn .6s ease both; }\n.topbar__ref span { color: var(--text); font-weight: 600; letter-spacing: .02em; }\n@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }\n\n/* ---------- 1. Map canvas (top ~40%) ---------- */\n.mapwrap { position: relative; }\n.map { height: 40vh; height: 40svh; min-height: 280px; max-height: 400px; overflow: hidden; background: #F4EADB; }\n.map__svg { display: block; width: 100%; height: 100%; }\n\n.route { fill: none; stroke-linecap: round; stroke-linejoin: round; }\n.route--base { stroke: rgba(184, 50, 37, .28); stroke-width: 6; stroke-dasharray: var(--len, 600); stroke-dashoffset: var(--len, 600); animation: drawRoute 1.3s .15s var(--ease) forwards; }\n.route--done { stroke: var(--primary); stroke-width: 6; }\n@keyframes drawRoute { to { stroke-dashoffset: 0; } }\n\n.pin { transform-box: fill-box; transform-origin: 50% 100%; animation: pinDrop .7s var(--ease) both; }\n.pin--dest { animation-delay: .35s; }\n@keyframes pinDrop { 0% { transform: translateY(-40px); opacity: 0; } 60% { transform: translateY(3px); opacity: 1; } 80% { transform: translateY(-3px); } 100% { transform: none; } }\n.pin.hop { animation: pinHop .7s var(--ease); }\n@keyframes pinHop { 0%, 100% { transform: none; } 35% { transform: translateY(-14px) scale(1.1); } 65% { transform: translateY(1px); } }\n\n#driver { animation: fadeIn .5s .9s ease both; }\n.driver__pulse { transform-box: fill-box; transform-origin: center; animation: driverPulse 1.8s ease-out infinite; }\n@keyframes driverPulse { 0% { transform: scale(1); opacity: .45; } 100% { transform: scale(2.4); opacity: 0; } }\n\n/* ETA banner overlay */\n.eta { position: absolute; left: var(--s4); right: var(--s4); bottom: var(--s4); display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 28px rgba(41, 33, 30, .18); animation: etaIn .6s .3s var(--ease) both; }\n@keyframes etaIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }\n.eta__text { min-width: 0; }\n.eta__title { font-size: 28px; line-height: 36px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }\n.eta__title.tick { animation: tick .35s var(--ease); }\n@keyframes tick { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n.eta__sub { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.eta__ok { display: none; flex: none; color: var(--success); }\n.eta.is-done { border-color: var(--success); }\n.eta.is-done .eta__ok { display: block; animation: pop .45s var(--ease); }\n.eta.is-done .eta__title { color: var(--success); }\n@keyframes pop { from { transform: scale(.3) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }\n\n/* ---------- Content ---------- */\n.content { display: flex; flex-direction: column; gap: var(--s4); padding: var(--s4) var(--s4) calc(var(--s8) + var(--safe-b)); }\n.content > * { animation: fadeUp .5s var(--ease) both; }\n.content > :nth-child(1) { animation-delay: .35s; }\n.content > :nth-child(2) { animation-delay: .43s; }\n.content > :nth-child(3) { animation-delay: .51s; }\n.content > :nth-child(4) { animation-delay: .59s; }\n@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: var(--s4); }\n\n/* ---------- 2. Timeline ---------- */\n.steps { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); }\n.steps__line { position: absolute; top: 13px; left: 12.5%; right: 12.5%; height: 4px; border-radius: 4px; background: var(--border); }\n.steps__fill { position: absolute; inset: 0; border-radius: inherit; background: var(--primary); transform-origin: left; transform: scaleX(var(--f, 0)); transition: transform 1s var(--ease); }\n.step { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 2px; text-align: center; }\n.step__dot { position: relative; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--disabled); background: var(--surface); color: #fff; transition: background-color .4s ease, border-color .4s ease, transform .4s var(--ease); }\n.step__dot svg { opacity: 0; transform: scale(.3); transition: opacity .25s ease, transform .4s var(--ease); }\n.step__label { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text-2); }\n.step__time { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; }\n.step__pulse { display: none; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--primary); }\n\n.step.is-done .step__dot { background: var(--primary); border-color: var(--primary); }\n.step.is-done .step__dot svg { opacity: 1; transform: none; }\n.step.is-done .step__label { color: var(--text); }\n.step.is-active .step__dot { border-color: var(--primary); background: var(--surface); transform: scale(1.12); }\n.step.is-active .step__dot::before { content: \"\"; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }\n.step.is-active .step__label { color: var(--primary); }\n.step.is-active .step__pulse { display: block; animation: stepPulse 1.6s ease-out infinite; }\n@keyframes stepPulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.1); opacity: 0; } }\n.step.just-done .step__dot { animation: stepDone .5s var(--ease); }\n@keyframes stepDone { 0% { transform: scale(.8); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }\n\n/* ---------- 3. Partner ---------- */\n.partner__row { display: flex; align-items: center; gap: var(--s3); }\n.avatar { flex: none; width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--border); }\n.partner__info { flex: 1; min-width: 0; }\n.partner__name { font-size: 18px; line-height: 26px; font-weight: 600; }\n.partner__rating { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.call-btn { position: relative; flex: none; width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 50%; background: var(--bg); color: var(--primary); transition: background-color .15s ease, transform .12s ease, box-shadow .2s ease; }\n.call-btn:hover { background: var(--primary-subtle); }\n.call-btn:active { transform: scale(.92); }\n.call-btn:hover svg { animation: ring .6s ease; }\n@keyframes ring { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-16deg); } 40% { transform: rotate(14deg); } 60% { transform: rotate(-10deg); } 80% { transform: rotate(6deg); } }\n.safety { display: flex; align-items: flex-start; gap: var(--s2); margin-top: var(--s3); padding: var(--s2) var(--s3); border-radius: 12px; background: #E8F3EC; color: var(--text); font-size: 12px; line-height: 16px; font-weight: 500; }\n.safety svg { flex: none; color: var(--success); margin-top: 0; }\n.safety strong { font-weight: 600; }\n\n/* ---------- 4. Summary drawer ---------- */\n.drawer { padding: 0; overflow: hidden; }\n.drawer__head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 64px; padding: var(--s3) var(--s4); border: 0; background: transparent; text-align: left; }\n.drawer__head:focus-visible { outline-offset: -4px; }\n.drawer__title { display: flex; flex-direction: column; }\n.drawer__meta { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.drawer__chev { flex: none; color: var(--text-2); transition: transform .35s var(--ease); }\n.drawer.is-open .drawer__chev { transform: rotate(180deg); }\n.drawer__panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }\n.drawer.is-open .drawer__panel { grid-template-rows: 1fr; }\n.drawer__inner { min-height: 0; overflow: hidden; padding: 0 var(--s4); opacity: 0; transition: opacity .3s ease, padding .4s var(--ease); }\n.drawer.is-open .drawer__inner { opacity: 1; padding-bottom: var(--s4); }\n.lines { display: flex; flex-direction: column; gap: var(--s2); padding-top: var(--s3); border-top: 1px solid var(--border); }\n.lines li { display: flex; justify-content: space-between; gap: var(--s3); font-size: 14px; line-height: 20px; }\n.lines li span:last-child { font-variant-numeric: tabular-nums; }\n.paid { display: flex; justify-content: space-between; align-items: baseline; margin-top: var(--s3); padding-top: var(--s3); border-top: 1px dashed var(--border); font-size: 14px; font-weight: 600; }\n.paid strong { font-size: 18px; line-height: 24px; font-weight: 700; }\n.paid__via { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.instr { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s4); padding: var(--s3); border-radius: 12px; background: var(--primary-subtle); font-size: 14px; line-height: 18px; }\n.instr__emoji { font-size: 20px; }\n.instr__k { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }\n.drawer__addr { margin-top: var(--s3); font-size: 14px; line-height: 20px; }\n\n/* ---------- Buttons ---------- */\n.btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 48px; padding: 0 var(--s5); border-radius: 12px; font-size: 15px; line-height: 20px; font-weight: 600; transition: background-color .15s ease, transform .12s ease, border-color .15s ease; }\n.btn--outline { background: transparent; border: 1px solid var(--border); color: var(--text); }\n.btn--outline:hover { background: var(--surface); border-color: #D7C5B5; }\n.btn:active { transform: scale(.98); }\n.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--text); }\n.icon-btn:hover { background: rgba(41, 33, 30, .06); }\n\n/* ---------- Sheet ---------- */\n.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(41, 33, 30, .5); opacity: 0; transition: opacity .25s ease; }\n.scrim.is-open { opacity: 1; }\n.sheet { position: fixed; z-index: 51; left: 50%; bottom: 0; width: min(100%, 480px); max-height: 88vh; overflow-y: auto; padding: var(--s2) var(--s4) calc(var(--s6) + var(--safe-b)); background: var(--bg); border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(41, 33, 30, .2); transform: translate(-50%, 100%); transition: transform .3s var(--ease); }\n.sheet.is-open { transform: translate(-50%, 0); }\n.sheet__handle { width: 40px; height: 4px; margin: 0 auto var(--s2); border-radius: 4px; background: var(--border); }\n.sheet__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s2); }\n.help { display: flex; flex-direction: column; gap: var(--s2); }\n.help button { width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--s4); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 600; text-align: left; transition: border-color .15s ease, transform .12s ease; }\n.help button::after { content: \"\u203a\"; font-size: 20px; color: var(--text-2); }\n.help button:hover { border-color: var(--primary); }\n.help button:active { transform: scale(.985); }\n\n/* ---------- Toast ---------- */\n.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(var(--s6) + var(--safe-b)); transform: translateX(-50%); max-width: calc(min(100%, 480px) - 32px); padding: var(--s3) var(--s4); border-radius: 12px; background: var(--text); color: var(--bg); font-size: 14px; font-weight: 500; animation: toastIn .3s var(--ease); }\n.toast.is-out { animation: toastOut .2s ease forwards; }\n@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }\n@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 8px); } }\n\n/* ---------- Reduced motion ---------- */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; animation-delay: 0ms !important; }\n  .step__pulse, .driver__pulse { display: none !important; }\n  .route--base { stroke-dashoffset: 0; }\n}\n\n:host { display: block; }\n\n<\/style>\n<div class=\"app\" id=\"app\">\n\n    <\!-- Header -->\n    <header class=\"topbar\">\n      <a class=\"home-btn\" href=\"#menu\" aria-label=\"Back to home\">\n        <svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 18-6-6 6-6\"/><\/svg>\n        <span>Home<\/span>\n      <\/a>\n      <p class=\"topbar__ref\">Order #<span id=\"orderRef\">EP-88219<\/span><\/p>\n    <\/header>\n\n    <p class=\"sr-only\" id=\"liveRegion\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"><\/p>\n\n    <\!-- 1. Map / live status canvas -->\n    <section class=\"mapwrap\" aria-label=\"Live delivery map\">\n      <div class=\"map\" id=\"map\" role=\"img\" aria-label=\"Map showing the route from Ember and Plate to your address. Your driver is on the way.\">\n        <svg class=\"map__svg\" id=\"mapSvg\" viewBox=\"0 0 400 340\" preserveAspectRatio=\"xMidYMid slice\" aria-hidden=\"true\">\n          <rect width=\"400\" height=\"340\" fill=\"#F4EADB\"/>\n          <\!-- land use -->\n          <rect x=\"-20\" y=\"150\" width=\"120\" height=\"110\" rx=\"20\" fill=\"#E6EBD3\"/>\n          <rect x=\"250\" y=\"120\" width=\"100\" height=\"70\" rx=\"14\" fill=\"#E6EBD3\"/>\n          <path d=\"M-10 250 C 80 220, 160 270, 260 235 S 380 210, 420 240 L 420 340 L -10 340 Z\" fill=\"#E1E8E8\" opacity=\".85\"/>\n          <\!-- roads -->\n          <g stroke=\"#FFFFFF\" stroke-linecap=\"round\" fill=\"none\">\n            <path d=\"M-10 120 L 410 120\" stroke-width=\"12\"/>\n            <path d=\"M-10 70 L 410 70\" stroke-width=\"12\"/>\n            <path d=\"M60 -10 L 60 230\" stroke-width=\"12\"/>\n            <path d=\"M180 -10 L 180 230\" stroke-width=\"10\"/>\n            <path d=\"M340 -10 L 340 230\" stroke-width=\"10\"/>\n            <path d=\"M-10 180 L 410 180\" stroke-width=\"7\"/>\n            <path d=\"M120 -10 L 120 230\" stroke-width=\"5\"/>\n            <path d=\"M260 -10 L 260 230\" stroke-width=\"5\"/>\n            <path d=\"M-10 25 L 410 25\" stroke-width=\"5\"/>\n          <\/g>\n          <g stroke=\"#E6D9CD\" stroke-width=\"1.100\" fill=\"none\" opacity=\".9\">\n            <path d=\"M-10 120 L 410 120\"/><path d=\"M-10 70 L 410 70\"/><path d=\"M6
